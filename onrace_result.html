<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - オンラインレース実況</title>
<style>
  :root {
    --bg-color: #0d0914;
    --panel-bg: #181224;
    --border-color: #3b2d54;
    --accent-purple: #8b5cf6;
    --accent-green: #00ff66;
    --player-color: #3b82f6;
    --opponent-color: #ef4444;
    --gold-color: #ffcc00;
    --scroll-speed: 0.38s;
  }
  
  body { 
    font-family: "Courier New", Consolas, "Hiragino Kaku Gothic ProN", monospace, sans-serif; 
    background: var(--bg-color); 
    color: #fff; 
    padding: 10px; 
    max-width: 650px; 
    margin: 0 auto; 
  }

  .race-title-panel {
    background: linear-gradient(135deg, #241938, #120c1f);
    border: 2px solid var(--accent-purple);
    border-radius: 8px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
    margin-bottom: 10px;
  }
  .race-header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .race-num-badge { color: var(--gold-color); font-size: 0.85em; font-weight: bold; }
  .btn-header-reset {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid var(--opponent-color);
    color: #ffaaaa;
    font-size: 0.75em;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .btn-header-reset:hover { background: rgba(239, 68, 68, 0.4); }

  .race-venue-dist { font-size: 1.2em; font-weight: bold; color: #fff; margin: 2px 0; }
  .race-condition-badge {
    display: inline-block; background: #2a352c; color: var(--accent-green);
    border: 1px solid var(--accent-green); padding: 1px 8px; border-radius: 12px; font-size: 0.8em; font-weight: bold;
  }

  /* レーストラック ＆ 背景 */
  #track-container { 
    background: #4d9e59; 
    border: 3px solid #e2e8f0; 
    border-radius: 8px; 
    position: relative; 
    height: 380px; 
    overflow: hidden; 
    box-shadow: inset 0 0 24px rgba(0,0,0,0.65), 0 6px 16px rgba(0,0,0,0.5); 
    margin-bottom: 10px;
  }

  #track-container.hit-stop * {
    animation-play-state: paused !important;
  }

  .track-backdrop {
    position: absolute;
    top: 0; left: 0; right: 0; width: 100%;
    height: 96px;
    background: linear-gradient(to bottom,
      #3b8246 0px, #3b8246 14px,
      #e2e8f0 14px, #cbd5e1 18px,
      #9a7b69 18px, #856756 50px,
      #235c34 50px, #194526 74px,
      #f8fafc 74px, #cbd5e1 81px,
      transparent 81px
    );
    z-index: 1;
    pointer-events: none;
  }
  #track-container.dirt-track .track-backdrop {
    background: linear-gradient(to bottom,
      #7c5d4b 0px, #7c5d4b 14px,
      #e2e8f0 14px, #cbd5e1 18px,
      #478c4f 18px, #3b7642 50px,
      #2c4c32 50px, #1e3623 74px,
      #f8fafc 74px, #cbd5e1 81px,
      transparent 81px
    );
  }

  .track-rail-posts {
    position: absolute;
    top: 76px; left: 0; right: 0; width: 100%;
    height: 22px;
    background: repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 64px,
      #e2e8f0 64px,
      #94a3b8 70px
    );
    z-index: 2;
    pointer-events: none;
  }

  .track-surface {
    position: absolute;
    top: 94px; bottom: 0; left: 0; right: 0; width: 100%;
    background: repeating-linear-gradient(
      90deg,
      #4ea84a 0px,
      #4ea84a 90px,
      #5cb857 90px,
      #5cb857 180px
    );
    z-index: 1;
    pointer-events: none;
  }
  #track-container.dirt-track .track-surface {
    background: repeating-linear-gradient(
      90deg,
      #8c6244 0px,
      #8c6244 90px,
      #996d4e 90px,
      #996d4e 180px
    );
  }

  #track-container.running.dir-rtl .track-rail-posts,
  #track-container.running.dir-rtl .track-surface {
    animation: scrollGroundLTR var(--scroll-speed) linear infinite;
  }
  #track-container.running.dir-ltr .track-rail-posts,
  #track-container.running.dir-ltr .track-surface {
    animation: scrollGroundRTL var(--scroll-speed) linear infinite;
  }

  @keyframes scrollGroundLTR {
    from { background-position: 0 0; }
    to   { background-position: 180px 0; }
  }
  @keyframes scrollGroundRTL {
    from { background-position: 0 0; }
    to   { background-position: -180px 0; }
  }

  #start-gate {
    position: absolute;
    top: 65px;
    width: 90px;
    height: 235px;
    z-index: 8;
    pointer-events: none;
    transition: left 2.0s cubic-bezier(0.4, 0, 0.8, 1), opacity 0.8s ease-in 0.8s;
    display: none;
  }

  #furlong-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 3;
    pointer-events: none;
    overflow: hidden;
  }
  .furlong-pole {
    position: absolute;
    top: 22px;
    width: 46px;
    height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: left 1.8s linear;
  }
  .furlong-sign {
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 900;
    font-family: Arial, sans-serif;
    box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    letter-spacing: -0.5px;
  }
  .furlong-sign.jra-blue {
    background: #ffffff;
    color: #1d4ed8;
    border: 3.5px solid #1d4ed8;
  }
  .furlong-sign.jra-red {
    background: #ffffff;
    color: #dc2626;
    border: 3.5px solid #dc2626;
    box-shadow: 0 0 14px rgba(220,38,38,0.85);
  }
  .furlong-stick {
    width: 5px;
    height: 36px;
    background: repeating-linear-gradient(to bottom, #ffffff 0px, #ffffff 7px, #dc2626 7px, #dc2626 14px);
    box-shadow: 1px 0 4px rgba(0,0,0,0.5);
  }

  .moving-goal-pole {
    position: absolute;
    top: 18px;
    bottom: 0;
    width: 24px;
    z-index: 6;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .moving-goal-flag {
    background: linear-gradient(135deg, #d97706, #facc15);
    color: #000;
    border: 2px solid #fff;
    font-weight: 900;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.6);
    white-space: nowrap;
    margin-bottom: 2px;
  }
  .moving-goal-line {
    width: 4px;
    flex: 1;
    background: linear-gradient(to bottom, #ffffff, #ffcc00);
    box-shadow: 0 0 16px rgba(255, 204, 0, 1);
  }

  #flash-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #ffffff; opacity: 0; z-index: 70; pointer-events: none;
    transition: opacity 0.08s ease-out;
  }
  #flash-overlay.flash {
    opacity: 0.92;
    transition: none;
  }

  #lanes {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 10;
    pointer-events: none;
  }

  .horse-icon {
    position: absolute;
    width: 94px;
    height: 61px;
    transform-origin: center center;
    will-change: left, top;
  }
  .horse-icon.dir-ltr { transform: scaleX(-1); }

  .horse-shadow {
    position: absolute;
    bottom: 3px; left: 12px; width: 68px; height: 8px;
    background: rgba(0, 0, 0, 0.45); border-radius: 50%;
  }

  .horse-bounce-wrap { width: 100%; height: 100%; position: relative; }
  #track-container.running .horse-bounce-wrap {
    animation: gallopBounce 0.32s ease-in-out infinite alternate;
  }
  #track-container.running .horse-shadow {
    animation: shadowScale 0.32s ease-in-out infinite alternate;
  }

  @keyframes gallopBounce {
    0%   { transform: translateY(2.5px) rotate(-1.0deg); }
    100% { transform: translateY(-4.0px) rotate(1.2deg); }
  }
  @keyframes shadowScale {
    0%   { transform: scaleX(1.04); opacity: 0.58; }
    100% { transform: scaleX(0.84); opacity: 0.25; }
  }

  /* ★馬の脚 4本連動 3コマ×4拍リズム（0-25%伸展, 25-50%接地, 50-100%滞空収縮ホールド） */
  .leg-frame-1 { opacity: 1; }
  .leg-frame-2 { opacity: 0; }
  .leg-frame-3 { opacity: 0; }

  #track-container.running .leg-frame-1 {
    animation: animLegF1 0.32s steps(1) infinite;
  }
  #track-container.running .leg-frame-2 {
    animation: animLegF2 0.32s steps(1) infinite;
  }
  #track-container.running .leg-frame-3 {
    animation: animLegF3 0.32s steps(1) infinite;
  }

  @keyframes animLegF1 {
    0%, 24.9% { opacity: 1; }
    25%, 100% { opacity: 0; }
  }
  @keyframes animLegF2 {
    0%, 24.9% { opacity: 0; }
    25%, 49.9% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @keyframes animLegF3 {
    0%, 49.9% { opacity: 0; }
    50%, 100% { opacity: 1; }
  }

  /* 足元の砂埃・蹴り土エフェクト */
  .horse-dust-wrap {
    position: absolute;
    bottom: 2px;
    right: 8px;
    width: 20px;
    height: 14px;
    pointer-events: none;
  }
  .dust-puff {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    transform-origin: center;
  }
  /* 芝コース用（緑片 ＆ 白飛沫） */
  .dust-puff.p1 {
    width: 6px; height: 6px; background: #e2e8f0;
    box-shadow: 2px -2px 0 1px #22c55e;
  }
  .dust-puff.p2 {
    width: 8px; height: 5px; background: rgba(240, 253, 244, 0.85);
    box-
