<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レース構築画面</title>
  <style>
    /* 必要なスタイルをここに記述 */
    body { font-family: sans-serif; padding: 20px; }
  </style>
</head>
<body>
  <h1>レースデータ構築中...</h1>
  <div id="statusMessage">Firebaseからデータを読み込み、レースを生成しています。</div>

  <!-- Firebase SDK & メインロジック -->
  <script type="module">
    // 1. Firebaseのインポート (バージョンは環境に合わせてください)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    
    // 2. 外部処理ファイルのインポート (パスを /js/ に修正)
    import { determineStrategy } from "./js/mob.js";

    // Firebaseの初期化設定 (ご自身の環境のものに書き換えてください)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // グローバル変数
    let currentUser = null;
    let globalUserData = null;
    let HORSES_MASTER = {};
    let strategyMasterData = []; // json等から読み込む作戦マスター
    let fullRaceGrids = [];      // 5レース分の構築データ

    // 認証状態の監視
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await initializeData();
      } else {
        alert("ログインが必要です。");
        window.location.href = 'index.html';
      }
    });

    // データの初期読み込み
    async function initializeData() {
      try {
        // 1. ユーザーデータの取得
        const userRef = ref(db, `users/${currentUser.uid}`);
        const userSnap = await get(userRef);
        if (userSnap.exists()) {
          globalUserData = userSnap.val();
        }

        // 2. マスターデータの取得 (例: /data/horses.json, /data/strategy.json)
        // ※ 実際は fetch 等で json を読み込むか、Firebaseから取得します
        const horseRes = await fetch('./data/horses.json');
        HORSES_MASTER = await horseRes.json();

        const strategyRes = await fetch('./data/strategy.json');
        strategyMasterData = await strategyRes.json();

        // 3. レースグリッドの構築
        buildRaceGridsFromFirebase();

        // 4. 次の画面へ遷移等の処理
        document.getElementById('statusMessage').innerText = "レース構築完了！遷移します...";
        console.log("生成されたレースデータ:", fullRaceGrids);
        
        // 構築した fullRaceGrids をローカルストレージ等に保存してレース画面へ渡す例
        // localStorage.setItem('currentRaceGrids', JSON.stringify(fullRaceGrids));
        // window.location.href = 'race_simulation.html';

      } catch (error) {
        console.error("データ初期化エラー:", error);
        document.getElementById('statusMessage').innerText = "エラーが発生しました。";
      }
    }

    // Firebaseの保存済み current_match から5レース分の対戦グリッドを正確に構築
    function buildRaceGridsFromFirebase() {
      const status = globalUserData?.cpu_battle_status || {};
      const currentMatch = status.current_match || {};
      const playerEntries = currentMatch.player_entries || [];
      const cpuEntries = currentMatch.cpu_entries || [];
      const racesMobIds = currentMatch.races_mob_ids || {};
      const racesMobGates = currentMatch.races_mob_gates || []; // モブ馬の枠順配列

      if (playerEntries.length < 5) {
        alert("対戦エントリーデータが見つかりません。お題画面へ戻ります。");
        // window.location.href = 'battle.html';
        return;
      }

      fullRaceGrids = [];

      for (let rIdx = 0; rIdx < 5; rIdx++) {
        const grid = [];

        // --- 1. プレイヤー馬 ---
        const pEntry = playerEntries[rIdx];
        const pMaster = HORSES_MASTER[pEntry.horse_id] || { name: "自馬", horse_id: pEntry.horse_id };
        const playerHorse = {
          ...pMaster,
          isPlayer: true,
          isCpu: false,
          tactic: pEntry.strategy || "先行",
          level: pEntry.strategy_level || 3,
          gate_number: pEntry.gate_number || 1
        };
        grid.push(playerHorse);

        // --- 2. CPU馬 (mob.js の determineStrategy を使用) ---
        const cEntry = cpuEntries[rIdx] || {};
        const cMaster = HORSES_MASTER[cEntry.horse_id] || { name: "CPU馬", horse_id: cEntry.horse_id };
        const cpuStyle = cMaster.style || cMaster.running_style || "先行";
        const cpuGate = cEntry.gate_number || 2;
        
        // 外部関数呼び出し (isCpuRival = true)
        const cpuStrat = determineStrategy(cEntry.horse_id, cpuStyle, cpuGate, strategyMasterData, true);

        const cpuHorse = {
          ...cMaster,
          isPlayer: false,
          isCpu: true,
          tactic: cpuStrat.tactic,
          level: cpuStrat.level,
          gate_number: cpuGate
        };
        grid.push(cpuHorse);

        // --- 3. モブ馬 (mob.js の determineStrategy を使用) ---
        const mobIds = racesMobIds[rIdx] || racesMobIds[String(rIdx)] || [];
        const mobGates = racesMobGates[rIdx] || [];

        mobIds.forEach((mobId, mIdx) => {
          const mobMaster = HORSES_MASTER[mobId] || { name: "モブ馬", horse_id: mobId };
          const mobStyle = mobMaster.style || mobMaster.running_style || "自在";
          const mobGate = mobGates[mIdx] || (mIdx + 3); 
          
          // 外部関数呼び出し (isCpuRival = false)
          const mobStrat = determineStrategy(mobId, mobStyle, mobGate, strategyMasterData, false);

          grid.push({
            ...mobMaster,
            isPlayer: false,
            isCpu: false,
            tactic: mobStrat.tactic,
            level: mobStrat.level,
            gate_number: mobGate
          });
        });

        fullRaceGrids.push(grid);
      }
    }
  </script>
</body>
</html>
