<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - デッキ構築 & デック診断</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.95);
    --panel-sub: #f4fbf5;
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --slot-empty: #f2f8f3;
    --gold: #c29b1d;
    --gold-bg: #fffdf0;
    --danger: #d32f2f;
    --warn: #d97706;
    --success: #2e7d32;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 10px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  h1, h2, h3 { margin: 0 0 6px 0; color: var(--accent-color); }
  .container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 1150px; }
  
  .lock-banner {
    background-color: #d9534f;
    color: #ffffff;
    padding: 10px 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }

  .is-locked {
    pointer-events: none !important;
    opacity: 0.55 !important;
    filter: grayscale(30%);
  }

  /* メインヘッダー */
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .btn-back:hover { background: var(--accent-color); color: #ffffff; }

  /* 画面切り替え メインタブ */
  .main-mode-tabs {
    display: flex;
    background: #e2efe3;
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    gap: 3px;
  }
  .mode-tab-btn {
    border: none;
    background: transparent;
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .mode-tab-btn.active {
    background: #ffffff;
    color: var(--accent-color);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  /* デッキ切り替えタブ (MAIN 1 / MAIN 2) */
  .deck-tabs { display: flex; gap: 6px; }
  .tab-btn {
    background-color: #e2efe3;
    color: var(--text-sub);
    border: 1px solid var(--border-color);
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
  }
  .tab-btn.active {
    background-color: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  .deck-name-container { display: flex; align-items: center; gap: 6px; }
  .deck-name-input {
    background: #ffffff; border: 1px solid var(--border-color);
    color: var(--text-main); padding: 4px 8px; border-radius: 4px; font-size: 13px;
    font-weight: bold;
  }
  .btn-change-name {
    background: var(--accent-color);
    color: #ffffff;
    border: none;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 11px;
    white-space: nowrap;
  }
  .btn-change-name:hover { background: var(--accent-hover); }

  .save-load-panel {
    background-color: var(--panel-bg);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12px;
  }
  .sync-status-row { display: flex; justify-content: space-between; align-items: center; }
  .sync-status { font-size: 11px; color: var(--text-sub); font-weight: bold; }
  
  .deck-storage-section {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    align-items: center;
    border-top: 1px dashed var(--border-color);
    padding-top: 6px;
  }
  .storage-title { font-weight: bold; font-size: 11px; color: var(--accent-color); margin-right: 4px; }
  .storage-slot-box {
    display: flex;
    background: #f2f8f3;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    overflow: hidden;
    font-size: 11px;
  }
  .storage-label {
    background: #e2efe3;
    padding: 3px 5px;
    font-weight: bold;
    color: var(--text-sub);
    display: flex;
    align-items: center;
  }
  .btn-storage-save, .btn-storage-load {
    background: #ffffff;
    border: none;
    padding: 3px 6px;
    cursor: pointer;
    font-weight: bold;
    color: var(--text-main);
    font-size: 11px;
  }
  .btn-storage-save:hover { background: #d0edd3; color: var(--accent-hover); }
  .btn-storage-load { border-left: 1px solid var(--border-color); color: var(--accent-color); }
  .btn-storage-load:hover { background: var(--accent-color); color: #ffffff; }
  .btn-storage-load:disabled { opacity: 0.5; cursor: not-allowed; }
  
  /* --- 編成モード レイアウト --- */
  .main-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; }
  @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }
  .panel {
    background-color: var(--panel-bg);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  
  .slots-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 4px;
    max-height: 620px;
    overflow-y: auto;
  }
  
  .slot-card {
    background-color: var(--slot-empty);
    border: 1px dashed var(--border-color);
    border-radius: 5px;
    padding: 6px;
    min-height: 135px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    font-size: 11px;
    box-sizing: border-box;
    min-width: 0;
  }
  .slot-card.filled { border-style: solid; border-color: #a0ca33; background-color: #ffffff; }
  .slot-card.selected { border-color: var(--gold); box-shadow: 0 0 5px rgba(194, 155, 29, 0.6); }
  .card-header-slot { width: 100%; margin-bottom: 2px; }
  .card-name-slot {
    font-weight: bold; font-size: 11px; letter-spacing: -0.3px;
    color: var(--text-main); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; line-height: 1.2;
  }
  .card-body-slot { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: 2px 0; }
  .card-details-slot {
    display: flex; flex-direction: column; gap: 1px; color: var(--text-sub);
    font-size: 10px; font-weight: bold; line-height: 1.2; flex: 1;
  }
  .card-details-slot div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-radar-box { width: 65px; height: 65px; flex-shrink: 0; }

  .empty-text { color: var(--text-sub); text-align: center; margin: auto; font-size: 11px; }
  .filter-box { display: flex; flex-direction: column; gap: 6px; background: #f2f8f3; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 12px; }
  .filter-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .filter-input, .filter-select {
    background-color: #ffffff; border: 1px solid var(--border-color);
    color: var(--text-main); padding: 5px 8px; border-radius: 4px; flex: 1; font-size: 12px;
  }
  .kana-chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .kana-chip {
    background: #ffffff; border: 1px solid var(--border-color);
    color: var(--text-sub); padding: 2px 6px; border-radius: 4px; font-size: 11px;
    cursor: pointer; font-weight: bold;
  }
  .kana-chip:hover, .kana-chip.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }
  
  .pool-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; max-height: 480px; overflow-y: auto; }
  .pool-card {
    background-color: #ffffff; border: 1px solid var(--border-color); border-radius: 6px;
    padding: 6px 8px; cursor: pointer; font-size: 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0;
  }
  .pool-card:hover { border-color: var(--accent-color); background-color: #f7fbf7; }
  .pool-name {
    font-weight: bold; font-size: 11.5px; letter-spacing: -0.3px; color: var(--text-main);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pool-surface-dist {
    font-size: 10px; color: var(--text-sub); font-weight: bold; display: flex;
    flex-direction: column; gap: 1px; line-height: 1.2; flex: 1;
  }
  .pool-radar-row {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    background: #f8faf8; border: 1px solid #e2efe3; border-radius: 4px; padding: 4px 8px;
  }
  .pool-radar-box { width: 65px; height: 65px; flex-shrink: 0; }

  .card-abilities-row {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5px;
    margin-top: 4px; width: 100%; box-sizing: border-box;
  }
  .ability-btn {
    background: #e2efe3; border: 1px solid var(--accent-color); color: var(--accent-color);
    border-radius: 3px; padding: 1px 0px; font-size: 8.5px; font-weight: bold;
    text-align: center; line-height: 1.2; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; letter-spacing: -0.5px;
  }
  .ability-btn.empty { visibility: hidden; border-color: transparent; background: transparent; }

  /* ========================================================
     デック精密診断パネル スタイル（清潔感のあるアナリティクスUI）
     ======================================================== */
  .diagnosis-layout {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .diag-sub-tabs {
    display: flex;
    gap: 6px;
    background: var(--panel-bg);
    padding: 6px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  .diag-sub-btn {
    flex: 1;
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .diag-sub-btn.active {
    background: var(--accent-color);
    color: #ffffff;
    border-color: var(--accent-color);
    box-shadow: 0 2px 5px rgba(45, 106, 55, 0.2);
  }

  .diag-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .diag-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 8px;
  }
  .diag-title {
    font-size: 14px;
    font-weight: 800;
    color: var(--accent-color);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 総合スコアエリア */
  .score-overview-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-sub);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px 18px;
  }
  .score-rank-group {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .score-rank-badge {
    font-size: 38px;
    font-weight: 900;
    line-height: 1;
    color: var(--accent-color);
  }
  .score-rank-badge.rank-s { color: var(--gold); text-shadow: 0 1px 3px rgba(212, 175, 55, 0.4); }
  .score-val-text {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-sub);
  }
  .score-val-bold {
    font-size: 20px;
    font-weight: 900;
    color: var(--text-main);
  }
  .spec-mini-summary {
    font-size: 11.5px;
    color: var(--text-sub);
    line-height: 1.5;
    text-align: right;
  }

  /* チャート＆メーターエリア */
  .radar-metrics-grid {
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 15px;
    align-items: center;
  }
  @media (max-width: 600px) {
    .radar-metrics-grid { grid-template-columns: 1fr; justify-items: center; }
  }

  .metrics-list-box {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
  }
  .metric-bar-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 11px;
  }
  .metric-label-group {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    color: var(--text-sub);
  }
  .bar-track {
    width: 100%;
    height: 7px;
    background: #e2efe3;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #4caf50, var(--accent-color));
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  /* チェックポイント・改善アドバイス */
  .advice-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .advice-item {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.45;
  }
  .advice-item.danger { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; }
  .advice-item.warn { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; }
  .advice-item.ok { background: #e8f5e9; border: 1px solid #c8e6c9; color: #1b5e20; }
  .advice-badge {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
  }
  .advice-badge.danger { background: #ef4444; color: #fff; }
  .advice-badge.warn { background: #f59e0b; color: #fff; }
  .advice-badge.ok { background: #10b981; color: #fff; }
</style>
</head>
<body>
<div class="container">
  <div id="lockBanner" class="lock-banner" style="display: none;">
    🔒 CPU対戦が進行中のため、デックの編集・カード入れ替えはロックされています。
  </div>

  <!-- メインヘッダー -->
  <div class="header-panel">
    <div class="header-left">
      <a href="index.html" class="btn-back">← メインメニュー</a>
      
      <!-- メイン切り替えタブ（編成 ⇄ 診断） -->
      <div class="main-mode-tabs">
        <button class="mode-tab-btn active" id="btnModeBuild" onclick="switchMainMode('build')">
          🗂️ デック編成
        </button>
        <button class="mode-tab-btn" id="btnModeDiag" onclick="switchMainMode('diag')">
          📊 デック診断
        </button>
      </div>
    </div>
    
    <div class="deck-name-container" id="headerNameGroup">
      デッキ名: 
      <input type="text" id="deckNameInput" class="deck-name-input" value="読み込み中...">
      <button id="btnChangeDeckName" class="btn-change-name">名前変更</button>
    </div>
    <div class="deck-info">
      <span>編成: <span id="countDisplay">0</span> / 18</span>
    </div>
  </div>

  <!-- ==========================================
       1. デック編成セクション（通常表示）
       ========================================== -->
  <div id="buildSection">
    <div class="save-load-panel">
      <div class="sync-status-row">
        <div class="deck-tabs">
          <button class="tab-btn active" id="tabA">🏇 MAIN 1 編成</button>
          <button class="tab-btn" id="tabB">🏇 MAIN 2 編成</button>
        </div>
        <span class="sync-status" id="syncStatus">☁️ Cloud Status: 準備中</span>
      </div>
      <div class="deck-storage-section">
        <span class="storage-title">💾 デック保管庫:</span>
        <div id="deckStorageContainer" style="display: flex; gap: 5px; flex-wrap: wrap;"></div>
      </div>
    </div>

    <div class="main-layout" style="margin-top: 10px;">
      <div class="panel">
        <h3>18枚スロット （タップで外す/選択）</h3>
        <div id="slotsGrid" class="slots-grid"></div>
      </div>
      <div class="panel">
        <h3>未編成カードプール</h3>
        
        <div class="filter-box">
          <div class="filter-row">
            <input type="text" id="searchInput" class="filter-input" placeholder="🔍 馬名検索...">
            <select id="surfaceFilter" class="filter-select">
              <option value="ALL">適性: すべて</option>
              <option value="turf">芝のみ</option>
              <option value="dirt">ダートのみ</option>
              <option value="both">芝/ダ両方</option>
            </select>
            <select id="distanceFilter" class="filter-select">
              <option value="ALL">距離: すべて</option>
              <option value="1000">1000m</option>
              <option value="1200">1200m</option>
              <option value="1400">1400m</option>
              <option value="1600">1600m</option>
              <option value="1800">1800m</option>
              <option value="2000">2000m</option>
              <option value="2200">2200m</option>
              <option value="2400">2400m</option>
              <option value="2500">2500m</option>
              <option value="3000">3000m</option>
              <option value="3200">3200m</option>
            </select>
            <select id="potentialFilter" class="filter-select">
              <option value="ALL">ポテンシャル: すべて</option>
              <option value="14">PT 14</option>
              <option value="15">PT 15</option>
              <option value="16">PT 16</option>
              <option value="17">PT 17</option>
              <option value="18">PT 18</option>
              <option value="19">PT 19</option>
              <option value="20">PT 20</option>
              <option value="21">PT 21</option>
            </select>
          </div>
          <div class="filter-row">
            <select id="sortKey" class="filter-select">
              <option value="kana">順: 名前の順</option>
              <option value="potential">順: ポテンシャル</option>
              <option value="rarity">順: レアリティ</option>
            </select>
            <select id="sortOrder" class="filter-select">
              <option value="asc">昇順 (あ→ん / 低→高)</option>
              <option value="desc">降順 (ん→あ / 高→低)</option>
            </select>
          </div>
          <div class="kana-chips" id="kanaChips">
            <span class="kana-chip active" data-kana="ALL">すべて</span>
            <span class="kana-chip" data-kana="ア">ア行</span>
            <span class="kana-chip" data-kana="カ">カ行</span>
            <span class="kana-chip" data-kana="サ">サ行</span>
            <span class="kana-chip" data-kana="タ">タ行</span>
            <span class="kana-chip" data-kana="ナ">ナ行</span>
            <span class="kana-chip" data-kana="ハ">ハ行</span>
            <span class="kana-chip" data-kana="マ">マ行</span>
            <span class="kana-chip" data-kana="ヤ">ヤ行</span>
            <span class="kana-chip" data-kana="ラ">ラ行</span>
            <span class="kana-chip" data-kana="ワ">ワ行</span>
            <span class="kana-chip" data-kana="AZ">A-Z</span>
          </div>
        </div>
        <div id="poolGrid" class="pool-grid"></div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       2. デック診断セクション（タブ切り替えで表示）
       ========================================== -->
  <div id="diagnosisSection" class="diagnosis-layout" style="display: none;">
    <!-- 診断サブタブ -->
    <div class="diag-sub-tabs">
      <button class="diag-sub-btn active" id="diagSub0" onclick="switchDiagSubTarget(0)">🔬 MAIN DECK 1 の診断</button>
      <button class="diag-sub-btn" id="diagSub1" onclick="switchDiagSubTarget(1)">🔬 MAIN DECK 2 の診断</button>
      <button class="diag-sub-btn" id="diagSubSyn" onclick="switchDiagSubTarget('synergy')">🤝 2デック相互補完分析</button>
    </div>

    <div id="diagContentContainer">
      <!-- スクリプトにより自動描画 -->
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { cardRenderer } from './js/card_renderer.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let HORSES_MASTER = {};
  let HORSES_ARRAY = [];
  let SERIES_MASTER = [];
  let currentUser = null;
  let globalUserData = null;
  let activeDeckIdx = 0;
  let selectedSlotIndex = null;
  let selectedKana = "ALL";
  let isLocked = false;
  let currentMainMode = 'build'; // 'build' or 'diag'
  let currentDiagTarget = 0;     // 0, 1, or 'synergy'

  const RARITY_WEIGHT = { 
    "INF": 11, "SER": 10, "ULR": 9, "LGR": 8, "CLR": 7, 
    "TRR": 6, "RER": 5, "ANR": 4, "VIR": 3, "PRR": 3, "SPR": 2, "NOR": 1 
  };
  
  function getTurfVal(horse) {
    return Number(horse.turf_potential ?? horse.turf) || 0;
  }
  function getDirtVal(horse) {
    return Number(horse.dirt_potential ?? horse.dirt) || 0;
  }
  function getSurfaceText(horse) {
    const t = getTurfVal(horse);
    const d = getDirtVal(horse);
    if (t > 0 && d > 0) return t === d ? `芝/ダ${t}` : `芝${t}ダ${d}`;
    if (t > 0) return `芝${t}`;
    if (d > 0) return `ダ${d}`;
    return "-";
  }

  function getHorsePotential(horse) {
    if (horse.total_potential !== undefined && horse.total_potential !== null) return Number(horse.total_potential);
    if (horse.potential !== undefined && horse.potential !== null) return Number(horse.potential);
    return Math.max(getTurfVal(horse), getDirtVal(horse));
  }

  function getDistanceLinesHtml(horse) {
    const min = horse.min_distance || horse.distance_min;
    const max = horse.max_distance || horse.distance_max;
    if (min && max) {
      return `<div>${min}m</div><div>${max}m</div>`;
    }
    if (horse.distance) {
      const parts = String(horse.distance).split('-');
      if (parts.length === 2) {
        return `<div>${parts[0]}m</div><div>${parts[1]}m</div>`;
      }
      return `<div>${horse.distance}</div>`;
    }
    return `<div>-</div>`;
  }

  function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = msg;
  }

  function getAbilityBadgeHtml(horse) {
    let abilities = [];
    if (Array.isArray(horse.ability)) {
      abilities = horse.ability;
    } else if (typeof horse.ability === 'string' && horse.ability) {
      abilities = [horse.ability];
    } else if (horse.skill) {
      abilities = Array.isArray(horse.skill) ? horse.skill : [horse.skill];
    }

    let html = '<div class="card-abilities-row">';
    for (let i = 0; i < 3; i++) {
      if (abilities[i]) {
        const label = String(abilities[i]).substring(0, 3);
        html += `<div class="ability-btn" title="${abilities[i]}">${label}</div>`;
      } else {
        html += `<div class="ability-btn empty">---</div>`;
      }
    }
    html += '</div>';
    return html;
  }

  function createRadarSvgForHorse(horse) {
    const getVal = (val) => {
      if (typeof val === 'number') return val;
      return cardRenderer.rankToValue(val);
    };

    const paramsObj = {
      spdVal: getVal(horse.speed),
      stmVal: getVal(horse.stamina),
      shpVal: getVal(horse.sharp ?? horse.sharpness),
      jzkVal: getVal(horse.jizoku),
      gutVal: getVal(horse.guts)
    };
    const styleName = horse.style || horse.running_style || 'default';
    return cardRenderer.generateRadarSVG(paramsObj, styleName);
  }

  function updateLockUI() {
    const lockBanner = document.getElementById('lockBanner');
    const btnChangeDeckName = document.getElementById('btnChangeDeckName');
    const deckNameInput = document.getElementById('deckNameInput');

    if (isLocked) {
      if (lockBanner) lockBanner.style.display = 'block';
      if (btnChangeDeckName) btnChangeDeckName.disabled = true;
      if (deckNameInput) deckNameInput.disabled = true;

      document.getElementById('slotsGrid')?.classList.add('is-locked');
      document.getElementById('poolGrid')?.classList.add('is-locked');
    } else {
      if (lockBanner) lockBanner.style.display = 'none';
      if (btnChangeDeckName) btnChangeDeckName.disabled = false;
      if (deckNameInput) deckNameInput.disabled = false;

      document.getElementById('slotsGrid')?.classList.remove('is-locked');
      document.getElementById('poolGrid')?.classList.remove('is-locked');
    }
  }
  
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;
    setSyncStatus("☁️ データ読み込み中...");
    try {
      await cardRenderer.init();

      const [resH, resS] = await Promise.all([
        fetch('./data/horses_master.json'),
        fetch('./data/series_master.json')
      ]);

      if (resH.ok) {
        HORSES_ARRAY = await resH.json();
        HORSES_MASTER = {};
        HORSES_ARRAY.forEach(h => {
          HORSES_MASTER[String(h.horse_id)] = h;
        });
      }

      if (resS.ok) {
        SERIES_MASTER = await resS.json();
      }

      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        globalUserData = userDoc.data();
      } else {
        window.location.href = 'setup.html';
        return;
      }

      if (globalUserData.cpu_battle_status && globalUserData.cpu_battle_status.is_active) {
        isLocked = true;
      } else {
        isLocked = false;
      }

      const inventorySnap = await getDocs(collection(db, `users/${user.uid}/inventory`));
      globalUserData.cards = {};
      inventorySnap.forEach(docSnap => {
        globalUserData.cards[docSnap.id] = docSnap.data();
      });

      if (!globalUserData.decks || !Array.isArray(globalUserData.decks)) {
        globalUserData.decks = [
          { deck_name: "メインデッキ 1", horse_ids: new Array(18).fill(null), default_strategies: new Array(18).fill(null) },
          { deck_name: "メインデッキ 2", horse_ids: new Array(18).fill(null), default_strategies: new Array(18).fill(null) }
        ];
      }
      globalUserData.decks.forEach(deck => {
        if (!deck.horse_ids) deck.horse_ids = new Array(18).fill(null);
        if (!deck.default_strategies) deck.default_strategies = new Array(18).fill(null);
        while (deck.horse_ids.length < 18) deck.horse_ids.push(null);
        while (deck.default_strategies.length < 18) deck.default_strategies.push(null);
      });
      if (!globalUserData.saved_deck_slots || !Array.isArray(globalUserData.saved_deck_slots)) {
        globalUserData.saved_deck_slots = new Array(5).fill(null);
      }

      setSyncStatus("✅ クラウド同期完了");
      renderAll();
      updateLockUI();
    } catch (err) {
      console.error("初期化エラー:", err);
      setSyncStatus("❌ データ読み込みエラー");
    }
  });
  
  async function syncSave() {
    if (isLocked) return;
    setSyncStatus("☁️ 保存中...");
    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        decks: globalUserData.decks,
        saved_deck_slots: globalUserData.saved_deck_slots
      });
      setSyncStatus("✅ 保存完了");
    } catch (err) {
      console.error("保存失敗:", err);
      setSyncStatus("❌ 保存失敗");
    }
  }
  
  function renderAll() {
    const currentDeck = globalUserData.decks[activeDeckIdx];
    document.getElementById('deckNameInput').value = currentDeck.deck_name || `メインデッキ ${activeDeckIdx + 1}`;
    renderDeck();
    renderPool();
    renderStorageSlots();

    if (currentMainMode === 'diag') {
      renderDiagnosisPanel();
    }
  }
  
  function switchDeck(idx) {
    activeDeckIdx = idx;
    selectedSlotIndex = null;
    document.getElementById('tabA').className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    document.getElementById('tabB').className = `tab-btn ${idx === 1 ? 'active' : ''}`;
    renderAll();
  }
  
  document.getElementById('btnChangeDeckName').addEventListener('click', () => {
    if (isLocked) return;
    const inputVal = document.getElementById('deckNameInput').value.trim();
    if (!inputVal) {
      alert("デッキ名を入力してください。");
      return;
    }
    globalUserData.decks[activeDeckIdx].deck_name = inputVal;

    alert(`デッキ名を「${inputVal}」に変更しました！`);

  function renderStorageSlots() {
    const container = document.getElementById('deckStorageContainer');
    container.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      const slotBox = document.createElement('div');
      slotBox.className = 'storage-slot-box';
      
      const slotData = globalUserData.saved_deck_slots[i];
      const hasData = slotData && (Array.isArray(slotData) || (typeof slotData === 'object' && slotData.horse_ids && Array.isArray(slotData.horse_ids)));
      const slotName = (slotData && slotData.deck_name) ? slotData.deck_name : (hasData ? '保存済み' : '空き');
      
      slotBox.innerHTML = `
        <span class="storage-label">#${i + 1} ${slotName}</span>
        <button class="btn-storage-save" data-index="${i}" title="現在のデッキを保存">保存</button>
        ${hasData ? `<button class="btn-storage-load" data-index="${i}" ${isLocked ? 'disabled' : ''} title="このデッキを読込">読込</button>` : ''}
      `;
      container.appendChild(slotBox);
    }
    container.querySelectorAll('.btn-storage-save').forEach(btn => {
      btn.onclick = (e) => saveToDeckSlot(parseInt(e.target.getAttribute('data-index'), 10));
    });
    container.querySelectorAll('.btn-storage-load').forEach(btn => {
      btn.onclick = (e) => loadFromDeckSlot(parseInt(e.target.getAttribute('data-index'), 10));
    });
  }
  
  function saveToDeckSlot(slotIdx) {
    const currentDeck = globalUserData.decks[activeDeckIdx];
    globalUserData.saved_deck_slots[slotIdx] = {
      deck_name: currentDeck.deck_name || `メインデッキ ${activeDeckIdx + 1}`,
      horse_ids: [...currentDeck.horse_ids],
      default_strategies: currentDeck.default_strategies ? [...currentDeck.default_strategies] : new Array(18).fill(null)
    };
    syncSave();
    renderStorageSlots();
    alert(`セーブスロット #${slotIdx + 1} に「${globalUserData.saved_deck_slots[slotIdx].deck_name}」を保存しました！`);
  }
  
  function loadFromDeckSlot(slotIdx) {
    if (isLocked) {
      alert("CPU対戦中はデックのロードができません。");
      return;
    }
    const slotData = globalUserData.saved_deck_slots[slotIdx];
    if (!slotData) {
      alert(`スロット #${slotIdx + 1} にはデータがありません。`);
      return;
    }
    const savedIds = Array.isArray(slotData) ? slotData : slotData.horse_ids;
    const savedStrats = slotData.default_strategies || new Array(18).fill(null);
    const savedName = (slotData && slotData.deck_name) || `ロードデッキ #${slotIdx + 1}`;
    
    if (!savedIds || !Array.isArray(savedIds)) {
      alert(`スロット #${slotIdx + 1} のデータ構造が不正です。`);
      return;
    }
    const inventory = globalUserData.cards || {};
    const otherDeckIdx = activeDeckIdx === 0 ? 1 : 0;
    const otherDeckAssigned = new Set();
    if (globalUserData.decks[otherDeckIdx] && globalUserData.decks[otherDeckIdx].horse_ids) {
      globalUserData.decks[otherDeckIdx].horse_ids.forEach(id => {
        if (id) otherDeckAssigned.add(String(id));
      });
    }
    let missingCount = 0;
    let duplicateCount = 0;
    
    const cleanedIds = [];
    const cleanedStrats = [];

    savedIds.forEach((horseId, idx) => {
      if (!horseId) {
        cleanedIds.push(null);
        cleanedStrats.push(null);
        return;
      }
      const strId = String(horseId);
      const cardInfo = inventory[strId] || inventory[horseId];
      const count = (typeof cardInfo === 'object' && cardInfo !== null) ? (cardInfo.count || 1) : (cardInfo || 0);
      if (!cardInfo || count <= 0) {
        missingCount++;
        cleanedIds.push(null);
        cleanedStrats.push(null);
        return;
      }
      if (otherDeckAssigned.has(strId)) {
        duplicateCount++;
        cleanedIds.push(null);
        cleanedStrats.push(null);
        return;
      }
      otherDeckAssigned.add(strId);
      cleanedIds.push(strId);
      cleanedStrats.push(savedStrats[idx] || null);
    });

    while (cleanedIds.length < 18) {
      cleanedIds.push(null);
      cleanedStrats.push(null);
    }

    globalUserData.decks[activeDeckIdx].deck_name = savedName;
    globalUserData.decks[activeDeckIdx].horse_ids = cleanedIds.slice(0, 18);
    globalUserData.decks[activeDeckIdx].default_strategies = cleanedStrats.slice(0, 18);
    selectedSlotIndex = null;
    
    syncSave();
    renderAll();
    let msg = `スロット #${slotIdx + 1} の「${savedName}」をロードしました！`;
    if (missingCount > 0 || duplicateCount > 0) {
      msg += `\n\n【自動調整】\n`;
      if (missingCount > 0) msg += `- 未所持の馬 ${missingCount}頭 を外しました。\n`;
      if (duplicateCount > 0) msg += `- もう片方のデッキと重複する馬 ${duplicateCount}頭 を外しました。`;
    }
    alert(msg);
  }
  
  function renderDeck() {
    const grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    const currentSlots = globalUserData.decks[activeDeckIdx].horse_ids;
    let filledCount = 0;
    currentSlots.forEach((horseId, idx) => {
      const isSelected = (selectedSlotIndex === idx);
      const horse = horseId ? HORSES_MASTER[String(horseId)] : null;
      const div = document.createElement('div');
      
      if (horse) {
        filledCount++;
        const surfaceText = getSurfaceText(horse);
        const distLinesHtml = getDistanceLinesHtml(horse);
        const sexText = horse.sex || "-";
        const abilitiesHtml = getAbilityBadgeHtml(horse);
        const radarSvgHtml = createRadarSvgForHorse(horse);
        
        div.className = `slot-card filled ${isSelected ? 'selected' : ''}`;
        
        div.innerHTML = `
          <div class="card-header-slot">
            <div class="card-name-slot" title="${horse.name}">${horse.name}</div>
          </div>
          <div class="card-body-slot">
            <div class="card-details-slot">
              <div>${surfaceText}</div>
              ${distLinesHtml}
              <div>${horse.style || '-'}</div>
              <div>${sexText}</div>
            </div>
            <div class="slot-radar-box">
              ${radarSvgHtml}
            </div>
          </div>
          ${abilitiesHtml}
        `;
        div.onclick = () => removeCardFromSlot(idx);
      } else {
        div.className = `slot-card ${isSelected ? 'selected' : ''}`;
        div.innerHTML = `<div class="empty-text">${isSelected ? '【選択中】' : '＋ 空き枠'}</div>`;
        div.onclick = () => selectSlot(idx);
      }
      grid.appendChild(div);
    });
    document.getElementById('countDisplay').innerText = filledCount;
  }
  
  function selectSlot(idx) {
    if (isLocked) return;
    selectedSlotIndex = idx;
    renderDeck();
  }

  function removeCardFromSlot(idx) {
    if (isLocked) {
      alert("CPU対戦中はデックを変更できません。");
      return;
    }
    const currentDeck = globalUserData.decks[activeDeckIdx];
    if (!currentDeck.default_strategies) {
      currentDeck.default_strategies = new Array(18).fill(null);
    }
    
    currentDeck.horse_ids[idx] = null;
    currentDeck.default_strategies[idx] = null;

    selectedSlotIndex = idx;
    syncSave();
    renderDeck();
    renderPool();
  }
  
  function getKanaRowGroup(name) {
    if (!name) return "";
    const firstChar = name.charAt(0);
    const groups = {
      "ア": ["ア","イ","ウ","エ","オ", "ァ","ィ","ゥ","ェ","ォ"],
      "カ": ["カ","キ","ク","ケ","コ","ガ","ギ","グ","ゲ","ゴ"],
      "サ": ["サ","シ","ス","セ","ソ","ザ","ジ","ズ","ゼ","ゾ"],
      "タ": ["タ","チ","ツ","テ","ト","ダ","ヂ","ヅ","デ","ド","ッ"],
      "ナ": ["ナ","ニ","ヌ","ネ","ノ"],
      "ハ": ["ハ","ヒ","フ","ヘ","ホ","バ","ビ","ブ","ベ","ボ","パ","ピ","プ","ペ","ポ"],
      "マ": ["マ","ミ","ム","メ","モ"],
      "ヤ": ["ヤ","ユ","ヨ", "ャ","ュ","ョ"],
      "ラ": ["ラ","リ","ル","レ","ロ"],
      "ワ": ["ワ","ヲ","ン"]
    };
    for (const [groupKey, chars] of Object.entries(groups)) {
      if (chars.includes(firstChar)) return groupKey;
    }
    if (/^[A-Za-z]/.test(firstChar)) return "AZ";
    return "その他";
  }
  
  function renderPool() {
    const grid = document.getElementById('poolGrid');
    grid.innerHTML = '';
    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const surfaceVal = document.getElementById('surfaceFilter').value;
    const distanceVal = document.getElementById('distanceFilter').value;
    const potentialVal = document.getElementById('potentialFilter').value;
    const sortKey = document.getElementById('sortKey').value;
    const sortOrder = document.getElementById('sortOrder').value;
    const inventory = globalUserData.cards || {};
    const allAssignedHorses = new Set();
    if (globalUserData.decks && Array.isArray(globalUserData.decks)) {
      globalUserData.decks.forEach(deck => {
        if (deck.horse_ids) {
          deck.horse_ids.forEach(id => {
            if (id) allAssignedHorses.add(String(id));
          });
        }
      });
    }
    let poolList = [];
    for (const rawId in inventory) {
      const cardInfo = inventory[rawId];
      const count = (typeof cardInfo === 'object' && cardInfo !== null) ? (cardInfo.count || 1) : (cardInfo || 0);
      const strId = String(rawId);
      const horse = HORSES_MASTER[strId];
      if (count > 0 && horse && !allAssignedHorses.has(strId)) {
        if (searchText && !horse.name.toLowerCase().includes(searchText)) continue;
        
        const turfVal = getTurfVal(horse);
        const dirtVal = getDirtVal(horse);
        if (surfaceVal === 'turf' && turfVal <= 0) continue;
        if (surfaceVal === 'dirt' && dirtVal <= 0) continue;
        if (surfaceVal === 'both' && (turfVal <= 0 || dirtVal <= 0)) continue;
        if (distanceVal !== 'ALL') {
          const targetDist = parseInt(distanceVal, 10);
          let minD = horse.min_distance;
          let maxD = horse.max_distance;
          
          if (!minD && !maxD && horse.distance) {
            const parts = horse.distance.split('-').map(v => parseInt(v, 10));
            minD = parts[0];
            maxD = parts[1] || parts[0];
          }
          if (minD !== undefined && maxD !== undefined && !isNaN(minD) && !isNaN(maxD)) {
            if (targetDist < minD || targetDist > maxD) continue;
          }
        }
        if (potentialVal !== 'ALL') {
          const targetPot = parseInt(potentialVal, 10);
          const horsePot = getHorsePotential(horse);
          if (horsePot !== targetPot) continue;
        }
        if (selectedKana !== 'ALL') {
          const rowGroup = getKanaRowGroup(horse.name);
          if (rowGroup !== selectedKana) continue;
        }
        poolList.push({ horse, count });
      }
    }
    poolList.sort((a, b) => {
      let valA, valB;
      if (sortKey === 'kana') {
        valA = a.horse.name;
        valB = b.horse.name;
        const res = valA.localeCompare(valB, 'ja');
        return sortOrder === 'asc' ? res : -res;
      } else if (sortKey === 'potential') {
        valA = getHorsePotential(a.horse);
        valB = getHorsePotential(b.horse);
      } else if (sortKey === 'rarity') {
        valA = RARITY_WEIGHT[a.horse.rarity] || 0;
        valB = RARITY_WEIGHT[b.horse.rarity] || 0;
      }
      return sortOrder === 'asc' ? valA - valB : valB - valA;
    });
    
    poolList.forEach(({ horse }) => {
      const surfaceText = getSurfaceText(horse);
      const distLinesHtml = getDistanceLinesHtml(horse);
      const sexText = horse.sex || "-";
      const abilitiesHtml = getAbilityBadgeHtml(horse);
      const radarSvgHtml = createRadarSvgForHorse(horse);
      
      const div = document.createElement('div');
      div.className = 'pool-card';
      
      div.innerHTML = `
        <div class="pool-name">${horse.name}</div>
        <div class="pool-radar-row">
          <div class="pool-surface-dist">
            <div>${surfaceText}</div>
            ${distLinesHtml}
            <div>${horse.style || '-'}</div>
            <div>${sexText}</div>
          </div>
          <div class="pool-radar-box">
            ${radarSvgHtml}
          </div>
        </div>
        ${abilitiesHtml}
      `;
      div.onclick = () => addCardToDeck(String(horse.horse_id));
      grid.appendChild(div);
    });
    
    if (poolList.length === 0) {
      grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #666; font-size: 12px; padding: 20px;">条件に合う未編成カードがありません</div>';
    }
  }
  
  function addCardToDeck(horseId) {
    if (isLocked) {
      alert("CPU対戦中はデックを変更できません。");
      return;
    }
    const currentDeck = globalUserData.decks[activeDeckIdx];
    if (!currentDeck.default_strategies) {
      currentDeck.default_strategies = new Array(18).fill(null);
    }

    let targetIdx = selectedSlotIndex;
    if (targetIdx === null) {
      targetIdx = currentDeck.horse_ids.findIndex(s => s === null);
    }

    if (targetIdx !== -1 && targetIdx !== null) {
      currentDeck.horse_ids[targetIdx] = horseId;
      currentDeck.default_strategies[targetIdx] = null;
      selectedSlotIndex = null;
    } else {
      alert("18スロット満杯です。");
      return;
    }

    syncSave();
    renderDeck();
    renderPool();
  }

  document.getElementById('tabB').addEventListener('click', () => switchDeck(1));
  document.getElementById('searchInput').addEventListener('input', renderPool);

  document.getElementById('distanceFilter').addEventListener('change', renderPool);
  document.getElementById('potentialFilter').addEventListener('change', renderPool);
  document.getElementById('sortKey').addEventListener('change', renderPool);

    chip.addEventListener('click', (e) => {

      selectedKana = e.target.getAttribute('data-kana');
      renderPool();
    });
  });

    document.getElementById('diagSubSyn').classList.toggle('active', currentDiagTarget === 'synergy');
  }

  function getDeckHorsesList(deckIndex) {
    const deck = globalUserData?.decks?.[deckIndex] || { horse_ids: [] };
    return (deck.horse_ids || [])
      .map(id => id ? HORSES_MASTER[String(id)] : null)
      .filter(Boolean);
  }

  // 1デックのスペック計算ロジック
  function analyzeDeckMetrics(horses) {
    const totalCount = horses.length;
    if (totalCount === 0) {
      return {
        totalCount: 0, distScore: 0, surfScore: 0, femaleScore: 0, costScore: 0, survScore: 0,
        overallScore: 0, rank: 'E', turfCount: 0, dirtCount: 0, femaleCount: 0, avgPt: 0,
        distMap: { S: 0, M: 0, I: 0, L: 0, XL: 0 },
        anomalies: [{ type: 'danger', msg: '未編成: カードがスロットに配置されていません。' }]
      };
    }

    let turfCount = 0;
    let dirtCount = 0;
    let femaleCount = 0;
    let continuousCount = 0;
    let ptSum = 0;
    let lowPtCount = 0;

    const distMap = { S: 0, M: 0, I: 0, L: 0, XL: 0 };

    horses.forEach(h => {
      const t = getTurfVal(h);
      const d = getDirtVal(h);
      if (t > 0) turfCount++;
      if (d > 0) dirtCount++;

      if (h.sex && h.sex.includes('牝')) femaleCount++;

      const hasContinuous = Array.isArray(h.ability) && (h.ability.includes("鉄女") || h.ability.includes("連闘"));
      if (hasContinuous) continuousCount++;

      const pt = getHorsePotential(h);
      ptSum += pt;
      if (pt < 14) lowPtCount++;

      let minD = h.min_distance;
      let maxD = h.max_distance;
      if (!minD && !maxD && h.distance) {
        const parts = String(h.distance).split('-').map(v => parseInt(v, 10));
        minD = parts[0];
        maxD = parts[1] || parts[0];
      }
      minD = Number(minD) || 1600;
      maxD = Number(maxD) || minD;

      if (minD <= 1400) distMap.S++;
      if (minD <= 1600 && maxD >= 1600) distMap.M++;
      if (minD <= 2200 && maxD >= 1800) distMap.I++;
      if (minD <= 2500 && maxD >= 2400) distMap.L++;
      if (maxD >= 3000) distMap.XL++;
    });

    // 1. 距離網羅スコア
    let distScore = 0;
    if (distMap.S >= 2) distScore += 20; else if (distMap.S >= 1) distScore += 10;
    if (distMap.M >= 3) distScore += 20; else if (distMap.M >= 1) distScore += 12;
    if (distMap.I >= 4) distScore += 25; else if (distMap.I >= 2) distScore += 15;
    if (distMap.L >= 3) distScore += 20; else if (distMap.L >= 1) distScore += 12;
    if (distMap.XL >= 1) distScore += 15;
    distScore = Math.min(100, Math.round(distScore * (totalCount / 18)));

    // 2. 馬場対応力
    let surfScore = 0;
    if (turfCount >= 12 && dirtCount >= 3) surfScore = 100;
    else if (turfCount >= 10 && dirtCount >= 2) surfScore = 80;
    else if (dirtCount === 0) surfScore = 40;
    else surfScore = 60;

    // 3. 牝馬戦適性
    let femaleScore = 0;
    if (femaleCount >= 3) femaleScore = 100;
    else if (femaleCount === 2) femaleScore = 75;
    else if (femaleCount === 1) femaleScore = 45;
    else femaleScore = 15;

    // 4. コスト・ポテンシャル効率
    const avgPt = totalCount > 0 ? (ptSum / totalCount) : 0;
    let costScore = 85;
    if (avgPt >= 16 && avgPt <= 18) costScore = 95;
    else if (avgPt > 18.5) costScore = 65;
    else if (avgPt < 15) costScore = 60;
    if (lowPtCount > 2) costScore -= (lowPtCount * 5);
    costScore = Math.max(20, Math.min(100, costScore));

    // 5. サバイバル持久力
    let survScore = 0;
    if (totalCount === 18) {
      survScore = 75 + (continuousCount * 12);
      if (dirtCount < 2) survScore -= 15;
      if (distMap.XL === 0) survScore -= 10;
    } else {
      survScore = Math.round((totalCount / 18) * 60);
    }
    survScore = Math.max(10, Math.min(100, survScore));

    const overallScore = Math.round((distScore * 0.25) + (surfScore * 0.25) + (femaleScore * 0.15) + (costScore * 0.15) + (survScore * 0.20));
    let rank = 'D';
    if (overallScore >= 90) rank = 'S';
    else if (overallScore >= 80) rank = 'A';
    else if (overallScore >= 68) rank = 'B';
    else if (overallScore >= 50) rank = 'C';

    const anomalies = [];
    if (totalCount < 18) {
      anomalies.push({ type: 'danger', msg: `スロット未充足: 現在 ${totalCount}/18頭。サバイバルモードの完走率が低下します。` });
    }
    if (dirtCount === 0) {
      anomalies.push({ type: 'danger', msg: 'ダート馬 不在: 地方交流や盛岡ダート等のシリーズを引いた場合、不戦敗リスクが極めて高いです。' });
    } else if (dirtCount < 2) {
      anomalies.push({ type: 'warn', msg: 'ダート層が薄い: ダート馬が1頭のみ。ダート重賞の多いシリーズで枠が埋まらない可能性があります。' });
    }
    if (femaleCount === 0) {
      anomalies.push({ type: 'danger', msg: '牝馬 不在: 牝馬限定レース（エリザベス女王杯・ヴィクトリアM等）で出走不能になります。' });
    } else if (femaleCount === 1) {
      anomalies.push({ type: 'warn', msg: '牝馬 1頭のみ: 牝馬指定が複数あるシリーズで出走登録が困難になります。' });
    }
    if (distMap.XL === 0) {
      anomalies.push({ type: 'warn', msg: '長距離(3000m〜)の死角: 天皇賞春・菊花賞・阪神大賞典等の長距離レースに適性馬がいません。' });
    }
    if (avgPt > 18.5) {
      anomalies.push({ type: 'warn', msg: `平均Pt高め (${avgPt.toFixed(1)}Pt): 上限82〜85Pt制のローカルシリーズ等で合計オーバーになりやすいです。` });
    }
    if (lowPtCount > 0) {
      anomalies.push({ type: 'warn', msg: `下限制限注意: 14Pt未満の馬が ${lowPtCount}頭 います。出走下限制限付きのレースで弾かれます。` });
    }
    if (anomalies.length === 0) {
      anomalies.push({ type: 'ok', msg: '全方位バランス良好: 芝・ダート・各距離帯が隙なく配置された強力な構成です。' });
    }

    return {
      totalCount, distScore, surfScore, femaleScore, costScore, survScore,
      overallScore, rank, turfCount, dirtCount, femaleCount, avgPt,
      distMap, anomalies
    };
  }

  // クリーン＆エレガントなSVGレーダーチャート
  function generateCleanRadarSVG(metrics) {
    const size = 200;
    const center = size / 2;
    const radius = 68;
    const values = [
      metrics.distScore / 100,
      metrics.surfScore / 100,
      metrics.femaleScore / 100,
      metrics.costScore / 100,
      metrics.survScore / 100
    ];
    const labels = ["距離網羅", "馬場適応", "牝馬戦", "Pt効率", "生存力"];

    const getCoords = (idx, factor) => {
      const angle = (Math.PI * 2 / 5) * idx - (Math.PI / 2);
      return {
        x: center + radius * factor * Math.cos(angle),
        y: center + radius * factor * Math.sin(angle)
      };
    };

    let gridSvg = "";
    [0.25, 0.5, 0.75, 1.0].forEach(f => {
      const pts = [0, 1, 2, 3, 4].map(i => {
        const c = getCoords(i, f);
        return `${c.x.toFixed(1)},${c.y.toFixed(1)}`;
      }).join(' ');
      gridSvg += `<polygon points="${pts}" fill="none" stroke="#d0e3d2" stroke-width="1" stroke-dasharray="${f===1.0?'none':'3,3'}"/>`;
    });

    let axisSvg = "";
    labels.forEach((lbl, i) => {
      const end = getCoords(i, 1.0);
      const textPos = getCoords(i, 1.28);
      axisSvg += `
        <line x1="${center}" y1="${center}" x2="${end.x}" y2="${end.y}" stroke="#d0e3d2" stroke-width="1"/>
        <text x="${textPos.x}" y="${textPos.y + 4}" fill="#2d6a37" font-size="10" font-family="'Helvetica Neue', Arial, sans-serif" text-anchor="middle" font-weight="bold">${lbl}</text>
      `;
    });

    const dataPts = values.map((val, i) => {
      const c = getCoords(i, Math.max(0.12, val));
      return `${c.x.toFixed(1)},${c.y.toFixed(1)}`;
    }).join(' ');

    return `
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${center}" cy="${center}" r="${radius + 20}" fill="#fafffb" stroke="#b2d4b6" stroke-width="1"/>
        ${gridSvg}
        ${axisSvg}
        <polygon points="${dataPts}" fill="rgba(45, 106, 55, 0.22)" stroke="#2d6a37" stroke-width="2.5"/>
        ${values.map((v, i) => {
          const c = getCoords(i, Math.max(0.12, v));
          return `<circle cx="${c.x}" cy="${c.y}" r="3.5" fill="#ffffff" stroke="#2d6a37" stroke-width="2"/>`;
        }).join('')}
      </svg>
    `;
  }

  // 診断画面のレンダリング
  function renderDiagnosisPanel() {
    const container = document.getElementById('diagContentContainer');
    container.innerHTML = '';

    if (currentDiagTarget === 'synergy') {
      renderSynergyView(container);
      return;
    }

    const deckIdx = currentDiagTarget;
    const currentDeck = globalUserData.decks[deckIdx] || {};
    const deckName = currentDeck.deck_name || `メインデッキ ${deckIdx + 1}`;
    const horses = getDeckHorsesList(deckIdx);
    const m = analyzeDeckMetrics(horses);
    const radarSvg = generateCleanRadarSVG(m);

    container.innerHTML = `
      <div class="diag-card">
        <div class="diag-header-row">
          <div class="diag-title">
            <span>📊 総合スペック診断: <strong>${escapeHtml(deckName)}</strong></span>
          </div>
          <span style="font-size:11px; color:#666;">登録頭数: <strong>${m.totalCount}</strong>/18頭</span>
        </div>

        <div class="score-overview-box">
          <div class="score-rank-group">
            <div>
              <div style="font-size:10px; color:#777; font-weight:bold;">総合評価ランク</div>
              <div class="score-rank-badge ${m.rank==='S'?'rank-s':''}">${m.rank}</div>
            </div>
            <div class="score-val-text">総合スコア <strong class="score-val-bold">${m.overallScore}</strong> / 100</div>
          </div>
          <div class="spec-mini-summary">
            <div>適性バランス: <strong>芝${m.turfCount}頭 / ダート${m.dirtCount}頭</strong></div>
            <div>牝馬所属数: <strong>${m.femaleCount}頭</strong> (平均Pt: ${m.avgPt ? m.avgPt.toFixed(1) : 0})</div>
          </div>
        </div>

        <div class="radar-metrics-grid">
          <div style="display:flex; justify-content:center; align-items:center;">
            ${radarSvg}
          </div>
          <div class="metrics-list-box">
            <div class="metric-bar-item">
              <div class="metric-label-group">
                <span>距離網羅性 (短距離〜超長距離)</span>
                <span>${m.distScore}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${m.distScore}%;"></div></div>
            </div>

            <div class="metric-bar-item">
              <div class="metric-label-group">
                <span>馬場適応力 (芝・ダートの両立)</span>
                <span>${m.surfScore}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${m.surfScore}%;"></div></div>
            </div>

            <div class="metric-bar-item">
              <div class="metric-label-group">
                <span>牝馬限定戦への適格性</span>
                <span>${m.femaleScore}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${m.femaleScore}%;"></div></div>
            </div>

            <div class="metric-bar-item">
              <div class="metric-label-group">
                <span>ポテンシャル配分効率 (コスト適合)</span>
                <span>${m.costScore}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${m.costScore}%;"></div></div>
            </div>

            <div class="metric-bar-item">
              <div class="metric-label-group">
                <span>サバイバル完走・生存指数</span>
                <span>${m.survScore}%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:${m.survScore}%;"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="diag-card">
        <div class="diag-header-row">
          <div class="diag-title">
            <span>💡 編成チェック ＆ 改善アドバイス</span>
          </div>
        </div>
        <div class="advice-list">
          ${m.anomalies.map(a => `
            <div class="advice-item ${a.type}">
              <span class="advice-badge ${a.type}">${a.type==='danger'?'要改善':(a.type==='warn'?'注意':'良好')}</span>
              <span>${a.msg}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // 2デック相互補完分析のレンダリング
  function renderSynergyView(container) {
    const h1 = getDeckHorsesList(0);
    const h2 = getDeckHorsesList(1);
    const m1 = analyzeDeckMetrics(h1);
    const m2 = analyzeDeckMetrics(h2);

    let role1 = "バランス型";
    if (m1.dirtCount >= 4) role1 = "ダート・地方交流特化";
    else if (m1.distMap.XL >= 1 && m1.distMap.L >= 3) role1 = "芝・中長距離王道型";
    else if (m1.distMap.S >= 3) role1 = "短距離・スプリント型";

    let role2 = "バランス型";
    if (m2.dirtCount >= 4) role2 = "ダート・地方交流特化";
    else if (m2.distMap.XL >= 1 && m2.distMap.L >= 3) role2 = "芝・中長距離王道型";
    else if (m2.distMap.S >= 3) role2 = "短距離・スプリント型";

    let synergyScore = 60;
    const combinedDirt = m1.dirtCount + m2.dirtCount;
    const combinedFemale = m1.femaleCount + m2.femaleCount;
    const combinedXL = m1.distMap.XL + m2.distMap.XL;

    if (combinedDirt >= 5) synergyScore += 15;
    if (combinedFemale >= 4) synergyScore += 15;
    if (combinedXL >= 2) synergyScore += 10;
    if (role1 !== role2 && role1 !== "バランス型" && role2 !== "バランス型") synergyScore += 10;
    synergyScore = Math.min(100, synergyScore);

    container.innerHTML = `
      <div class="diag-card">
        <div class="diag-header-row">
          <div class="diag-title">
            <span>🤝 2デック相互補完度 (チャレンジモード対策)</span>
          </div>
          <span style="font-size:11px; color:#666;">※2つのデックを跨いだ編成はできません</span>
        </div>

        <div class="score-overview-box">
          <div class="score-rank-group">
            <div>
              <div style="font-size:10px; color:#777; font-weight:bold;">シナジー評価</div>
              <div class="score-rank-badge ${synergyScore>=80?'rank-s':''}">${synergyScore >= 80 ? 'S' : (synergyScore >= 65 ? 'A' : 'B')}</div>
            </div>
            <div class="score-val-text">補完シナジー指数 <strong class="score-val-bold">${synergyScore}</strong> / 100</div>
          </div>
          <div class="spec-mini-summary">
            <div>MAIN 1: <strong>${role1}</strong></div>
            <div>MAIN 2: <strong>${role2}</strong></div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:8px; margin-top:5px;">
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div style="background:#f4fbf5; border:1px solid #c2dfc6; border-radius:6px; padding:10px;">
              <strong style="color:var(--accent-color);">🏇 MAIN DECK 1 (${m1.totalCount}頭):</strong>
              <div style="font-size:11.5px; color:#555; margin-top:4px; line-height:1.4;">
                芝: <strong>${m1.turfCount}頭</strong> / ダ: <strong>${m1.dirtCount}頭</strong> / 牝: <strong>${m1.femaleCount}頭</strong><br>
                総合スコア: <strong>${m1.overallScore}点</strong>
              </div>
            </div>
            <div style="background:#f0f7ff; border:1px solid #b8daff; border-radius:6px; padding:10px;">
              <strong style="color:#0056b3;">🏇 MAIN DECK 2 (${m2.totalCount}頭):</strong>
              <div style="font-size:11.5px; color:#555; margin-top:4px; line-height:1.4;">
                芝: <strong>${m2.turfCount}頭</strong> / ダ: <strong>${m2.dirtCount}頭</strong> / 牝: <strong>${m2.femaleCount}頭</strong><br>
                総合スコア: <strong>${m2.overallScore}点</strong>
              </div>
            </div>
          </div>

          <div class="advice-item ${role1===role2?'warn':'ok'}" style="margin-top:6px;">
            <span class="advice-badge ${role1===role2?'warn':'ok'}">${role1===role2?'アドバイス':'役割分担完了'}</span>
            <span>
              ${role1 === role2 
                ? '<strong>役割の重複があります:</strong> MAIN 1とMAIN 2の適性が似ています。片方を「芝・王道中長距離」、もう片方を「ダート＆短距離」といったように明確に役割分担させると、相手シリーズの条件に合わせた最適な選択ができるようになります。'
                : '<strong>綺麗な役割分担ができています:</strong> 2つのデックで得意分野が分かれており、チャレンジシリーズでどのシリーズを引いても柔軟に対応できます。'}
            </span>
          </div>
        </div>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
