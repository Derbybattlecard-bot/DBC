<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - デッキ構築</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --slot-empty: #f2f8f3;
    --gold: #c29b1d;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  h1, h2, h3 { margin: 0 0 8px 0; color: var(--accent-color); }
  .container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1280px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }
  .btn-back:hover { background: var(--accent-color); color: #ffffff; }
  .deck-tabs { display: flex; gap: 8px; }
  .tab-btn {
    background-color: #e2efe3;
    color: var(--text-sub);
    border: 1px solid var(--border-color);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
  }
  .tab-btn.active {
    background-color: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }
  .deck-info { display: flex; gap: 15px; font-weight: bold; font-size: 13px; }
  .deck-name-input {
    background: #ffffff; border: 1px solid var(--border-color);
    color: var(--text-main); padding: 4px 8px; border-radius: 4px; font-size: 13px;
    font-weight: bold;
  }

  .save-load-panel {
    background-color: var(--panel-bg);
    padding: 8px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .sync-status { font-size: 11px; color: var(--text-sub); font-weight: bold; }

  .main-layout { display: grid; grid-template-columns: 1.1fr 1.3fr; gap: 15px; }
  @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

  .panel {
    background-color: var(--panel-bg);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    padding: 12px 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  /* スロット（18枚）グリッド */
  .slots-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-height: 600px;
    overflow-y: auto;
  }
  .slot-card {
    background-color: var(--slot-empty);
    border: 1px dashed var(--border-color);
    border-radius: 6px;
    padding: 6px;
    min-height: 75px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
    font-size: 11px;
  }
  .slot-card.filled { border-style: solid; border-color: #a0ca33; background-color: #ffffff; }
  .slot-card.selected { border-color: var(--gold); box-shadow: 0 0 6px rgba(194, 155, 29, 0.6); }
  .card-header { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-weight: bold; font-size: 12px; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 85px; }
  .badge-rarity { background: var(--accent-color); color: white; padding: 1px 3px; border-radius: 3px; font-weight: bold; font-size: 9px; }
  .card-details { display: flex; flex-direction: column; gap: 2px; color: var(--text-sub); margin-top: 2px; }
  .empty-text { color: var(--text-sub); text-align: center; margin: auto; font-size: 11px; }

  /* 検索・フィルターエリア */
  .filter-box { display: flex; flex-direction: column; gap: 6px; background: #f2f8f3; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 11px; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-input, .filter-select {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 5px 8px;
    border-radius: 4px;
    flex: 1;
    font-size: 11px;
  }
  .kana-chips { display: flex; flex-wrap: wrap; gap: 3px; }
  .kana-chip {
    background: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 10px;
    cursor: pointer;
    font-weight: bold;
  }
  .kana-chip:hover, .kana-chip.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  /* 未編成プールカード */
  .pool-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    max-height: 440px;
    overflow-y: auto;
  }
  .pool-card {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .pool-card:hover { border-color: var(--accent-color); background-color: #f7fbf7; }
  .param-row { display: flex; justify-content: space-between; background: #f8faf8; padding: 1px 4px; border-radius: 2px; font-size: 10px; color: var(--text-sub); }
  .ability-text { color: #8a4b08; font-weight: bold; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge-count { background: #e2efe3; color: var(--accent-color); padding: 1px 4px; border-radius: 8px; font-size: 9px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <div class="header-left">
      <a href="index.html" class="btn-back">← メインメニュー</a>
      <div class="deck-tabs">
        <button class="tab-btn active" id="tabA">MAIN 1</button>
        <button class="tab-btn" id="tabB">MAIN 2</button>
      </div>
    </div>
    <div>
      デッキ名: <input type="text" id="deckNameInput" class="deck-name-input" value="読み込み中...">
    </div>
    <div class="deck-info">
      <span>編成: <span id="countDisplay">0</span> / 18</span>
    </div>
  </div>

  <div class="save-load-panel">
    <span class="sync-status" id="syncStatus">☁️ Cloud Status: 準備中</span>
  </div>

  <div class="main-layout">
    <!-- スロットパネル -->
    <div class="panel">
      <h3>18枚スロット （タップで外す/選択）</h3>
      <div id="slotsGrid" class="slots-grid"></div>
    </div>

    <!-- 未編成カードプールパネル -->
    <div class="panel">
      <h3>未編成カードプール</h3>
      
      <div class="filter-box">
        <div class="filter-row">
          <input type="text" id="searchInput" class="filter-input" placeholder="🔍 馬名検索...">
          <select id="surfaceFilter" class="filter-select">
            <option value="ALL">適性: すべて</option>
            <option value="turf">芝のみ</option>
            <option value="dirt">ダートのみ</option>
            <option value="both">芝/ダ両方</option>
          </select>
          <select id="distanceFilter" class="filter-select">
            <option value="ALL">距離: すべて</option>
            <option value="1200">1200m</option>
            <option value="1600">1600m</option>
            <option value="2000">2000m</option>
            <option value="2500">2500m</option>
            <option value="3200">3200m</option>
          </select>
        </div>
        <div class="filter-row">
          <select id="sortKey" class="filter-select">
            <option value="kana">順: あいうえお</option>
            <option value="potential">順: ポテンシャル</option>
            <option value="rarity">順: レアリティ</option>
          </select>
          <select id="sortOrder" class="filter-select">
            <option value="desc">降順 (高→低/ん→あ)</option>
            <option value="asc">昇順 (低→高/あ→ん)</option>
          </select>
          <select id="paramFilterKey" class="filter-select">
            <option value="ALL">能力絞り込み</option>
            <option value="speed">スピ</option>
            <option value="stamina">スタ</option>
            <option value="sharp">瞬発</option>
            <option value="jizoku">持続</option>
            <option value="guts">根性</option>
          </select>
          <select id="paramFilterVal" class="filter-select">
            <option value="ALL">ランク指定</option>
            <option value="S">S (20+)</option>
            <option value="A">A (18-19)</option>
            <option value="B">B (16-17)</option>
            <option value="C">C (15以下)</option>
          </select>
        </div>
        <div class="kana-chips" id="kanaChips">
          <span class="kana-chip active" data-kana="ALL">すべて</span>
          <span class="kana-chip" data-kana="あ">あ</span>
          <span class="kana-chip" data-kana="か">か</span>
          <span class="kana-chip" data-kana="さ">さ</span>
          <span class="kana-chip" data-kana="た">た</span>
          <span class="kana-chip" data-kana="な">な</span>
          <span class="kana-chip" data-kana="は">は</span>
          <span class="kana-chip" data-kana="ま">ま</span>
          <span class="kana-chip" data-kana="や">や</span>
          <span class="kana-chip" data-kana="ら">ら</span>
          <span class="kana-chip" data-kana="わ">わ</span>
        </div>
      </div>

      <div id="poolGrid" class="pool-grid"></div>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let HORSES_MASTER = {};
  let HORSES_ARRAY = [];
  let currentUser = null;
  let globalUserData = null;
  let activeDeckIdx = 0;
  let selectedSlotIndex = null;
  let selectedKana = "ALL";

  const RARITY_WEIGHT = { "INF": 11, "SER": 10, "UR": 9, "LGR": 8, "CLR": 7, "TR": 6, "RER": 5, "AR": 4, "VR": 3, "PR": 3, "SPR": 2, "N": 1 };

  // パラメータをアルファベットランクに変換する関数
  function getParamRank(val) {
    if (val === undefined || val === null) return "-";
    if (val >= 20) return "S";
    if (val >= 18) return "A";
    if (val >= 16) return "B";
    return "C";
  }

  function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = msg;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;
    setSyncStatus("☁️ データ読み込み中...");

    try {
      const res = await fetch('./data/horses_master.json');
      if (res.ok) {
        HORSES_ARRAY = await res.json();
        HORSES_ARRAY.forEach(h => {
          HORSES_MASTER[h.horse_id] = h;
        });
      }

      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        globalUserData = userDoc.data();
      } else {
        window.location.href = 'setup.html';
        return;
      }

      if (!globalUserData.decks || !Array.isArray(globalUserData.decks)) {
        globalUserData.decks = [
          { deck_name: "メインデッキ 1", horse_ids: new Array(18).fill(null) },
          { deck_name: "メインデッキ 2", horse_ids: new Array(18).fill(null) }
        ];
      }

      globalUserData.decks.forEach(deck => {
        if (!deck.horse_ids) deck.horse_ids = new Array(18).fill(null);
        while (deck.horse_ids.length < 18) {
          deck.horse_ids.push(null);
        }
      });

      setSyncStatus("✅ クラウド同期完了");
      renderAll();

    } catch (err) {
      console.error("初期化エラー:", err);
      setSyncStatus("❌ データ読み込みエラー");
    }
  });

  async function syncSave() {
    setSyncStatus("☁️ 保存中...");
    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        decks: globalUserData.decks
      });
      setSyncStatus("✅ 保存完了");
    } catch (err) {
      console.error("保存失敗:", err);
      setSyncStatus("❌ 保存失敗");
    }
  }

  function renderAll() {
    const currentDeck = globalUserData.decks[activeDeckIdx];
    document.getElementById('deckNameInput').value = currentDeck.deck_name || `メインデッキ ${activeDeckIdx + 1}`;
    renderDeck();
    renderPool();
  }

  function switchDeck(idx) {
    activeDeckIdx = idx;
    selectedSlotIndex = null;
    document.getElementById('tabA').className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    document.getElementById('tabB').className = `tab-btn ${idx === 1 ? 'active' : ''}`;
    renderAll();
  }

  document.getElementById('deckNameInput').addEventListener('change', (e) => {
    globalUserData.decks[activeDeckIdx].deck_name = e.target.value;
    syncSave();
  });

  // スロット描画（馬名、レアリティ、芝ダ、距離、ポテンシャル、脚質）
  function renderDeck() {
    const grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    const currentSlots = globalUserData.decks[activeDeckIdx].horse_ids;
    let filledCount = 0;

    currentSlots.forEach((horseId, idx) => {
      const isSelected = (selectedSlotIndex === idx);
      const horse = HORSES_MASTER[horseId];
      const div = document.createElement('div');
      
      if (horse) {
        filledCount++;
        // 芝・ダート適性の判定修正（両方あれば "芝/ダ"、片方ならそれぞれ表示）
        let surfaceText = "-";
        if (horse.turf !== null && horse.dirt !== null) surfaceText = "芝/ダ";
        else if (horse.turf !== null) surfaceText = "芝";
        else if (horse.dirt !== null) surfaceText = "ダ";

        div.className = `slot-card filled ${isSelected ? 'selected' : ''}`;
        div.innerHTML = `
          <div class="card-header">
            <span class="card-name">${horse.name}</span>
            <span class="badge-rarity">${horse.rarity}</span>
          </div>
          <div class="card-details">
            <span>適性: ${surfaceText} / ${horse.distance || '-'}m</span>
            <span>ポテンシャル: ${horse.potential} | 脚質: ${horse.style || '-'}</span>
          </div>
        `;
        div.onclick = () => removeCardFromSlot(idx);
      } else {
        div.className = `slot-card ${isSelected ? 'selected' : ''}`;
        div.innerHTML = `<div class="empty-text">${isSelected ? '【選択中】' : '＋ 空き枠'}</div>`;
        div.onclick = () => selectSlot(idx);
      }
      grid.appendChild(div);
    });

    document.getElementById('countDisplay').innerText = filledCount;
  }

  function selectSlot(idx) {
    selectedSlotIndex = idx;
    renderDeck();
  }

  function removeCardFromSlot(idx) {
    globalUserData.decks[activeDeckIdx].horse_ids[idx] = null;
    selectedSlotIndex = idx;
    syncSave();
    renderDeck();
    renderPool();
  }

  function getKanaGroup(name) {
    if (!name) return "";
    const firstChar = name.charAt(0);
    const groups = {
      "あ": ["あ","い","う","え","お","ア","イ","ウ","エ","オ"],
      "か": ["か","き","く","け","こ","が","ぎ","ぐ","げ","ご","カ","キ","ク","ケ","コ","ガ","ギ","グ","ゲ","ゴ"],
      "さ": ["さ","し","す","せ","そ","ざ","じ","ず","ぜ","ぞ","サ","シ","ス","セ","ソ","ザ","ジ","ズ","ゼ","ゾ"],
      "た": ["た","ち","つ","て","と","だ","ぢ","づ","で","ど","タ","チ","ツ","テ","ト","ダ","ヂ","ヅ","デ","ド"],
      "な": ["な","に","ぬ","ね","の","ナ","ニ","ヌ","ネ","ノ"],
      "は": ["は","ひ","ふ","へ","ほ","ば","び","ぶ","べ","ぼ","ぱ","ぴ","ぷ","ぺ","ぽ","ハ","ヒ","フ","ヘ","ホ","バ","ビ","ブ","ベ","ボ","パ","ピ","プ","ペ","ポ"],
      "ま": ["ま","み","む","め","も","マ","ミ","ム","メ","モ"],
      "や": ["や","ゆ","よ","ヤ","ユ","ヨ"],
      "ら": ["ら","り","る","れ","ろ","ラ","リ","ル","レ","ロ"],
      "わ": ["わ","を","ん","ワ","ヲ","ン"]
    };
    for (const [groupKey, chars] of Object.entries(groups)) {
      if (chars.includes(firstChar)) return groupKey;
    }
    return "その他";
  }

  // 未編成プール描画（各パラメータのランク表示、特殊能力、詳細情報追加）
  function renderPool() {
    const grid = document.getElementById('poolGrid');
    grid.innerHTML = '';

    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const surfaceVal = document.getElementById('surfaceFilter').value;
    const distanceVal = document.getElementById('distanceFilter').value;
    const sortKey = document.getElementById('sortKey').value;
    const sortOrder = document.getElementById('sortOrder').value;
    const paramKey = document.getElementById('paramFilterKey').value;
    const paramVal = document.getElementById('paramFilterVal').value;

    const currentDeckHorses = globalUserData.decks[activeDeckIdx].horse_ids;
    const inventory = globalUserData.cards || {};

    let poolList = [];

    for (const horseId in inventory) {
      const cardInfo = inventory[horseId];
      const count = (typeof cardInfo === 'object' && cardInfo !== null) ? (cardInfo.count || 1) : 1;
      const horse = HORSES_MASTER[horseId];

      if (count > 0 && horse && !currentDeckHorses.includes(horseId)) {
        if (searchText && !horse.name.toLowerCase().includes(searchText)) continue;
        
        // 芝・ダート適性の修正判定
        if (surfaceVal === 'turf' && horse.turf === null) continue;
        if (surfaceVal === 'dirt' && horse.dirt === null) continue;
        if (surfaceVal === 'both' && (horse.turf === null || horse.dirt === null)) continue;

        // 距離検索
        if (distanceVal !== 'ALL') {
          const targetDist = parseInt(distanceVal, 10);
          const [minD, maxD] = (horse.distance || "").split("-").map(v => parseInt(v, 10));
          if (!isNaN(minD) && !isNaN(maxD)) {
            if (targetDist < minD || targetDist > maxD) continue;
          }
        }

        // あかさたな
        if (selectedKana !== 'ALL') {
          const group = getKanaGroup(horse.name);
          if (group !== selectedKana) continue;
        }
        // 各パラメータによる絞り込み
        if (paramKey !== 'ALL' && paramVal !== 'ALL') {
          const actualVal = horse[paramKey] || 0;
          const rank = getParamRank(actualVal);
          if (rank !== paramVal) continue;
        }

        poolList.push({ horse, count });
      }
    }

    poolList.sort((a, b) => {
      let valA, valB;
      if (sortKey === 'kana') {
        valA = a.horse.name;
        valB = b.horse.name;
        const res = valA.localeCompare(valB, 'ja');
        return sortOrder === 'asc' ? res : -res;
      } else if (sortKey === 'potential') {
        valA = a.horse.potential || 0;
        valB = b.horse.potential || 0;
      } else if (sortKey === 'rarity') {
        valA = RARITY_WEIGHT[a.horse.rarity] || 0;
        valB = RARITY_WEIGHT[b.horse.rarity] || 0;
      }
      return sortOrder === 'asc' ? valA - valB : valB - valA;
    });

    poolList.forEach(({ horse, count }) => {
      let surfaceText = "-";
      if (horse.turf !== null && horse.dirt !== null) surfaceText = "芝/ダ";
      else if (horse.turf !== null) surfaceText = "芝";
      else if (horse.dirt !== null) surfaceText = "ダ";

      const div = document.createElement('div');
      div.className = 'pool-card';
      div.innerHTML = `
        <div class="card-header">
          <span class="card-name">${horse.name}</span>
          <span class="badge-rarity">${horse.rarity}</span>
        </div>
        <div class="card-details">
          <span>適性: ${surfaceText} / ${horse.distance || '-'}m</span>
          <span>ポテンシャル: <b>${horse.potential}</b> | 脚質: ${horse.style || '-'}</span>
          <div class="ability-text">能力: ${horse.ability || 'なし'}</div>
        </div>
        <div class="param-row">
          <span>スピ:${getParamRank(horse.speed)}</span>
          <span>スタ:${getParamRank(horse.stamina)}</span>
          <span>瞬発:${getParamRank(horse.sharp)}</span>
          <span>持続:${getParamRank(horse.jizoku)}</span>
          <span>根性:${getParamRank(horse.guts)}</span>
          <span class="badge-count">所持:${count}</span>
        </div>
      `;
      div.onclick = () => addCardToDeck(horse.horse_id);
      grid.appendChild(div);
    });

    if (poolList.length === 0) {
      grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #666; font-size: 11px; padding: 20px;">条件に合う未編成カードがありません</div>';
    }
  }

  function addCardToDeck(horseId) {
    const currentSlots = globalUserData.decks[activeDeckIdx].horse_ids;

    if (selectedSlotIndex !== null) {
      currentSlots[selectedSlotIndex] = horseId;
      selectedSlotIndex = null;
    } else {
      const emptyIdx = currentSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        currentSlots[emptyIdx] = horseId;
      } else {
        alert("18スロット満杯です。");
        return;
      }
    }

    syncSave();
    renderDeck();
    renderPool();
  }

  // イベントリスナー
  document.getElementById('tabA').addEventListener('click', () => switchDeck(0));
  document.getElementById('tabB').addEventListener('click', () => switchDeck(1));
  document.getElementById('searchInput').addEventListener('input', renderPool);
  document.getElementById('surfaceFilter').addEventListener('change', renderPool);
  document.getElementById('distanceFilter').addEventListener('change', renderPool);
  document.getElementById('sortKey').addEventListener('change', renderPool);
  document.getElementById('sortOrder').addEventListener('change', renderPool);
  document.getElementById('paramFilterKey').addEventListener('change', renderPool);
  document.getElementById('paramFilterVal').addEventListener('change', renderPool);

  document.querySelectorAll('.kana-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      document.querySelectorAll('.kana-chip').forEach(c => c.classList.remove('active'));
      e.target.classList.add('active');
      selectedKana = e.target.getAttribute('data-kana');
      renderPool();
    });
  });
</script>
</body>
</html>
