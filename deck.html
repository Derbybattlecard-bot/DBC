<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - デッキ構築</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.92);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --slot-empty: #f2f8f3;
    --gold: #c29b1d;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 14px;
    display: flex;
    justify-content: center;
  }
  h1, h2, h3 { margin: 0 0 10px 0; color: var(--accent-color); }
  .container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1200px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }
  .btn-back:hover { background: var(--accent-color); color: #ffffff; }
  .deck-tabs { display: flex; gap: 10px; }
  .tab-btn {
    background-color: #e2efe3;
    color: var(--text-sub);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  .tab-btn.active {
    background-color: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }
  .deck-info { display: flex; gap: 15px; font-weight: bold; }
  .deck-name-input {
    background: #ffffff; border: 1px solid var(--border-color);
    color: var(--text-main); padding: 4px 8px; border-radius: 4px; font-size: 14px;
    font-weight: bold;
  }

  .save-load-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
  }
  .sync-status { font-size: 11px; color: var(--text-sub); font-weight: bold; }

  .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

  .panel {
    background-color: var(--panel-bg);
    border-radius: 8px;
    border: 1px solid var(--border-color);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .slots-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-height: 520px;
    overflow-y: auto;
  }
  .slot-card {
    background-color: var(--slot-empty);
    border: 1px dashed var(--border-color);
    border-radius: 6px;
    padding: 8px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    position: relative;
  }
  .slot-card.filled { border-style: solid; border-color: #a0ca33; background-color: #ffffff; }
  .slot-card.selected { border-color: var(--gold); box-shadow: 0 0 8px rgba(194, 155, 29, 0.6); }
  .card-name { font-weight: bold; font-size: 13px; color: var(--text-main); }
  .card-sub { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; margin-top: 4px; }
  .badge-rarity { background: var(--accent-color); color: white; padding: 1px 4px; border-radius: 3px; font-weight: bold; font-size: 10px; }
  .empty-text { color: var(--text-sub); text-align: center; margin: auto; font-size: 12px; }

  .filter-box { display: flex; flex-direction: column; gap: 8px; }
  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-input, .filter-select {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 6px 10px;
    border-radius: 4px;
    flex: 1;
    font-size: 12px;
  }

  .pool-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
  }
  .pool-card {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
  }
  .pool-card:hover { border-color: var(--accent-color); background-color: #f7fbf7; }
  .badge-count { background: #e2efe3; color: var(--accent-color); padding: 1px 5px; border-radius: 10px; font-size: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <div class="header-left">
      <a href="index.html" class="btn-back">← メインメニューに戻る</a>
      <div class="deck-tabs">
        <button class="tab-btn active" id="tabA">MAIN DECK 1</button>
        <button class="tab-btn" id="tabB">MAIN DECK 2</button>
      </div>
    </div>
    <div>
      デッキ名: <input type="text" id="deckNameInput" class="deck-name-input" value="読み込み中...">
    </div>
    <div class="deck-info">
      <span>編成: <span id="countDisplay">0</span> / 18</span>
    </div>
  </div>

  <div class="save-load-panel">
    <span class="sync-status" id="syncStatus">☁️ Cloud Status: 準備中</span>
  </div>

  <div class="main-layout">
    <div class="panel">
      <h3>18枚スロット （タップで【外す/空き枠選択】）</h3>
      <div id="slotsGrid" class="slots-grid"></div>
    </div>

    <div class="panel">
      <h3>未編成カードプール</h3>
      <div class="filter-box">
        <div class="filter-row">
          <input type="text" id="searchInput" class="filter-input" placeholder="🔍 馬名検索...">
          <select id="surfaceFilter" class="filter-select">
            <option value="ALL">適性: すべて</option>
            <option value="turf">芝のみ</option>
            <option value="dirt">ダートのみ</option>
            <option value="both">芝/ダ両方</option>
          </select>
        </div>
      </div>
      <div id="poolGrid" class="pool-grid"></div>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let HORSES_MASTER = {};
  let HORSES_ARRAY = [];
  let currentUser = null;
  let globalUserData = null;
  let activeDeckIdx = 0;
  let selectedSlotIndex = null;

  // ステータス表示用関数を先に定義
  function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = msg;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;
    setSyncStatus("☁️ データ読み込み中...");

    try {
      // 1. マスターデータ取得
      const res = await fetch('./data/horses_master.json');
      if (res.ok) {
        HORSES_ARRAY = await res.json();
        HORSES_ARRAY.forEach(h => {
          HORSES_MASTER[h.horse_id] = h;
        });
      }

      // 2. Firestoreからユーザーデータ取得
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        globalUserData = userDoc.data();
      } else {
        window.location.href = 'setup.html';
        return;
      }

      // デッキデータの初期化保証（未設定時のデフォルト2枠）
      if (!globalUserData.decks || !Array.isArray(globalUserData.decks)) {
        globalUserData.decks = [
          { deck_name: "メインデッキ 1", horse_ids: new Array(18).fill(null) },
          { deck_name: "メインデッキ 2", horse_ids: new Array(18).fill(null) }
        ];
      }

      // 各デッキの枠数が18個に満たない場合はパディング
      globalUserData.decks.forEach(deck => {
        if (!deck.horse_ids) deck.horse_ids = new Array(18).fill(null);
        while (deck.horse_ids.length < 18) {
          deck.horse_ids.push(null);
        }
      });

      setSyncStatus("✅ クラウド同期完了");
      renderAll();

    } catch (err) {
      console.error("初期化エラー:", err);
      setSyncStatus("❌ データ読み込みエラー");
    }
  });

  async function syncSave() {
    setSyncStatus("☁️ 保存中...");
    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        decks: globalUserData.decks
      });
      setSyncStatus("✅ 保存完了");
    } catch (err) {
      console.error("保存失敗:", err);
      setSyncStatus("❌ 保存失敗");
    }
  }

  function renderAll() {
    const currentDeck = globalUserData.decks[activeDeckIdx];
    document.getElementById('deckNameInput').value = currentDeck.deck_name || `メインデッキ ${activeDeckIdx + 1}`;
    renderDeck();
    renderPool();
  }

  function switchDeck(idx) {
    activeDeckIdx = idx;
    selectedSlotIndex = null;
    document.getElementById('tabA').className = `tab-btn ${idx === 0 ? 'active' : ''}`;
    document.getElementById('tabB').className = `tab-btn ${idx === 1 ? 'active' : ''}`;
    renderAll();
  }

  document.getElementById('deckNameInput').addEventListener('change', (e) => {
    globalUserData.decks[activeDeckIdx].deck_name = e.target.value;
    syncSave();
  });

  function renderDeck() {
    const grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    const currentSlots = globalUserData.decks[activeDeckIdx].horse_ids;
    let filledCount = 0;

    currentSlots.forEach((horseId, idx) => {
      const isSelected = (selectedSlotIndex === idx);
      const horse = HORSES_MASTER[horseId];
      const div = document.createElement('div');
      
      if (horse) {
        filledCount++;
        const surfaceText = horse.turf && horse.dirt ? "万" : horse.turf ? "芝" : "ダ";
        div.className = `slot-card filled ${isSelected ? 'selected' : ''}`;
        div.innerHTML = `
          <div class="card-name">${horse.name}</div>
          <div class="card-sub">
            <span>${surfaceText}/${horse.distance || '-'}m</span>
            <span class="badge-rarity">${horse.rarity}</span>
          </div>
        `;
        div.onclick = () => removeCardFromSlot(idx);
      } else {
        div.className = `slot-card ${isSelected ? 'selected' : ''}`;
        div.innerHTML = `<div class="empty-text">${isSelected ? '【選択中】' : '＋ 空き枠'}</div>`;
        div.onclick = () => selectSlot(idx);
      }
      grid.appendChild(div);
    });

    document.getElementById('countDisplay').innerText = filledCount;
  }

  function selectSlot(idx) {
    selectedSlotIndex = idx;
    renderDeck();
  }

  function removeCardFromSlot(idx) {
    globalUserData.decks[activeDeckIdx].horse_ids[idx] = null;
    selectedSlotIndex = idx;
    syncSave();
    renderDeck();
    renderPool();
  }

  function renderPool() {
    const grid = document.getElementById('poolGrid');
    grid.innerHTML = '';

    const searchText = document.getElementById('searchInput').value.toLowerCase();
    const surfaceVal = document.getElementById('surfaceFilter').value;
    const currentDeckHorses = globalUserData.decks[activeDeckIdx].horse_ids;
    const inventory = globalUserData.cards || {};

    let poolList = [];

    for (const horseId in inventory) {
      const cardInfo = inventory[horseId];
      const count = (typeof cardInfo === 'object' && cardInfo !== null) ? (cardInfo.count || 1) : 1;
      const horse = HORSES_MASTER[horseId];

      if (count > 0 && horse && !currentDeckHorses.includes(horseId)) {
        if (searchText && !horse.name.toLowerCase().includes(searchText)) continue;
        
        if (surfaceVal === 'turf' && (!horse.turf || horse.dirt)) continue;
        if (surfaceVal === 'dirt' && (!horse.dirt || horse.turf)) continue;
        if (surfaceVal === 'both' && (!horse.turf || !horse.dirt)) continue;

        poolList.push({ horse, count });
      }
    }

    poolList.forEach(({ horse, count }) => {
      const surfaceText = horse.turf && horse.dirt ? "万" : horse.turf ? "芝" : "ダ";
      const div = document.createElement('div');
      div.className = 'pool-card';
      div.innerHTML = `
        <div class="card-name">${horse.name}</div>
        <div class="card-sub">
          <span>${surfaceText}/${horse.distance || '-'}m</span>
          <span class="badge-count">所持: ${count}</span>
        </div>
      `;
      div.onclick = () => addCardToDeck(horse.horse_id);
      grid.appendChild(div);
    });

    if (poolList.length === 0) {
      grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #666; font-size: 12px; padding: 20px;">条件に合う未編成カードがありません</div>';
    }
  }

  function addCardToDeck(horseId) {
    const currentSlots = globalUserData.decks[activeDeckIdx].horse_ids;

    if (selectedSlotIndex !== null) {
      currentSlots[selectedSlotIndex] = horseId;
      selectedSlotIndex = null;
    } else {
      const emptyIdx = currentSlots.findIndex(s => s === null);
      if (emptyIdx !== -1) {
        currentSlots[emptyIdx] = horseId;
      } else {
        alert("18スロット満杯です。");
        return;
      }
    }

    syncSave();
    renderDeck();
    renderPool();
  }

  document.getElementById('tabA').addEventListener('click', () => switchDeck(0));
  document.getElementById('tabB').addEventListener('click', () => switchDeck(1));
  document.getElementById('searchInput').addEventListener('input', renderPool);
  document.getElementById('surfaceFilter').addEventListener('change', renderPool);
</script>
</body>
</html>
