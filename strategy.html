<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦指示</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --player-color: #3399ff;
  }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg-gradient); color: var(--text-main); margin: 0; padding: 15px; font-size: 13px; display: flex; justify-content: center; }
  .container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 650px; }
  
  .header-panel { background-color: var(--panel-bg); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
  .btn-back { background: #ffffff; color: var(--accent-color); border: 1px solid var(--accent-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; text-decoration: none; }

  .info-bar { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; font-weight: bold; color: var(--accent-color); }

  .race-card { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .race-header { font-weight: bold; font-size: 14px; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; color: var(--accent-color); }
  
  .horse-info { display: flex; justify-content: space-between; align-items: center; background: #f0f7f1; padding: 8px; border-radius: 6px; }
  .horse-name { font-size: 14px; font-weight: bold; color: var(--player-color); }
  .horse-stats { font-size: 11px; color: #555; }
  
  .strat-select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-weight: bold; font-size: 13px; margin-top: 5px; }

  .btn-start { background: var(--accent-color); color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; box-shadow: 0 4px 0 var(--accent-hover); margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 出走登録へ戻る</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">作戦指示</h2>
    <div id="syncStatus" style="font-size: 11px; font-weight: bold;">☁️ 読込中...</div>
  </div>

  <div class="info-bar" id="trackCondDisplay">本日の馬場状態を判定中...</div>

  <div id="strategyList" style="display: flex; flex-direction: column; gap: 10px;"></div>

  <button class="btn-start" onclick="finalizeStrategyAndGo()">🏁 レースシーンへ進む</button>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};
  let HORSES_ARRAY = [];
  let playerEntryIds = [];
  let currentSeries = null;
  let currentRoundIdx = 0;
  let trackCondition = "良";
  let fullRaceGrids = [];

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;

    try {
      const [seriesData, horsesData] = await Promise.all([
        fetchJsonSafe('series_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      SERIES_MASTER = seriesData;
      HORSES_ARRAY = horsesData;
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => HORSES_MASTER[h.horse_id] = h);
      }

      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (!userDoc.exists()) {
        alert("ユーザーデータが存在しません。");
        window.location.href = 'battle.html';
        return;
      }

      const userData = userDoc.data();
      const status = userData?.cpu_battle_status || {};
      const currentMatch = status?.current_match;

      if (!currentMatch || !currentMatch.player_entries || currentMatch.player_entries.length === 0) {
        alert("出走登録データが見つかりません。出走登録を行ってください。");
        window.location.href = 'matchup.html';
        return;
      }

      // 該当するシリーズとラウンドの特定（matchup.html のロジックと厳密に一致）
      const currentRound = status.current_round || 1;
      currentRoundIdx = Math.max(0, currentRound - 1);

      const seriesId = status.selected_series_id || 
                       (status.series_lineup ? status.series_lineup[currentRoundIdx] : null);

      currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0];

      // プレイヤーが選択した出走馬IDの抽出
      playerEntryIds = currentMatch.player_entries.map(e => e.horse_id);

      // 馬場状態決定
      const r = Math.random();
      trackCondition = r < 0.6 ? "良" : r < 0.8 ? "稍重" : r < 0.95 ? "重" : "不良";
      document.getElementById('trackCondDisplay').textContent = `本日の馬場状態: ${trackCondition}`;

      document.getElementById('syncStatus').textContent = "✅";
      generateRaceData();
      renderStrategyUI();
    } catch (err) {
      console.error(err);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  function generateRaceData() {
    fullRaceGrids = [];
    for (let i = 0; i < 5; i++) {
      let raceGrid = [];
      
      // 1. プレイヤー馬
      let pHorse = JSON.parse(JSON.stringify(HORSES_MASTER[playerEntryIds[i]] || HORSES_ARRAY[0]));
      pHorse.isPlayer = true;
      raceGrid.push(pHorse);

      // 2. CPUライバル馬
      let cpuHorse = JSON.parse(JSON.stringify(HORSES_ARRAY[Math.floor(Math.random() * HORSES_ARRAY.length)]));
      cpuHorse.isCpu = true;
      raceGrid.push(cpuHorse);

      // 3. モブ馬 14頭
      for (let m = 0; m < 14; m++) {
        let mob = JSON.parse(JSON.stringify(HORSES_ARRAY[Math.floor(Math.random() * HORSES_ARRAY.length)]));
        mob.isPlayer = false; mob.isCpu = false;
        raceGrid.push(mob);
      }

      raceGrid.sort(() => Math.random() - 0.5);
      fullRaceGrids.push(raceGrid);
    }
  }

  function renderStrategyUI() {
    const container = document.getElementById('strategyList');
    // 現在のラウンドに対応するレースリストを取得
    const roundData = currentSeries.rounds[currentRoundIdx] || currentSeries.rounds[0];
    const races = roundData.races;
    
    container.innerHTML = "";
    races.forEach((race, i) => {
      const pHorse = HORSES_MASTER[playerEntryIds[i]] || {};
      const defaultStyle = pHorse.running_style || pHorse.style || "先行";

      const card = document.createElement('div');
      card.className = 'race-card';
      card.innerHTML = `
        <div class="race-header">第${race.race_num}戦: ${race.race_name} (${race.distance}m)</div>
        <div class="horse-info">
          <span class="horse-name">${pHorse.name || '未登録'}</span>
          <span class="horse-stats">Pt: ${pHorse.potential || '-'} | 脚質: ${defaultStyle}</span>
        </div>
        <select class="strat-select" id="strat-r${i}">
          <option value="逃げ" ${defaultStyle==="逃げ"?"selected":""}>作戦: 逃げ</option>
          <option value="先行" ${defaultStyle==="先行"?"selected":""}>作戦: 先行</option>
          <option value="差し" ${defaultStyle==="差し"?"selected":""}>作戦: 差し</option>
          <option value="追込" ${defaultStyle==="追込"?"selected":""}>作戦: 追込</option>
        </select>
      `;
      container.appendChild(card);
    });
  }

  window.finalizeStrategyAndGo = async function() {
    let chosenPlayerStrategies = [];
    for (let i = 0; i < 5; i++) {
      const tactic = document.getElementById(`strat-r${i}`).value;
      const level = Math.floor(Math.random() * 3) + 3; 
      chosenPlayerStrategies.push({ tactic: tactic, level: level });
    }

    // Firestoreの出走データで作戦を更新
    if (currentUser) {
      try {
        const updatedEntries = playerEntryIds.map((id, idx) => ({
          horse_id: id,
          strategy: chosenPlayerStrategies[idx].tactic,
          strategy_level: chosenPlayerStrategies[idx].level
        }));

        await updateDoc(doc(db, "users", currentUser.uid), {
          "cpu_battle_status.current_match.player_entries": updatedEntries
        });
      } catch(e) {
        console.error("Firestore更新失敗:", e);
      }
    }

    sessionStorage.setItem('full_race_grids', JSON.stringify(fullRaceGrids));
    sessionStorage.setItem('chosen_strategies', JSON.stringify(chosenPlayerStrategies));
    sessionStorage.setItem('track_condition', trackCondition);

    window.location.href = 'race_result.html';
  };
</script>
</body>
</html>
