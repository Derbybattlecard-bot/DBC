<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦指示</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
    --danger-color: #d9534f;
    --player-bg: #e3f2fd;
    --player-border: #90caf9;
    --cpu-bg: #ffebee;
    --cpu-border: #ef9a9a;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 10px;
    font-size: 12px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 650px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 11px;
    text-decoration: none;
  }

  .status-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .status-item { text-align: center; }
  .status-label { font-size: 10px; color: var(--text-sub); display: block; margin-bottom: 2px; }
  .status-val { font-size: 13px; font-weight: bold; }
  .status-val.error { color: var(--danger-color); }
  .status-val.ok { color: var(--accent-color); }

  /* レースカード */
  .race-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .race-info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 5px;
  }
  .race-title { font-weight: bold; font-size: 13px; color: var(--accent-color); }
  .race-cond-group { display: flex; gap: 4px; align-items: center; }
  .race-cond-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }
  
  .cond-良 { background-color: #2e7d32; }
  .cond-稍重 { background-color: #f57f17; }
  .cond-重 { background-color: #e65100; }
  .cond-不良 { background-color: #c62828; }

  /* 3カラムレイアウト */
  .versus-container {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 6px;
    align-items: stretch;
  }

  /* 自馬・CPU馬カード */
  .side-horse-box {
    border-radius: 6px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }
  .side-horse-box.player {
    background: var(--player-bg);
    border: 1px solid var(--player-border);
  }
  .side-horse-box.cpu {
    background: var(--cpu-bg);
    border: 1px solid var(--cpu-border);
  }
  
  .horse-role-tag {
    font-size: 9px;
    font-weight: bold;
    padding: 1px 4px;
    border-radius: 3px;
    display: inline-block;
    margin-bottom: 2px;
  }
  .side-horse-box.player .horse-role-tag { background: #1976d2; color: #fff; }
  .side-horse-box.cpu .horse-role-tag { background: #d32f2f; color: #fff; }

  .side-horse-name {
    font-weight: bold;
    font-size: 11px;
    line-height: 1.2;
    margin-bottom: 4px;
    word-break: break-all;
  }
  .side-horse-stats {
    font-size: 10px;
    color: #444;
  }

  /* 中央コントロールエリア（縦配置） */
  .center-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: center;
  }

  .strategy-select-vertical {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .select-strat, .select-level {
    width: 100%;
    padding: 4px 6px;
    border-radius: 5px;
    border: 1px solid var(--border-color);
    font-size: 11px;
    font-weight: bold;
    box-sizing: border-box;
    background: #fff;
  }

  .mob-field-preview {
    background: #e8f5e9;
    border: 1px solid #c8e6c9;
    border-radius: 5px;
    padding: 4px;
    font-size: 10px;
    text-align: center;
  }
  .mob-style-counts {
    font-weight: bold;
    display: flex;
    justify-content: space-around;
    margin-top: 2px;
  }

  /* テーブル表示 */
  details.race-grid-toggle {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 10px;
  }
  summary.race-grid-summary {
    padding: 5px 8px;
    font-weight: bold;
    color: var(--accent-color);
    cursor: pointer;
    user-select: none;
    background: #f9f9f9;
    border-radius: 6px;
  }
  .race-grid-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .race-grid-table th, .race-grid-table td {
    border: 1px solid #e0e0e0;
    padding: 3px 4px;
    text-align: center;
    font-size: 10px;
  }
  .race-grid-table th { background: #eee; }
  .row-player { background-color: var(--player-bg); font-weight: bold; }
  .row-cpu { background-color: var(--cpu-bg); font-weight: bold; }

  .btn-submit {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--accent-hover);
    margin-top: 8px;
  }
  .btn-submit:disabled { background: #a0a0a0; box-shadow: 0 4px 0 #7a7a7a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 出走登録へ</a>
    <h2 style="margin:0; font-size: 15px; color: var(--accent-color);">作戦指示</h2>
    <div id="syncStatus" style="font-size: 10px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">作戦設定状況</span>
      <span class="status-val" id="stratConfigCount">5 / 5</span>
    </div>
    <div class="status-item">
      <span class="status-label">合計作戦レベル</span>
      <span class="status-val" id="totalLevelDisplay">0 / 18</span>
    </div>
    <div class="status-item">
      <span class="status-label">制限判定</span>
      <span class="status-val" id="limitStatus">確認中</span>
    </div>
  </div>

  <div id="raceCardList" style="display:flex; flex-direction:column; gap:10px;"></div>

  <button class="btn-submit" id="btnGoRace" disabled onclick="finalizeAndStartRace()">レースへ進む！</button>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};
  let STRATEGY_MASTER = [];

  let currentSeries = null;
  let playerEntries = [];
  let cpuEntries = [];
  let racesMobIds = [];
  let loadedTrackConditions = [];

  const MAX_TOTAL_LEVEL = 18;

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) globalUserData = userDoc.data();

      // レース途中（作戦指示完了・進行中）の自動リダイレクト処理
      const status = globalUserData?.cpu_battle_status;
      if (status && status.current_match && status.current_match.full_race_grids) {
        window.location.href = 'race_result.html';
        return;
      }

      const [seriesData, horsesData] = await Promise.all([
        fetchJsonSafe('series_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      SERIES_MASTER = seriesData || [];
      
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => { 
          const idStr = String(h.horse_id);
          HORSES_MASTER[idStr] = h;
          const paddedId = idStr.padStart(4, '0');
          if (idStr !== paddedId) HORSES_MASTER[paddedId] = h;
        });
      }

      try {
        const stratData = await fetchJsonSafe('strategy_master.json');
        STRATEGY_MASTER = Array.isArray(stratData) && stratData.length > 0 ? stratData : getDefaultStrategies();
      } catch (err) {
        console.warn("strategy_master.json の読み込みに失敗したためデフォルト定義を使用します:", err);
        STRATEGY_MASTER = getDefaultStrategies();
      }

      initStrategyPage();
      document.getElementById('syncStatus').textContent = "✅ 準備完了";

    } catch (e) {
      console.error("データ通信エラー:", e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  function getDefaultStrategies() {
    return [
      { strategy_id: "NIGE_01", name: "ハナにこだわる", category: "逃げ" },
      { strategy_id: "SENKO_01", name: "先行して粘り込み", category: "先行" },
      { strategy_id: "SASHI_01", name: "早目スパート", category: "差し" },
      { strategy_id: "OIKOMI_01", name: "道中死んだふり", category: "追込" }
    ];
  }

  function getHorsePt(horse, surface) {
    if (!horse) return 0;
    if (surface === '芝') {
      if (horse.turf_potential !== undefined) return horse.turf_potential;
      if (horse.aptitude && horse.aptitude.turf_potential !== undefined) return horse.aptitude.turf_potential;
    } else if (surface === 'ダート' || surface === 'ダ') {
      if (horse.dirt_potential !== undefined) return horse.dirt_potential;
      if (horse.aptitude && horse.aptitude.dirt_potential !== undefined) return horse.aptitude.dirt_potential;
    }
    return parseInt(horse.potential || horse.pt || 0, 10) || 0;
  }

  function getHorseStyle(horse) {
    if (!horse) return '先行';
    return horse.running_style || horse.leg_style || horse.style || horse.strategy || '先行';
  }

  function getDefaultStrategyForStyle(style) {
    if (!style) return null;
    const s = String(style);
    let catName = '先行';
    let prefix = 'SENKO_';

    if (s.includes('逃追')) { catName = '逃げ'; prefix = 'NIGE_'; }
    else if (s.includes('逃')) { catName = '逃げ'; prefix = 'NIGE_'; }
    else if (s.includes('差')) { catName = '差し'; prefix = 'SASHI_'; }
    else if (s.includes('追')) { catName = '追込'; prefix = 'OIKOMI_'; }
    else if (s.includes('先')) { catName = '先行'; prefix = 'SENKO_'; }

    const match = STRATEGY_MASTER.find(item => {
      if (!item) return false;
      if (item.strategy_id && item.strategy_id.startsWith(prefix)) return true;
      if (item.category === catName || item.style === catName) return true;
      return false;
    });

    return match ? (match.name || match.strategy_name || match.strategy) : null;
  }

  function isValidStrategyForNigetui(stratNameOrId) {
    if (!stratNameOrId) return false;
    const match = STRATEGY_MASTER.find(s => s.strategy_id === stratNameOrId || s.name === stratNameOrId);
    if (!match) return false;
    const isLead = (match.strategy_id?.startsWith('NIGE_') || match.category === '逃げ' || match.style === '逃げ');
    const isOikomi = (match.strategy_id?.startsWith('OIKOMI_') || match.category === '追込' || match.style === '追込');
    return isLead || isOikomi;
  }

  function getInitialStrategyForHorse(pEntry, rIdx) {
    if (!pEntry) return null;

    const pHorse = HORSES_MASTER[String(pEntry.horse_id)];
    const pStyle = getHorseStyle(pHorse);
    const isNigetui = (pStyle === '逃追');

    if (pEntry.isCustomized && pEntry.strategy) {
      if (!isNigetui || isValidStrategyForNigetui(pEntry.strategy)) {
        const match = STRATEGY_MASTER.find(s => s.strategy_id === pEntry.strategy || s.name === pEntry.strategy);
        return match ? (match.name || match.strategy_name || match.strategy) : pEntry.strategy;
      }
    }

    let targetDeck = null;

    if (globalUserData?.decks && Array.isArray(globalUserData.decks)) {
      targetDeck = globalUserData.decks.find(deck => 
        Array.isArray(deck.horse_ids) && pEntry.horse_id && deck.horse_ids.map(String).includes(String(pEntry.horse_id))
      );
    }

    if (!targetDeck) {
      const savedDeckIdx = globalUserData?.cpu_battle_status?.selected_deck_idx 
        ?? globalUserData?.cpu_battle_status?.current_match?.selected_deck_idx 
        ?? globalUserData?.selectedDeckIdx 
        ?? 0;
      targetDeck = globalUserData?.decks?.[savedDeckIdx];
    }

    if (targetDeck && targetDeck.default_strategies) {
      let defaultStratId = null;

      if (pEntry.horse_id && Array.isArray(targetDeck.horse_ids)) {
        const foundIdx = targetDeck.horse_ids.findIndex(id => String(id) === String(pEntry.horse_id));
        if (foundIdx !== -1 && targetDeck.default_strategies[foundIdx]) {
          defaultStratId = targetDeck.default_strategies[foundIdx];
        }
      }

      if (!defaultStratId) {
        const slotIdx = pEntry.slot_idx !== undefined ? pEntry.slot_idx : rIdx;
        if (targetDeck.default_strategies[slotIdx]) {
          defaultStratId = targetDeck.default_strategies[slotIdx];
        }
      }

      if (defaultStratId) {
        if (!isNigetui || isValidStrategyForNigetui(defaultStratId)) {
          const match = STRATEGY_MASTER.find(s => s.strategy_id === defaultStratId || s.name === defaultStratId);
          if (match) return match.name || match.strategy_name || match.strategy;
        }
      }
    }

    return getDefaultStrategyForStyle(pStyle) || (isNigetui ? "ハイラップ逃げ" : "先行して粘り込み");
  }

  function initStrategyPage() {
    const status = globalUserData?.cpu_battle_status || {};
    const currentMatch = status.current_match || {};

    if (!currentMatch.player_entries || currentMatch.player_entries.length === 0) {
      alert("出走登録データが見つかりません。");
      window.location.href = 'matchup.html';
      return;
    }

    const currentRound = status.current_round || 1;
    const seriesId = status.selected_series_id || (status.series_lineup ? status.series_lineup[currentRound - 1] : null);
    currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0] || {};

    playerEntries = currentMatch.player_entries || [];
    cpuEntries = currentMatch.cpu_entries || [];
    racesMobIds = currentMatch.races_mob_ids || [];
    loadedTrackConditions = currentMatch.races_track_conditions || ['良', '良', '良', '良', '良'];

    renderRaceCards();
    updateTotalStatus();
  }

  function renderRaceCards() {
    const races = (currentSeries?.rounds && currentSeries.rounds[0]?.races) || [{},{},{},{},{}];
    const container = document.getElementById('raceCardList');
    container.innerHTML = '';

    races.forEach((race, rIdx) => {
      const pEntry = playerEntries[rIdx] || {};
      const pHorse = HORSES_MASTER[String(pEntry.horse_id)] || {};
      const pPt = getHorsePt(pHorse, race.surface);
      const pStyle = getHorseStyle(pHorse);
      const isNigetui = (pStyle === '逃追');

      if (!pEntry.isCustomized) {
        const initStrat = getInitialStrategyForHorse(pEntry, rIdx);
        pEntry.strategy = initStrat;
      } else if (isNigetui) {
        // 逃追馬で先行・差しが残っていた場合の安全フォールバック
        if (!isValidStrategyForNigetui(pEntry.strategy)) {
          pEntry.strategy = getDefaultStrategyForStyle(pStyle) || "ハイラップ逃げ";
        }
      }

      const cpuEntry = cpuEntries[rIdx] || {};
      const cpuHorse = HORSES_MASTER[String(cpuEntry.horse_id)] || {};
      const cpuPt = getHorsePt(cpuHorse, race.surface);
      const cpuStyle = getHorseStyle(cpuHorse);

      const mobIds = racesMobIds[rIdx] || racesMobIds[String(rIdx)] || [];
      const trackCond = loadedTrackConditions[rIdx] || '良';

      // モブ馬脚質の集計処理
      const styleCounts = { "逃げ": 0, "先行": 0, "差し": 0, "追込": 0 };
      mobIds.forEach(mId => {
        const mob = HORSES_MASTER[String(mId)];
        if (!mob) return;
        const style = getHorseStyle(mob);
        if (style.includes('大逃') || style.includes('逃')) styleCounts["逃げ"]++;
        else if (style.includes('先') || style.includes('好')) styleCounts["先行"]++;
        else if (style.includes('差')) styleCounts["差し"]++;
        else styleCounts["追込"]++;
      });

      const card = document.createElement('div');
      card.className = 'race-card';

      const surfaceClass = race.surface === '芝' ? 'surface-turf' : 'surface-dirt';

      let stratOptionsHtml = '';
      const allCategories = [
        { prefix: 'NIGE_',   catName: '逃げ', title: '【逃げ系】' },
        { prefix: 'SENKO_',  catName: '先行', title: '【先行系】' },
        { prefix: 'SASHI_',  catName: '差し', title: '【差し系】' },
        { prefix: 'OIKOMI_', catName: '追込', title: '【追込系】' }
      ];

      // ★逃追脚質の場合は「逃げ」と「追込」のみをカテゴリとして許可
      const categories = isNigetui 
        ? allCategories.filter(cat => cat.catName === '逃げ' || cat.catName === '追込')
        : allCategories;

      categories.forEach(cat => {
        stratOptionsHtml += `<optgroup label="${cat.title}">`;
        
        const categoryStrats = STRATEGY_MASTER.filter(s => {
          if (!s) return false;
          if (s.strategy_id) return s.strategy_id.startsWith(cat.prefix);
          return s.category === cat.catName || s.style === cat.catName;
        });
        
        categoryStrats.forEach(s => {
          const sName = s.name || s.strategy_name || s.strategy || cat.title;
          const sId = s.strategy_id || sName;
          
          const isSelected = pEntry.strategy === sName || pEntry.strategy === sId;
          stratOptionsHtml += `<option value="${sName}" ${isSelected ? 'selected' : ''}>${sName}</option>`;
        });
        stratOptionsHtml += `</optgroup>`;
      });

      let levelOptionsHtml = '';
      const currentLevel = pEntry.strategy_level || 3;
      for (let lvl = 1; lvl <= 5; lvl++) {
        levelOptionsHtml += `<option value="${lvl}" ${lvl === currentLevel ? 'selected' : ''}>Lv.${lvl}</option>`;
      }

      let gridRowsHtml = `
        <tr class="row-player">
          <td>-</td>
          <td style="text-align:left;">${pHorse.name || '未設定'} (自馬)</td>
          <td>${pHorse.sex || '牡'}</td>
          <td>${pPt}</td>
          <td>${pStyle}</td>
        </tr>
        <tr class="row-cpu">
          <td>-</td>
          <td style="text-align:left;">${cpuHorse.name || 'CPU'} (ライバル)</td>
          <td>${cpuHorse.sex || '牡'}</td>
          <td>${cpuPt}</td>
          <td>${cpuStyle}</td>
        </tr>
      `;

      mobIds.forEach((mId) => {
        const mHorse = HORSES_MASTER[String(mId)] || {};
        gridRowsHtml += `
          <tr>
            <td>-</td>
            <td style="text-align:left;">${mHorse.name || 'モブ馬'}</td>
            <td>${mHorse.sex || '牡'}</td>
            <td>${getHorsePt(mHorse, race.surface)}</td>
            <td>${getHorseStyle(mHorse)}</td>
          </tr>
        `;
      });

      card.innerHTML = `
        <div class="race-info-header">
          <span class="race-title">第${race.race_num || rIdx+1}戦: ${race.race_name || 'レース'}</span>
          <div class="race-cond-group">
            <span class="race-cond-badge ${surfaceClass}">${race.surface || '芝'} ${race.track || ''} ${race.distance || '2000'}m</span>
            <span class="race-cond-badge cond-${trackCond}">馬場:${trackCond}</span>
          </div>
        </div>
        
        <div class="versus-container">
          <!-- 左：自馬情報 -->
          <div class="side-horse-box player">
            <div><span class="horse-role-tag">YOUR HORSE</span></div>
            <div class="side-horse-name">${pHorse.name || '未設定'}</div>
            <div class="side-horse-stats">Pt: <b>${pPt}</b></div>
            <div class="side-horse-stats">得意: <b>${pStyle}</b>${isNigetui ? ' <span style="font-size:9px; color:#c62828; font-weight:bold;">(逃げ/追込限定)</span>' : ''}</div>
          </div>

          <!-- 中央：作戦設定＆モブ脚質統計 -->
          <div class="center-controls">
            <div class="strategy-select-vertical">
              <select class="select-strat" id="selectStrat${rIdx}" onchange="onStrategyChanged(${rIdx})">
                ${stratOptionsHtml}
              </select>
              <select class="select-level" id="selectLevel${rIdx}" onchange="onStrategyChanged(${rIdx})">
                ${levelOptionsHtml}
              </select>
            </div>
            
            <div class="mob-field-preview">
              <div style="font-weight:bold; color:var(--accent-color); font-size:9px;">🏇 モブ脚質分布</div>
              <div class="mob-style-counts">
                <span>逃:${styleCounts["逃げ"]}</span>
                <span>先:${styleCounts["先行"]}</span>
                <span>差:${styleCounts["差し"]}</span>
                <span>追:${styleCounts["追込"]}</span>
              </div>
            </div>
          </div>

          <!-- 右：CPU対戦馬情報 -->
          <div class="side-horse-box cpu">
            <div><span class="horse-role-tag">CPU HORSE</span></div>
            <div class="side-horse-name">${cpuHorse.name || 'CPU'}</div>
            <div class="side-horse-stats">Pt: <b>${cpuPt}</b></div>
            <div class="side-horse-stats">得意: <b>${cpuStyle}</b></div>
          </div>
        </div>

        <details class="race-grid-toggle">
          <summary class="race-grid-summary">📋 出走メンバー（全16頭）を確認する</summary>
          <div style="padding: 4px 6px; font-size: 9px; color: #666;">※馬番（枠順）は「レースへ進む！」押下時にランダム決定されます。</div>
          <table class="race-grid-table">
            <thead>
              <tr>
                <th>馬番</th>
                <th>馬名</th>
                <th>性</th>
                <th>Pt</th>
                <th>脚質</th>
              </tr>
            </thead>
            <tbody>
              ${gridRowsHtml}
            </tbody>
          </table>
        </details>
      `;

      container.appendChild(card);
    });
  }

  window.onStrategyChanged = function(rIdx) {
    if (!playerEntries[rIdx]) return;
    const stratVal = document.getElementById(`selectStrat${rIdx}`).value;
    const levelVal = parseInt(document.getElementById(`selectLevel${rIdx}`).value, 10);

    playerEntries[rIdx].strategy = stratVal;
    playerEntries[rIdx].strategy_level = levelVal;
    playerEntries[rIdx].isCustomized = true;

    updateTotalStatus();
  };

  function updateTotalStatus() {
    let totalLvl = 0;
    
    for (let rIdx = 0; rIdx < 5; rIdx++) {
      const selectLvl = document.getElementById(`selectLevel${rIdx}`);
      if (selectLvl) {
        totalLvl += parseInt(selectLvl.value, 10) || 3;
      } else if (playerEntries[rIdx]) {
        totalLvl += parseInt(playerEntries[rIdx].strategy_level || 3, 10);
      }
    }

    const lvlEl = document.getElementById('totalLevelDisplay');
    const limitEl = document.getElementById('limitStatus');
    const goBtn = document.getElementById('btnGoRace');

    lvlEl.textContent = `${totalLvl} / ${MAX_TOTAL_LEVEL}`;

    if (totalLvl > MAX_TOTAL_LEVEL) {
      lvlEl.className = 'status-val error';
      limitEl.textContent = '合計オーバー';
      limitEl.className = 'status-val error';
      goBtn.disabled = true;
    } else {
      lvlEl.className = 'status-val ok';
      limitEl.textContent = 'OK';
      limitEl.className = 'status-val ok';
      goBtn.disabled = false;
    }
  }

  function generateRandomGates(mobCount = 14) {
    const numbers = Array.from({ length: 16 }, (_, i) => i + 1);
    for (let i = numbers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
    }
    return {
      playerGate: numbers[0],
      cpuGate: numbers[1],
      mobGates: numbers.slice(2, 2 + mobCount)
    };
  }

  window.finalizeAndStartRace = async function() {
    if (!currentUser) return;

    const btn = document.getElementById('btnGoRace');
    btn.disabled = true;
    btn.textContent = "枠順抽選・データ送信中...";

    try {
      const currentStatus = globalUserData.cpu_battle_status || {};
      const currentMatch = currentStatus.current_match || {};

      const finalPlayerEntries = [];
      const finalCpuEntries = [...cpuEntries];
      const racesMobGates = {};
      const fullRaceGrids = {};

      for (let rIdx = 0; rIdx < playerEntries.length; rIdx++) {
        const pEntry = playerEntries[rIdx] || {};
        const mobIds = racesMobIds[rIdx] || racesMobIds[String(rIdx)] || [];
        const gates = generateRandomGates(mobIds.length);

        const stratSelect = document.getElementById(`selectStrat${rIdx}`);
        const levelSelect = document.getElementById(`selectLevel${rIdx}`);
        const finalStrat = stratSelect ? stratSelect.value : (pEntry.strategy || "先行して粘り込み");
        const finalLevel = levelSelect ? parseInt(levelSelect.value, 10) : (pEntry.strategy_level || 3);

        const updatedPlayerEntry = {
          ...pEntry,
          strategy: finalStrat,
          strategy_level: finalLevel,
          gate_number: gates.playerGate
        };
        finalPlayerEntries.push(updatedPlayerEntry);

        let updatedCpuEntry = null;
        if (finalCpuEntries[rIdx]) {
          updatedCpuEntry = {
            ...finalCpuEntries[rIdx],
            gate_number: gates.cpuGate
          };
          finalCpuEntries[rIdx] = updatedCpuEntry;
        }

        racesMobGates[rIdx] = gates.mobGates;
        racesMobGates[String(rIdx)] = gates.mobGates;

        const raceGrid = [];

        raceGrid.push({
          ...updatedPlayerEntry,
          isPlayer: true,
          type: 'player'
        });

        if (updatedCpuEntry) {
          raceGrid.push({
            ...updatedCpuEntry,
            isCpu: true,
            type: 'cpu'
          });
        }

        mobIds.forEach((mId, mIdx) => {
          raceGrid.push({
            horse_id: mId,
            gate_number: gates.mobGates[mIdx],
            type: 'mob'
          });
        });

        raceGrid.sort((a, b) => (a.gate_number || 0) - (b.gate_number || 0));

        fullRaceGrids[rIdx] = raceGrid;
        fullRaceGrids[String(rIdx)] = raceGrid;
      }

      const updatedStatus = {
        ...currentStatus,
        current_match: {
          ...currentMatch,
          player_entries: finalPlayerEntries,
          cpu_entries: finalCpuEntries,
          races_mob_gates: racesMobGates,
          full_race_grids: fullRaceGrids
        }
      };

      const cleanUpdatedStatus = JSON.parse(JSON.stringify(updatedStatus));

      await setDoc(doc(db, "users", currentUser.uid), {
        cpu_battle_status: cleanUpdatedStatus
      }, { merge: true });

      globalUserData.cpu_battle_status = cleanUpdatedStatus;
      window.location.href = 'race_result.html';
    } catch (err) {
      console.error("作戦・枠順保存エラー:", err);
      alert(`データの保存に失敗しました。もう一度お試しください。\n【詳細】${err.message}`);
      btn.disabled = false;
      btn.textContent = "レースへ進む！";
    }
  };
</script>
