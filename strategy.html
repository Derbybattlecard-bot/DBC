<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦確定</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 650px; }

  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  .strategy-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }

  .race-title-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .race-name { font-weight: bold; font-size: 14px; color: var(--accent-color); }
  .race-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }

  .horse-info-box {
    background: #f7fbf7;
    padding: 8px 12px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .horse-name { font-weight: bold; font-size: 13px; }

  .strategy-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #ffffff;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .control-label { font-size: 11px; font-weight: bold; color: var(--text-sub); }
  .strategy-select {
    padding: 5px 8px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    font-weight: bold;
    font-size: 12px;
    background: #ffffff;
  }

  .level-btn-group {
    display: flex;
    gap: 4px;
  }
  .btn-level {
    border: 1px solid var(--border-color);
    background: #f0f4f1;
    color: var(--text-main);
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
  }
  .btn-level.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  .action-group {
    margin-top: 10px;
    margin-bottom: 20px;
  }
  .btn-submit {
    width: 100%;
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--accent-hover);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 出走登録へ</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">作戦設定</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <div id="strategyList" style="display:flex; flex-direction:column; gap:12px;"></div>

  <div class="action-group">
    <button class="btn-submit" id="btnConfirmStrategy" onclick="confirmStrategy()">全レース作戦確定 ＆ 保存</button>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};

  let currentSeries = null;
  let playerEntries = [];
  const STRATEGIES = ['逃げ', '先行', '差し', '追込', '自在'];

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) globalUserData = userDoc.data();

      const [seriesData, horsesData] = await Promise.all([
        fetchJsonSafe('series_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      SERIES_MASTER = seriesData;
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => { HORSES_MASTER[h.horse_id] = h; });
      }

      initStrategyPage();
      document.getElementById('syncStatus').textContent = "✅";
    } catch (e) {
      console.error(e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  function initStrategyPage() {
    const status = globalUserData?.cpu_battle_status || {};
    const matchData = status.current_match || {};

    if (!matchData.player_entries) {
      alert("出走データが見つかりません。出走登録画面へ戻ります。");
      window.location.href = 'matchup.html';
      return;
    }

    const seriesId = status.selected_series_id || (status.series_lineup ? status.series_lineup[(status.current_round || 1) - 1] : null);
    currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0];

    // player_entries の深いコピーを保持
    playerEntries = JSON.parse(JSON.stringify(matchData.player_entries));

    renderCards();
  }

  function renderCards() {
    const races = currentSeries.rounds[0].races;
    const container = document.getElementById('strategyList');
    container.innerHTML = '';

    races.forEach((race, rIdx) => {
      const pEntry = playerEntries[rIdx] || { strategy: '先行', strategy_level: 3 };
      const horse = HORSES_MASTER[pEntry.horse_id];

      const surfaceClass = race.surface === '芝' ? 'surface-turf' : 'surface-dirt';

      const card = document.createElement('div');
      card.className = 'strategy-card';

      card.innerHTML = `
        <div class="race-title-bar">
          <span class="race-name">第${race.race_num}戦: ${race.race_name}</span>
          <span class="race-badge ${surfaceClass}">${race.surface} ${race.track} ${race.distance}m</span>
        </div>

        <div class="horse-info-box">
          <span class="horse-name">🟢 ${horse ? horse.name : '未選択'}</span>
          <span style="font-size:11px; color:var(--text-sub);">脚質: ${horse ? (horse.style || '自在') : '-'}</span>
        </div>

        <div class="strategy-controls">
          <div class="control-row">
            <span class="control-label">指定作戦</span>
            <select class="strategy-select" onchange="updateStrategy(${rIdx}, 'strategy', this.value)">
              ${STRATEGIES.map(s => `<option value="${s}" ${s === pEntry.strategy ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="control-row">
            <span class="control-label">作戦レベル</span>
            <div class="level-btn-group" id="levelGroup${rIdx}">
              ${[1,2,3,4,5].map(lvl => `
                <button type="button" class="btn-level ${lvl === pEntry.strategy_level ? 'active' : ''}" onclick="updateStrategy(${rIdx}, 'level', ${lvl})">Lv.${lvl}</button>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  window.updateStrategy = function(rIdx, key, val) {
    if (!playerEntries[rIdx]) return;

    if (key === 'strategy') {
      playerEntries[rIdx].strategy = val;
    } else if (key === 'level') {
      playerEntries[rIdx].strategy_level = parseInt(val, 10);
      
      const btnGroup = document.getElementById(`levelGroup${rIdx}`);
      if (btnGroup) {
        const btns = btnGroup.querySelectorAll('.btn-level');
        btns.forEach((btn, idx) => {
          if (idx + 1 === playerEntries[rIdx].strategy_level) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });
      }
    }
  };

  window.confirmStrategy = async function() {
    if (!currentUser) return;

    const btn = document.getElementById('btnConfirmStrategy');
    btn.disabled = true;
    btn.textContent = "保存中...";

    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        "cpu_battle_status.current_match.player_entries": playerEntries
      });

      window.location.href = 'race.html';
    } catch (err) {
      console.error("保存エラー:", err);
      alert("作戦の保存に失敗しました。");
      btn.disabled = false;
      btn.textContent = "全レース作戦確定 ＆ 保存";
    }
  };
</script>

</body>
</html>
