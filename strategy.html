<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦指示</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
    --danger-color: #d9534f;
    --player-bg: #e3f2fd;
    --cpu-bg: #ffebee;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 650px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  .status-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .status-item { text-align: center; }
  .status-label { font-size: 10px; color: var(--text-sub); display: block; margin-bottom: 2px; }
  .status-val { font-size: 14px; font-weight: bold; }
  .status-val.error { color: var(--danger-color); }
  .status-val.ok { color: var(--accent-color); }

  .race-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .race-info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .race-title { font-weight: bold; font-size: 13px; color: var(--accent-color); }
  .race-cond-group { display: flex; gap: 4px; align-items: center; }
  .race-cond-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }
  
  .cond-良 { background-color: #2e7d32; }
  .cond-稍重 { background-color: #f57f17; }
  .cond-重 { background-color: #e65100; }
  .cond-不良 { background-color: #c62828; }

  .my-horse-box {
    background: #f0f7f1;
    border: 1px solid #c8e6c9;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .my-horse-title { font-weight: bold; color: var(--accent-color); font-size: 12px; margin-bottom: 4px; }

  .strategy-select-group {
    display: flex;
    gap: 8px;
  }
  .select-strat {
    flex: 2;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: bold;
  }
  .select-level {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: bold;
  }

  details.race-grid-toggle {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 11px;
  }
  summary.race-grid-summary {
    padding: 6px 10px;
    font-weight: bold;
    color: var(--accent-color);
    cursor: pointer;
    user-select: none;
    background: #f9f9f9;
    border-radius: 6px;
  }
  .race-grid-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .race-grid-table th, .race-grid-table td {
    border: 1px solid #e0e0e0;
    padding: 4px 6px;
    text-align: center;
    font-size: 10px;
  }
  .race-grid-table th { background: #eee; }
  .row-player { background-color: var(--player-bg); font-weight: bold; }
  .row-cpu { background-color: var(--cpu-bg); font-weight: bold; }

  .btn-submit {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--accent-hover);
    margin-top: 10px;
  }
  .btn-submit:disabled { background: #a0a0a0; box-shadow: 0 4px 0 #7a7a7a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 出走登録へ</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">作戦指示</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">作戦設定状況</span>
      <span class="status-val" id="stratConfigCount">5 / 5</span>
    </div>
    <div class="status-item">
      <span class="status-label">合計作戦レベル</span>
      <span class="status-val" id="totalLevelDisplay">0 / 18</span>
    </div>
    <div class="status-item">
      <span class="status-label">制限判定</span>
      <span class="status-val" id="limitStatus">確認中</span>
    </div>
  </div>

  <div id="raceCardList" style="display:flex; flex-direction:column; gap:12px;"></div>

  <button class="btn-submit" id="btnGoRace" disabled onclick="finalizeAndStartRace()">レースへ進む！</button>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};
  let STRATEGY_MASTER = [];

  let currentSeries = null;
  let playerEntries = [];
  let cpuEntries = [];
  let racesMobIds = [];
  let loadedTrackConditions = [];

  const MAX_TOTAL_LEVEL = 18;

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) globalUserData = userDoc.data();

      const [seriesData, horsesData] = await Promise.all([
        fetchJsonSafe('series_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      SERIES_MASTER = seriesData || [];
      
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => { 
          const idStr = String(h.horse_id);
          HORSES_MASTER[idStr] = h;
          const paddedId = idStr.padStart(4, '0');
          if (idStr !== paddedId) HORSES_MASTER[paddedId] = h;
        });
      }

      try {
        const stratData = await fetchJsonSafe('strategy_master.json');
        STRATEGY_MASTER = Array.isArray(stratData) && stratData.length > 0 ? stratData : getDefaultStrategies();
      } catch (err) {
        console.warn("strategy_master.json の読み込みに失敗したためデフォルト定義を使用します:", err);
        STRATEGY_MASTER = getDefaultStrategies();
      }

      initStrategyPage();
      document.getElementById('syncStatus').textContent = "✅ 準備完了";

    } catch (e) {
      console.error("データ通信エラー:", e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  function getDefaultStrategies() {
    return [
      { name: "逃げ", category: "逃げ" }, { name: "大逃げ", category: "逃げ" },
      { name: "先行", category: "先行" }, { name: "好位", category: "先行" },
      { name: "差し", category: "差し" }, { name: "待機", category: "差し" },
      { name: "追込", category: "追込" }, { name: "最後方", category: "追込" }
    ];
  }

  function getHorsePt(horse, surface) {
    if (!horse) return 0;
    if (surface === '芝') {
      if (horse.turf_potential !== undefined) return horse.turf_potential;
      if (horse.aptitude && horse.aptitude.turf_potential !== undefined) return horse.aptitude.turf_potential;
    } else if (surface === 'ダート' || surface === 'ダ') {
      if (horse.dirt_potential !== undefined) return horse.dirt_potential;
      if (horse.aptitude && horse.aptitude.dirt_potential !== undefined) return horse.aptitude.dirt_potential;
    }
    return parseInt(horse.potential || horse.pt || 0, 10) || 0;
  }

  function getHorseStyle(horse) {
    if (!horse) return '先行';
    return horse.running_style || horse.leg_style || horse.style || horse.strategy || '先行';
  }

  function getDefaultStrategyForStyle(style) {
    if (!style) return null;
    const s = String(style);
    let catName = '先行';
    let prefix = 'SENKO_';

    if (s.includes('逃')) { catName = '逃げ'; prefix = 'NIGE_'; }
    else if (s.includes('差')) { catName = '差し'; prefix = 'SASHI_'; }
    else if (s.includes('追')) { catName = '追込'; prefix = 'OIKOMI_'; }
    else if (s.includes('先')) { catName = '先行'; prefix = 'SENKO_'; }

    const match = STRATEGY_MASTER.find(item => {
      if (!item) return false;
      if (item.strategy_id && item.strategy_id.startsWith(prefix)) return true;
      if (item.category === catName) return true;
      return false;
    });

    return match ? (match.name || match.strategy_name || match.strategy) : null;
  }

  function initStrategyPage() {
    const status = globalUserData?.cpu_battle_status || {};
    const currentMatch = status.current_match || {};

    if (!currentMatch.player_entries || currentMatch.player_entries.length === 0) {
      alert("出走登録データが見つかりません。");
      window.location.href = 'matchup.html';
      return;
    }

    const currentRound = status.current_round || 1;
    const seriesId = status.selected_series_id || (status.series_lineup ? status.series_lineup[currentRound - 1] : null);
    currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0] || {};

    playerEntries = currentMatch.player_entries || [];
    cpuEntries = currentMatch.cpu_entries || [];
    racesMobIds = currentMatch.races_mob_ids || [];
    loadedTrackConditions = currentMatch.races_track_conditions || ['良', '良', '良', '良', '良'];

    renderRaceCards();
    updateTotalStatus();
  }

  function renderRaceCards() {
    const races = (currentSeries?.rounds && currentSeries.rounds[0]?.races) || [{},{},{},{},{}];
    const container = document.getElementById('raceCardList');
    container.innerHTML = '';

    races.forEach((race, rIdx) => {
      const pEntry = playerEntries[rIdx] || {};
      const pHorse = HORSES_MASTER[String(pEntry.horse_id)] || {};
      const pPt = getHorsePt(pHorse, race.surface);
      const pStyle = getHorseStyle(pHorse);

      const defaultStrat = getDefaultStrategyForStyle(pStyle);
      if (!pEntry.isCustomized) {
        pEntry.strategy = defaultStrat || pEntry.strategy || "好位";
      }

      const cpuEntry = cpuEntries[rIdx] || {};
      const cpuHorse = HORSES_MASTER[String(cpuEntry.horse_id)] || {};
      const cpuPt = getHorsePt(cpuHorse, race.surface);

      const mobIds = racesMobIds[rIdx] || racesMobIds[String(rIdx)] || [];
      const trackCond = loadedTrackConditions[rIdx] || '良';

      const card = document.createElement('div');
      card.className = 'race-card';

      const surfaceClass = race.surface === '芝' ? 'surface-turf' : 'surface-dirt';

      let stratOptionsHtml = '';
      const categories = [
        { prefix: 'NIGE_',   catName: '逃げ', title: '【逃げ系】' },
        { prefix: 'SENKO_',  catName: '先行', title: '【先行系】' },
        { prefix: 'SASHI_',  catName: '差し', title: '【差し系】' },
        { prefix: 'OIKOMI_', catName: '追込', title: '【追込系】' }
      ];

      categories.forEach(cat => {
        stratOptionsHtml += `<optgroup label="${cat.title}">`;
        
        const categoryStrats = STRATEGY_MASTER.filter(s => {
          if (!s) return false;
          if (s.strategy_id) return s.strategy_id.startsWith(cat.prefix);
          return s.category === cat.catName;
        });
        
        categoryStrats.forEach(s => {
          const sName = s.name || s.strategy_name || s.strategy || cat.title;
          const isSelected = pEntry.strategy === sName;
          stratOptionsHtml += `<option value="${sName}" ${isSelected ? 'selected' : ''}>${sName}</option>`;
        });
        stratOptionsHtml += `</optgroup>`;
      });

      let levelOptionsHtml = '';
      const currentLevel = pEntry.strategy_level || 3;
      for (let lvl = 1; lvl <= 5; lvl++) {
        levelOptionsHtml += `<option value="${lvl}" ${lvl === currentLevel ? 'selected' : ''}>Lv.${lvl}</option>`;
      }

      let gridRowsHtml = `
        <tr class="row-player">
          <td>-</td>
          <td style="text-align:left;">${pHorse.name || '未設定'} (自馬)</td>
          <td>${pHorse.sex || '牡'}</td>
          <td>${pPt}</td>
          <td>${pStyle}</td>
        </tr>
        <tr class="row-cpu">
          <td>-</td>
          <td style="text-align:left;">${cpuHorse.name || 'CPU'} (ライバル)</td>
          <td>${cpuHorse.sex || '牡'}</td>
          <td>${cpuPt}</td>
          <td>${getHorseStyle(cpuHorse)}</td>
        </tr>
      `;

      mobIds.forEach((mId) => {
        const mHorse = HORSES_MASTER[String(mId)] || {};
        gridRowsHtml += `
          <tr>
            <td>-</td>
            <td style="text-align:left;">${mHorse.name || 'モブ馬'}</td>
            <td>${mHorse.sex || '牡'}</td>
            <td>${getHorsePt(mHorse, race.surface)}</td>
            <td>${getHorseStyle(mHorse)}</td>
          </tr>
        `;
      });

      card.innerHTML = `
        <div class="race-info-header">
          <span class="race-title">第${race.race_num || rIdx+1}戦: ${race.race_name || 'レース'}</span>
          <div class="race-cond-group">
            <span class="race-cond-badge ${surfaceClass}">${race.surface || '芝'} ${race.track || ''} ${race.distance || '2000'}m</span>
            <span class="race-cond-badge cond-${trackCond}">馬場:${trackCond}</span>
          </div>
        </div>
        
        <div class="my-horse-box">
          <div class="my-horse-title">出走馬: ${pHorse.name || '未設定'} (Pt:${pPt} / 得意:${pStyle})</div>
          <div class="strategy-select-group">
            <select class="select-strat" id="selectStrat${rIdx}" onchange="onStrategyChanged(${rIdx})">
              ${stratOptionsHtml}
            </select>
            <select class="select-level" id="selectLevel${rIdx}" onchange="onStrategyChanged(${rIdx})">
              ${levelOptionsHtml}
            </select>
          </div>
        </div>

        <details class="race-grid-toggle">
          <summary class="race-grid-summary">📋 出走メンバー（全16頭）を確認する</summary>
          <div style="padding: 4px 6px; font-size: 10px; color: #666;">※馬番（枠順）は「レースへ進む！」押下時にランダム決定されます。</div>
          <table class="race-grid-table">
            <thead>
              <tr>
                <th>馬番</th>
                <th>馬名</th>
                <th>性</th>
                <th>Pt</th>
                <th>脚質</th>
              </tr>
            </thead>
            <tbody>
              ${gridRowsHtml}
            </tbody>
          </table>
        </details>
      `;

      container.appendChild(card);
    });
  }

  window.onStrategyChanged = function(rIdx) {
    if (!playerEntries[rIdx]) return;
    const stratVal = document.getElementById(`selectStrat${rIdx}`).value;
    const levelVal = parseInt(document.getElementById(`selectLevel${rIdx}`).value, 10);

    playerEntries[rIdx].strategy = stratVal;
    playerEntries[rIdx].strategy_level = levelVal;
    playerEntries[rIdx].isCustomized = true;

    updateTotalStatus();
  };

  function updateTotalStatus() {
    let totalLvl = 0;
    
    for (let rIdx = 0; rIdx < 5; rIdx++) {
      const selectLvl = document.getElementById(`selectLevel${rIdx}`);
      if (selectLvl) {
        totalLvl += parseInt(selectLvl.value, 10) || 3;
      } else if (playerEntries[rIdx]) {
        totalLvl += parseInt(playerEntries[rIdx].strategy_level || 3, 10);
      }
    }

    const lvlEl = document.getElementById('totalLevelDisplay');
    const limitEl = document.getElementById('limitStatus');
    const goBtn = document.getElementById('btnGoRace');

    lvlEl.textContent = `${totalLvl} / ${MAX_TOTAL_LEVEL}`;

    if (totalLvl > MAX_TOTAL_LEVEL) {
      lvlEl.className = 'status-val error';
      limitEl.textContent = '合計オーバー';
      limitEl.className = 'status-val error';
      goBtn.disabled = true;
    } else {
      lvlEl.className = 'status-val ok';
      limitEl.textContent = 'OK';
      limitEl.className = 'status-val ok';
      goBtn.disabled = false;
    }
  }

  // 1〜16番の馬番（枠順）を重複なくランダム抽出する関数
  function generateRandomGates(mobCount = 14) {
    const numbers = Array.from({ length: 16 }, (_, i) => i + 1);
    for (let i = numbers.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
    }
    return {
      playerGate: numbers[0],
      cpuGate: numbers[1],
      mobGates: numbers.slice(2, 2 + mobCount)
    };
  }

  window.finalizeAndStartRace = async function() {
    if (!currentUser) return;

    const btn = document.getElementById('btnGoRace');
    btn.disabled = true;
    btn.textContent = "枠順抽選・データ送信中...";

    try {
      const currentStatus = globalUserData.cpu_battle_status || {};
      const currentMatch = currentStatus.current_match || {};

      const finalPlayerEntries = [];
      const finalCpuEntries = [...cpuEntries];
      const racesMobGates = {};
      const fullRaceGrids = {}; // ★ Firestore制約回避のため、2次元配列ではなくオブジェクト化

      // 各レース（全5戦）ごとに馬番を抽選・付与し、枠順順にソートして保存
      for (let rIdx = 0; rIdx < playerEntries.length; rIdx++) {
        const pEntry = playerEntries[rIdx] || {};
        const mobIds = racesMobIds[rIdx] || racesMobIds[String(rIdx)] || [];
        const gates = generateRandomGates(mobIds.length);

        // 自馬の入力作戦を取得
        const stratSelect = document.getElementById(`selectStrat${rIdx}`);
        const levelSelect = document.getElementById(`selectLevel${rIdx}`);
        const finalStrat = stratSelect ? stratSelect.value : (pEntry.strategy || "先行");
        const finalLevel = levelSelect ? parseInt(levelSelect.value, 10) : (pEntry.strategy_level || 3);

        // 自馬データ作成
        const updatedPlayerEntry = {
          ...pEntry,
          strategy: finalStrat,
          strategy_level: finalLevel,
          gate_number: gates.playerGate
        };
        finalPlayerEntries.push(updatedPlayerEntry);

        // CPU馬データ作成
        let updatedCpuEntry = null;
        if (finalCpuEntries[rIdx]) {
          updatedCpuEntry = {
            ...finalCpuEntries[rIdx],
            gate_number: gates.cpuGate
          };
          finalCpuEntries[rIdx] = updatedCpuEntry;
        }

        // モブ馬の馬番配列を保存
        racesMobGates[rIdx] = gates.mobGates;
        racesMobGates[String(rIdx)] = gates.mobGates;

        // 16頭の全馬データを1つの配列にまとめ、馬番順（1〜16）にソートする
        const raceGrid = [];

        // 1. 自馬
        raceGrid.push({
          ...updatedPlayerEntry,
          isPlayer: true,
          type: 'player'
        });

        // 2. CPU馬
        if (updatedCpuEntry) {
          raceGrid.push({
            ...updatedCpuEntry,
            isCpu: true,
            type: 'cpu'
          });
        }

         // 3. モブ馬
        mobIds.forEach((mId, mIdx) => {
          raceGrid.push({
            horse_id: mId,
            gate_number: gates.mobGates[mIdx],
            type: 'mob'
          });
        });

        // 馬番（gate_number）の昇順（1番枠〜16番枠）にソート
        raceGrid.sort((a, b) => (a.gate_number || 0) - (b.gate_number || 0));

        // インデックスをキーとして保存（2次元配列を回避）
        fullRaceGrids[rIdx] = raceGrid;
        fullRaceGrids[String(rIdx)] = raceGrid;
      }

      const updatedStatus = {
        ...currentStatus,
        current_match: {
          ...currentMatch,
          player_entries: finalPlayerEntries,
          cpu_entries: finalCpuEntries,
          races_mob_gates: racesMobGates,
          full_race_grids: fullRaceGrids
        }
      };

      const cleanUpdatedStatus = JSON.parse(JSON.stringify(updatedStatus));

      await setDoc(doc(db, "users", currentUser.uid), {
        cpu_battle_status: cleanUpdatedStatus
      }, { merge: true });

      globalUserData.cpu_battle_status = cleanUpdatedStatus;
      window.location.href = 'race_result.html';
    } catch (err) {
      console.error("作戦・枠順保存エラー:", err);
      alert(`データの保存に失敗しました。もう一度お試しください。\n【詳細】${err.message}`);
      btn.disabled = false;
      btn.textContent = "レースへ進む！";
    }
  };
</script>
