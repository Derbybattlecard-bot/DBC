<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦指示</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
    --danger-color: #d9534f;
    --player-bg: #e3f2fd;
    --cpu-bg: #ffebee;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 650px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  .status-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .status-item { text-align: center; }
  .status-label { font-size: 10px; color: var(--text-sub); display: block; margin-bottom: 2px; }
  .status-val { font-size: 14px; font-weight: bold; }
  .status-val.error { color: var(--danger-color); }
  .status-val.ok { color: var(--accent-color); }

  .race-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .race-info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .race-title { font-weight: bold; font-size: 13px; color: var(--accent-color); }
  .race-cond-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }

  .my-horse-box {
    background: #f0f7f1;
    border: 1px solid #c8e6c9;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .my-horse-title { font-weight: bold; color: var(--accent-color); font-size: 12px; margin-bottom: 4px; }
  .my-horse-detail { font-size: 11px; color: var(--text-sub); margin-bottom: 8px; }

  .strategy-select-group {
    display: flex;
    gap: 8px;
  }
  .select-strat {
    flex: 2;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: bold;
  }
  .select-level {
    flex: 1;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 12px;
    font-weight: bold;
  }

  /* 出走表（アコーディオン） */
  details.race-grid-toggle {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-size: 11px;
  }
  summary.race-grid-summary {
    padding: 6px 10px;
    font-weight: bold;
    color: var(--accent-color);
    cursor: pointer;
    user-select: none;
    background: #f9f9f9;
    border-radius: 6px;
  }
  .race-grid-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 4px;
  }
  .race-grid-table th, .race-grid-table td {
    border: 1px solid #e0e0e0;
    padding: 4px 6px;
    text-align: center;
    font-size: 10px;
  }
  .race-grid-table th { background: #eee; }
  .row-player { background-color: var(--player-bg); font-weight: bold; }
  .row-cpu { background-color: var(--cpu-bg); font-weight: bold; }

  .btn-submit {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--accent-hover);
    margin-top: 10px;
  }
  .btn-submit:disabled { background: #a0a0a0; box-shadow: 0 4px 0 #7a7a7a; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 出走登録へ</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">作戦指示</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">作戦設定状況</span>
      <span class="status-val" id="stratConfigCount">5 / 5</span>
    </div>
    <div class="status-item">
      <span class="status-label">合計作戦レベル</span>
      <span class="status-val" id="totalLevelDisplay">0 / 18</span>
    </div>
    <div class="status-item">
      <span class="status-label">制限判定</span>
      <span class="status-val" id="limitStatus">確認中</span>
    </div>
  </div>

  <div id="raceCardList" style="display:flex; flex-direction:column; gap:12px;"></div>

  <button class="btn-submit" id="btnGoRace" disabled onclick="finalizeAndStartRace()">レースへ進む！</button>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};
  let HORSES_ARRAY = [];
  let STRATEGY_MASTER = [];

  let currentSeries = null;
  let playerEntries = [];
  let generatedCpuEntries = [];
  let generatedRaceMobs = [];

  const MAX_TOTAL_LEVEL = 18;

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) globalUserData = userDoc.data();

      // マスターデータを並行取得（作戦データがエラーでも止まらないように分離）
      const [seriesData, horsesData] = await Promise.all([
        fetchJsonSafe('series_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      SERIES_MASTER = seriesData || [];
      
      // IDの型（数値/文字列）の違いによる参照エラーを完璧に防ぐ処理
      if (Array.isArray(horsesData)) {
        HORSES_ARRAY = horsesData;
        horsesData.forEach(h => { 
          const idStr = String(h.horse_id);
          HORSES_MASTER[idStr] = h;
          // 4桁パディング版も予備として登録
          const paddedId = idStr.padStart(4, '0');
          if (idStr !== paddedId) HORSES_MASTER[paddedId] = h;
        });
      }

      // 作戦マスターの堅牢なロード（存在しない場合はデフォルト値）
      try {
        const stratData = await fetchJsonSafe('strategy_master.json');
        STRATEGY_MASTER = Array.isArray(stratData) && stratData.length > 0 ? stratData : getDefaultStrategies();
      } catch (err) {
        console.warn("作戦データの読み込みに失敗したため、デフォルト値を使用します。");
        STRATEGY_MASTER = getDefaultStrategies();
      }

      try {
        initStrategyPage();
        document.getElementById('syncStatus').textContent = "✅ 準備完了";
      } catch (err) {
        console.error("画面初期化エラー:", err);
        document.getElementById('syncStatus').textContent = "❌ 画面生成エラー";
        document.getElementById('limitStatus').textContent = "エラー発生";
      }

    } catch (e) {
      console.error("データ通信エラー:", e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  // フォールバック用作戦データ
  function getDefaultStrategies() {
    return [
      { name: "逃げ", category: "逃げ" }, { name: "大逃げ", category: "逃げ" },
      { name: "先行", category: "先行" }, { name: "好位", category: "先行" },
      { name: "差し", category: "差し" }, { name: "待機", category: "差し" },
      { name: "追込", category: "追込" }, { name: "最後方", category: "追込" }
    ];
  }

  // ヘルパー関数群（undefined を防ぐ）
  function getHorsePt(horse, surface) {
    if (!horse) return 0;
    if (surface === '芝') {
      if (horse.turf_potential !== undefined) return horse.turf_potential;
      if (horse.aptitude && horse.aptitude.turf_potential !== undefined) return horse.aptitude.turf_potential;
    } else if (surface === 'ダート' || surface === 'ダ') {
      if (horse.dirt_potential !== undefined) return horse.dirt_potential;
      if (horse.aptitude && horse.aptitude.dirt_potential !== undefined) return horse.aptitude.dirt_potential;
    }
    return parseInt(horse.potential || horse.pt || 0, 10) || 0;
  }

  function getHorseStyle(horse) {
    if (!horse) return '先行';
    return horse.running_style || horse.leg_style || horse.style || horse.strategy || '先行';
  }

  function initStrategyPage() {
    const status = globalUserData?.cpu_battle_status || {};
    const currentMatch = status.current_match || {};

    if (!currentMatch.player_entries || currentMatch.player_entries.length === 0) {
      alert("出走登録データが見つかりません。");
      window.location.href = 'matchup.html';
      return;
    }

    const currentRound = status.current_round || 1;
    const seriesId = status.selected_series_id || (status.series_lineup ? status.series_lineup[currentRound - 1] : null);
    currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0] || {};

    playerEntries = currentMatch.player_entries || [];

    setupCpuAndMobData(currentMatch);
    renderRaceCards();
    updateTotalStatus();
  }

  function setupCpuAndMobData(currentMatch) {
    const limits = currentSeries?.potential_limit || { max_total_potential: 95 };
    const targetPtBase = Math.floor((limits.max_total_potential || 95) / 5);
    const minPt = Math.max(0, targetPtBase - 2);
    const maxPt = targetPtBase + 2;
    const seriesSex = currentSeries?.sex || "制限なし";

    // null 参照を回避
    const races = (currentSeries?.rounds && currentSeries.rounds[0]?.races) || [{},{},{},{},{}];

    generatedCpuEntries = [];
    generatedRaceMobs = [];

    races.forEach((race, rIdx) => {
      // 1. CPU対戦馬
      let cpuEntry = currentMatch.cpu_entries ? currentMatch.cpu_entries[rIdx] : null;
      if (!cpuEntry || !cpuEntry.horse_id) {
        const eligibleCpu = HORSES_ARRAY.filter(h => {
          const pt = getHorsePt(h, race.surface);
          const pId = playerEntries[rIdx]?.horse_id;
          return String(pId) !== String(h.horse_id) && pt >= minPt && pt <= maxPt;
        });
        const fallbackHorse = HORSES_ARRAY[rIdx % HORSES_ARRAY.length] || { horse_id: "0000", sex: "牡" };
        const chosenCpu = eligibleCpu.length > 0 ? eligibleCpu[Math.floor(Math.random() * eligibleCpu.length)] : fallbackHorse;
        
        const randomStrat = STRATEGY_MASTER[Math.floor(Math.random() * STRATEGY_MASTER.length)]?.name || "先行";
        const randomLvl = Math.floor(Math.random() * 3) + 2;
        
        cpuEntry = {
          horse_id: String(chosenCpu.horse_id),
          strategy: randomStrat,
          strategy_level: randomLvl
        };
      }
      generatedCpuEntries.push(cpuEntry);

      // 2. モブ馬14頭
      let mobs = currentMatch.races_mob_ids ? currentMatch.races_mob_ids[rIdx] : null;
      if (!mobs || mobs.length < 14) {
        const usedIds = new Set([String(playerEntries[rIdx]?.horse_id), String(cpuEntry.horse_id)]);
        
        let pool = HORSES_ARRAY.filter(h => {
          if (usedIds.has(String(h.horse_id))) return false;
          const pt = getHorsePt(h, race.surface);
          const sexOk = seriesSex === "制限なし" || (seriesSex === "牝馬限定" && h.sex === "牝");
          return pt >= minPt && pt <= maxPt && sexOk;
        });

        if (pool.length < 14) {
          const fallbackPool = HORSES_ARRAY.filter(h => !usedIds.has(String(h.horse_id)));
          pool = pool.concat(fallbackPool);
        }

        pool.sort(() => Math.random() - 0.5);
        const selectedMobs = pool.slice(0, 14).map(h => String(h.horse_id).padStart(4, '0'));
        
        // 保険: もし14頭に満たない場合はダミーIDで埋める
        while(selectedMobs.length < 14) selectedMobs.push("0000");

        generatedRaceMobs.push(selectedMobs);
      } else {
        generatedRaceMobs.push(mobs);
      }
    });
  }

  function renderRaceCards() {
    const races = (currentSeries?.rounds && currentSeries.rounds[0]?.races) || [{},{},{},{},{}];
    const container = document.getElementById('raceCardList');
    container.innerHTML = '';

    races.forEach((race, rIdx) => {
      const pEntry = playerEntries[rIdx] || {};
      const pHorse = HORSES_MASTER[String(pEntry.horse_id)] || {};
      const pPt = getHorsePt(pHorse, race.surface);
      const pStyle = getHorseStyle(pHorse);

      const cpuEntry = generatedCpuEntries[rIdx] || {};
      const cpuHorse = HORSES_MASTER[String(cpuEntry.horse_id)] || {};
      const cpuPt = getHorsePt(cpuHorse, race.surface);

      const mobIds = generatedRaceMobs[rIdx] || [];

      const card = document.createElement('div');
      card.className = 'race-card';

      const surfaceClass = race.surface === '芝' ? 'surface-turf' : 'surface-dirt';

      // 堅牢な作戦プルダウン生成
      let stratOptionsHtml = '';
      const categories = ['逃げ', '先行', '差し', '追込'];
      categories.forEach((cat, idx) => {
        stratOptionsHtml += `<optgroup label="【${cat}系】">`;
        
        let categoryStrats = STRATEGY_MASTER.filter(s => {
          if (!s) return false;
          return (s.category && s.category.includes(cat)) || 
                 (s.type && s.type.includes(cat)) || 
                 (s.name && s.name.includes(cat)) ||
                 (s.strategy_name && s.strategy_name.includes(cat)) ||
                 (s.leg_style && s.leg_style.includes(cat));
        });
        
        // 振り分け不能な場合、強制的にリストを4分割して表示
        if (categoryStrats.length === 0 && STRATEGY_MASTER.length > 0) {
          const chunk = Math.ceil(STRATEGY_MASTER.length / 4);
          categoryStrats = STRATEGY_MASTER.slice(idx * chunk, (idx + 1) * chunk);
        }
        if (categoryStrats.length === 0) categoryStrats = [{ name: cat }];
        
        categoryStrats.forEach(s => {
          const sName = s.name || s.strategy_name || s.strategy || s.type_name || cat;
          const pStyleStr = typeof pStyle === 'string' ? pStyle : "";
          const isSelected = pEntry.strategy === sName || (!pEntry.strategy && typeof sName === 'string' && sName.includes(pStyleStr));
          stratOptionsHtml += `<option value="${sName}" ${isSelected ? 'selected' : ''}>${sName}</option>`;
        });
        stratOptionsHtml += `</optgroup>`;
      });

      let levelOptionsHtml = '';
      const currentLevel = pEntry.strategy_level || 3;
      for (let lvl = 1; lvl <= 5; lvl++) {
        levelOptionsHtml += `<option value="${lvl}" ${lvl === currentLevel ? 'selected' : ''}>Lv.${lvl}</option>`;
      }

      let gridRowsHtml = `
        <tr class="row-player">
          <td>自馬</td>
          <td style="text-align:left;">${pHorse.name || '未設定'}</td>
          <td>${pHorse.sex || '牡'}</td>
          <td>${pPt}</td>
          <td>${pStyle}</td>
        </tr>
        <tr class="row-cpu">
          <td>ライバル</td>
          <td style="text-align:left;">${cpuHorse.name || 'CPU'}</td>
          <td>${cpuHorse.sex || '牡'}</td>
          <td>${cpuPt}</td>
          <td>${getHorseStyle(cpuHorse)}</td>
        </tr>
      `;

      mobIds.forEach((mId, mIdx) => {
        const mHorse = HORSES_MASTER[String(mId)] || {};
        gridRowsHtml += `
          <tr>
            <td>${mIdx + 3}</td>
            <td style="text-align:left;">${mHorse.name || 'モブ馬'}</td>
            <td>${mHorse.sex || '牡'}</td>
            <td>${getHorsePt(mHorse, race.surface)}</td>
            <td>${getHorseStyle(mHorse)}</td>
          </tr>
        `;
      });

      card.innerHTML = `
        <div class="race-info-header">
          <span class="race-title">第${race.race_num || rIdx+1}戦: ${race.race_name || 'レース'}</span>
          <span class="race-cond-badge ${surfaceClass}">${race.surface || '芝'} ${race.track || ''} ${race.distance || '2000'}m</span>
        </div>
        
        <div class="my-horse-box">
          <div class="my-horse-title">出走馬: ${pHorse.name || '未設定'} (Pt:${pPt} / 得意:${pStyle})</div>
          <div class="strategy-select-group">
            <select class="select-strat" id="selectStrat${rIdx}" onchange="onStrategyChanged(${rIdx})">
              ${stratOptionsHtml}
            </select>
            <select class="select-level" id="selectLevel${rIdx}" onchange="onStrategyChanged(${rIdx})">
              ${levelOptionsHtml}
            </select>
          </div>
        </div>

        <details class="race-grid-toggle">
          <summary class="race-grid-summary">📋 出走表（全16頭）を確認する</summary>
          <table class="race-grid-table">
            <thead>
              <tr>
                <th>枠</th>
                <th>馬名</th>
                <th>性</th>
                <th>Pt</th>
                <th>脚質</th>
              </tr>
            </thead>
            <tbody>
              ${gridRowsHtml}
            </tbody>
          </table>
        </details>
      `;

      container.appendChild(card);
    });
  }

  window.onStrategyChanged = function(rIdx) {
    if (!playerEntries[rIdx]) return;
    const stratVal = document.getElementById(`selectStrat${rIdx}`).value;
    const levelVal = parseInt(document.getElementById(`selectLevel${rIdx}`).value, 10);

    playerEntries[rIdx].strategy = stratVal;
    playerEntries[rIdx].strategy_level = levelVal;

    updateTotalStatus();
  };

  function updateTotalStatus() {
    let totalLvl = 0;
    playerEntries.forEach(e => {
      totalLvl += parseInt(e.strategy_level || 3, 10);
    });

    const lvlEl = document.getElementById('totalLevelDisplay');
    const limitEl = document.getElementById('limitStatus');
    const goBtn = document.getElementById('btnGoRace');

    lvlEl.textContent = `${totalLvl} / ${MAX_TOTAL_LEVEL}`;

    if (totalLvl > MAX_TOTAL_LEVEL) {
      lvlEl.className = 'status-val error';
      limitEl.textContent = '合計オーバー';
      limitEl.className = 'status-val error';
      goBtn.disabled = true;
    } else {
      lvlEl.className = 'status-val ok';
      limitEl.textContent = 'OK';
      limitEl.className = 'status-val ok';
      goBtn.disabled = false;
    }
  }

  window.finalizeAndStartRace = async function() {
    if (!currentUser) return;

    const btn = document.getElementById('btnGoRace');
    btn.disabled = true;
    btn.textContent = "作戦データを送信中...";

    try {
      await updateDoc(doc(db, "users", currentUser.uid), {
        "cpu_battle_status.current_match.player_entries": playerEntries,
        "cpu_battle_status.current_match.cpu_entries": generatedCpuEntries,
        "cpu_battle_status.current_match.races_mob_ids": generatedRaceMobs
      });

      window.location.href = 'race_result.html';
    } catch (err) {
      console.error("作戦保存エラー:", err);
      alert("データの保存に失敗しました。もう一度お試しください。");
      btn.disabled = false;
      btn.textContent = "レースへ進む！";
    }
  };
</script>

</body>
</html>
