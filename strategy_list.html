<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦名鑑＆初期設定</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --bar-bg: #e0e0e0;
    --bar-fill: #4CAF50;
    --highlight-color: #ff9800;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 650px; }

  /* ヘッダー */
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  /* メインタブ切替 */
  .view-tabs {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  /* フィルタータブ */
  .filter-group {
    display: flex;
    gap: 4px;
    background: var(--panel-bg);
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
  }
  .filter-btn {
    flex: 1;
    padding: 4px 0;
    border: none;
    background: transparent;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
  }
  .filter-btn.active {
    background: #e3f2fd;
    color: #1976d2;
  }

  /* 作戦名鑑カード */
  .strategy-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .strat-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .strat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .strat-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--accent-color);
  }
  .strat-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    background: #e8f5e9;
    color: var(--accent-color);
    font-weight: bold;
  }

  /* パラメータバー */
  .param-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 12px;
  }
  .param-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
  }
  .param-label { width: 42px; color: var(--text-sub); font-weight: bold; }
  .param-bar-bg {
    flex: 1;
    height: 8px;
    background: var(--bar-bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .param-bar-fill {
    height: 100%;
    background: var(--bar-fill);
    border-radius: 4px;
  }
  .param-val { width: 16px; text-align: right; font-weight: bold; }

  /* マイホース設定テーブル */
  .horse-setting-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
  }
  .horse-list-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  .horse-list-table th, .horse-list-table td {
    border-bottom: 1px solid #e0e0e0;
    padding: 8px 4px;
    text-align: left;
    font-size: 12px;
  }
  .horse-list-table th { color: var(--text-sub); }

  .select-strat-def {
    width: 100%;
    padding: 5px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    font-weight: bold;
    font-size: 11px;
  }

  .btn-submit {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    margin-top: 10px;
    box-shadow: 0 3px 0 var(--accent-hover);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="matchup.html" class="btn-back">← 戻る</a>
    <h2 style="margin:0; font-size: 15px; color: var(--accent-color);">作戦名鑑 ＆ 初期設定</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <!-- タブ切替 -->
  <div class="view-tabs">
    <div class="tab-btn active" onclick="switchMainTab('catalog')">作戦名鑑 (パラメータ)</div>
    <div class="tab-btn" onclick="switchMainTab('setting')">マイホース初期設定</div>
  </div>

  <!-- タブ1: 作戦名鑑 -->
  <div id="tabCatalog" style="display: flex; flex-direction: column; gap: 10px;">
    <div class="filter-group">
      <button class="filter-btn active" onclick="filterStyle('ALL')">すべて</button>
      <button class="filter-btn" onclick="filterStyle('逃げ')">逃げ</button>
      <button class="filter-btn" onclick="filterStyle('先行')">先行</button>
      <button class="filter-btn" onclick="filterStyle('差し')">差し</button>
      <button class="filter-btn" onclick="filterStyle('追込')">追込</button>
    </div>

    <div id="strategyGrid" class="strategy-grid"></div>
  </div>

  <!-- タブ2: 初期作戦設定 -->
  <div id="tabSetting" style="display: none; flex-direction: column; gap: 10px;">
    <div class="horse-setting-card">
      <div style="font-weight: bold; color: var(--accent-color); margin-bottom: 4px;">所持馬の初期作戦設定</div>
      <div style="font-size: 11px; color: var(--text-sub);">※ここで設定した作戦は、レース前の作戦指示画面で初期選択されます。</div>

      <table class="horse-list-table">
        <thead>
          <tr>
            <th style="width: 35%;">馬名</th>
            <th style="width: 20%;">脚質</th>
            <th style="width: 45%;">デフォルト作戦</th>
          </tr>
        </thead>
        <tbody id="horseSettingBody"></tbody>
      </table>

      <button class="btn-submit" style="width:100%;" onclick="saveDefaultStrategies()">初期作戦設定を保存する</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let STRATEGY_MASTER = [];
  let HORSES_MASTER = {};
  let userMyHorses = [];
  let currentFilter = 'ALL';

  const PARAM_LABELS = {
    speed: "スピード",
    stamina: "スタミナ",
    sharp: "キレ",
    jizoku: "持続力",
    guts: "根性"
  };

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        globalUserData = userDoc.data();
        userMyHorses = globalUserData.my_horses || [];
      }

      const [stratData, horsesData] = await Promise.all([
        fetchJsonSafe('strategy_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      STRATEGY_MASTER = stratData || [];
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => { HORSES_MASTER[String(h.horse_id)] = h; });
      }

      renderStrategyGrid();
      renderHorseSettings();
      document.getElementById('syncStatus').textContent = "✅ 準備完了";

    } catch (e) {
      console.error("データ読み込みエラー:", e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  // タブ切り替え処理
  window.switchMainTab = function(tabName) {
    const catalogEl = document.getElementById('tabCatalog');
    const settingEl = document.getElementById('tabSetting');
    const tabs = document.querySelectorAll('.tab-btn');

    if (tabName === 'catalog') {
      catalogEl.style.display = 'flex';
      settingEl.style.display = 'none';
      tabs[0].classList.add('active');
      tabs[1].classList.remove('active');
    } else {
      catalogEl.style.display = 'none';
      settingEl.style.display = 'flex';
      tabs[0].classList.remove('active');
      tabs[1].classList.add('active');
    }
  };

  // 脚質フィルター処理
  window.filterStyle = function(style) {
    currentFilter = style;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === style || (style === 'ALL' && btn.textContent === 'すべて'));
    });
    renderStrategyGrid();
  };

  // 作戦名鑑（グリッド）描画
  function renderStrategyGrid() {
    const container = document.getElementById('strategyGrid');
    container.innerHTML = '';

    const list = STRATEGY_MASTER.filter(s => currentFilter === 'ALL' || s.style === currentFilter);

    list.forEach(strat => {
      const card = document.createElement('div');
      card.className = 'strat-card';

      // 一番高い属性を取得
      const params = ['speed', 'stamina', 'sharp', 'jizoku', 'guts'];
      let maxParam = 'speed';
      params.forEach(p => { if (strat[p] > strat[maxParam]) maxParam = p; });

      let paramBarsHtml = '';
      params.forEach(p => {
        const val = strat[p] || 0;
        const rate = Math.min(100, Math.max(0, (val / 20) * 100)); // 20満点換算
        const isMax = p === maxParam;
        const barColor = isMax ? 'var(--highlight-color)' : 'var(--bar-fill)';

        paramBarsHtml += `
          <div class="param-row">
            <span class="param-label">${PARAM_LABELS[p]}</span>
            <div class="param-bar-bg">
              <div class="param-bar-fill" style="width: ${rate}%; background: ${barColor};"></div>
            </div>
            <span class="param-val" ${isMax ? 'style="color:var(--highlight-color);"' : ''}>${val}</span>
          </div>
        `;
      });

      card.innerHTML = `
        <div class="strat-header">
          <div>
            <span class="strat-title">${strat.name}</span>
            <span style="font-size: 10px; color: #888; margin-left: 4px;">(${strat.strategy_id})</span>
          </div>
          <span class="strat-badge">${strat.style} / 得意:${PARAM_LABELS[maxParam]}</span>
        </div>
        <div class="param-grid">
          ${paramBarsHtml}
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 馬ごとの初期作戦設定画面描画
  function renderHorseSettings() {
    const tbody = document.getElementById('horseSettingBody');
    tbody.innerHTML = '';

    if (userMyHorses.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">所持馬データがありません</td></tr>';
      return;
    }

    userMyHorses.forEach((mHorse, idx) => {
      const master = HORSES_MASTER[String(mHorse.horse_id)] || {};
      const horseName = mHorse.custom_name || master.name || `馬ID:${mHorse.horse_id}`;
      const style = master.style || master.running_style || '先行';

      let selectOptionsHtml = '';
      STRATEGY_MASTER.forEach(s => {
        const selected = mHorse.default_strategy_id === s.strategy_id ? 'selected' : '';
        selectOptionsHtml += `<option value="${s.strategy_id}" ${selected}>[${s.style}] ${s.name}</option>`;
      });

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:bold;">${horseName}</td>
        <td>${style}</td>
        <td>
          <select class="select-strat-def" id="defStratSelect_${idx}">
            <option value="">(未設定 - 自動判定)</option>
            ${selectOptionsHtml}
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 設定の保存処理
  window.saveDefaultStrategies = async function() {
    if (!currentUser || !globalUserData) return;

    const updatedMyHorses = [...userMyHorses];
    updatedMyHorses.forEach((mHorse, idx) => {
      const select = document.getElementById(`defStratSelect_${idx}`);
      if (select) {
        mHorse.default_strategy_id = select.value || null;
      }
    });

    try {
      await setDoc(doc(db, "users", currentUser.uid), {
        my_horses: updatedMyHorses
      }, { merge: true });

      globalUserData.my_horses = updatedMyHorses;
      userMyHorses = updatedMyHorses;
      alert("初期作戦設定を保存しました！");
    } catch (e) {
      console.error("保存失敗:", e);
      alert("保存に失敗しました。");
    }
  };
</script>

</body>
</html>
