<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 作戦名鑑＆初期設定</title>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 780px; }

  /* ヘッダー */
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  /* メインタブ切替 */
  .view-tabs {
    display: flex;
    gap: 6px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  /* デックサブタブ切替 */
  .deck-subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .deck-tab-btn {
    padding: 5px 14px;
    background: #e2efe3;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 12px;
  }
  .deck-tab-btn.active {
    background: var(--accent-color);
    color: white;
    border-color: var(--accent-color);
  }

  /* フィルタータブ */
  .filter-group {
    display: flex;
    gap: 4px;
    background: var(--panel-bg);
    padding: 6px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
  }
  .filter-btn {
    flex: 1;
    padding: 4px 0;
    border: none;
    background: transparent;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    color: var(--text-sub);
    cursor: pointer;
  }
  .filter-btn.active {
    background: #e3f2fd;
    color: #1976d2;
  }

  /* 作戦名鑑カード */
  .strategy-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .strat-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .strat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .strat-title {
    font-size: 14px;
    font-weight: bold;
    color: var(--accent-color);
  }
  .strat-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: bold;
  }

  /* チャート＆寸評レイアウト */
  .card-body {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .chart-container {
    width: 135px;
    height: 135px;
    flex-shrink: 0;
  }
  .comment-box {
    flex: 1;
    font-size: 11.5px;
    color: #2b3a2d;
    background: rgba(244, 249, 245, 0.8);
    border-left: 3px solid var(--accent-color);
    padding: 8px 10px;
    border-radius: 0 6px 6px 0;
    line-height: 1.5;
  }

  /* デック出走表スタイル */
  .horse-setting-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
  }
  .horse-list-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
  }
  .horse-list-table th, .horse-list-table td {
    border-bottom: 1px solid #e0e0e0;
    padding: 6px 4px;
    text-align: left;
    font-size: 11.5px;
    vertical-align: middle;
  }
  .horse-list-table th { color: var(--text-sub); background: #f2f8f3; }

  .gate-num {
    display: inline-block;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    background: var(--accent-color);
    color: white;
    border-radius: 50%;
    font-weight: bold;
    font-size: 11px;
  }

  .select-strat-def {
    width: 100%;
    padding: 4px;
    border-radius: 4px;
    border: 1px solid var(--border-color);
    font-weight: bold;
    font-size: 11px;
    background: #ffffff;
  }

  .btn-submit {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    margin-top: 12px;
    box-shadow: 0 3px 0 var(--accent-hover);
  }
  .btn-submit:hover {
    background: var(--accent-hover);
  }
  .empty-slot {
    color: #999;
    font-style: italic;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="index.html" class="btn-back">← 戻る</a>
    <h2 style="margin:0; font-size: 15px; color: var(--accent-color);">作戦名鑑 ＆ 初期作戦設定</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <!-- タブ切替 -->
  <div class="view-tabs">
    <div class="tab-btn active" onclick="switchMainTab('catalog')">作戦名鑑 (パラメータ)</div>
    <div class="tab-btn" onclick="switchMainTab('setting')">デック別 初期作戦設定</div>
  </div>

  <!-- タブ1: 作戦名鑑 -->
  <div id="tabCatalog" style="display: flex; flex-direction: column; gap: 10px;">
    <div class="filter-group">
      <button class="filter-btn active" onclick="filterStyle('ALL')">すべて</button>
      <button class="filter-btn" onclick="filterStyle('逃げ')">逃げ</button>
      <button class="filter-btn" onclick="filterStyle('先行')">先行</button>
      <button class="filter-btn" onclick="filterStyle('差し')">差し</button>
      <button class="filter-btn" onclick="filterStyle('追込')">追込</button>
    </div>

    <div id="strategyGrid" class="strategy-grid"></div>
  </div>

  <!-- タブ2: 初期作戦設定 -->
  <div id="tabSetting" style="display: none; flex-direction: column; gap: 10px;">
    <div class="horse-setting-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <div>
          <div style="font-weight: bold; color: var(--accent-color); font-size: 13px;">デック内18頭の初期作戦割り当て</div>
          <div style="font-size: 11px; color: var(--text-sub);">出走表の各枠番（1〜18）に対応する初期作戦を設定します。</div>
        </div>
      </div>

      <!-- デック切替サブタブ -->
      <div class="deck-subtabs">
        <button class="deck-tab-btn active" id="deckTab0" onclick="switchDeckTab(0)">MAIN 1</button>
        <button class="deck-tab-btn" id="deckTab1" onclick="switchDeckTab(1)">MAIN 2</button>
      </div>

      <table class="horse-list-table">
        <thead>
          <tr>
            <th style="width: 8%; text-align: center;">枠</th>
            <th style="width: 28%;">馬名</th>
            <th style="width: 12%;">脚質</th>
            <th style="width: 22%;">適性 / 距離 / PT</th>
            <th style="width: 30%;">初期作戦</th>
          </tr>
        </thead>
        <tbody id="deckSettingBody"></tbody>
      </table>

      <button class="btn-submit" style="width:100%;" onclick="saveDefaultStrategies()">初期作戦設定を保存する</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let STRATEGY_MASTER = [];
  let HORSES_MASTER = {};
  let currentFilter = 'ALL';
  let activeDeckIdx = 0;
  let chartInstances = [];

  // 脚質別のカラーテーマ
  const STYLE_COLORS = {
    '逃げ': { fill: 'rgba(239, 83, 80, 0.35)', border: '#e53935', point: '#c62828', bg: '#ffebee', badgeText: '#c62828' },
    '先行': { fill: 'rgba(255, 167, 38, 0.35)', border: '#fb8c00', point: '#ef6c00', bg: '#fff3e0', badgeText: '#ef6c00' },
    '差し': { fill: 'rgba(102, 187, 106, 0.35)', border: '#43a047', point: '#2e7d32', bg: '#e8f5e9', badgeText: '#2e7d32' },
    '追込': { fill: 'rgba(171, 71, 188, 0.35)', border: '#ab47bc', point: '#7b1fa2', bg: '#f3e5f5', badgeText: '#7b1fa2' },
    'default': { fill: 'rgba(45, 106, 55, 0.35)', border: '#2d6a37', point: '#1b4d23', bg: '#e8f5e9', badgeText: '#2d6a37' }
  };

  // 全16作戦の寸評 ＆ 得意な展開
  const STRATEGY_DETAILS = {
    'NIGE_01': {
      comment: 'スピードと高い持続力を備え、後続の競りかけを根性で跳ね返して逃げ粘る真っ向勝負型。',
      best: 'スローペース、単騎逃げ、前残り展開'
    },
    'NIGE_02': {
      comment: 'スタミナと高い瞬発力を誇り、道中でしっかり息を入れて溜め逃げし、直線で一気に突き放す型。',
      best: 'スローペース、マイペース落とし、後続牽制展開'
    },
    'NIGE_03': {
      comment: '全能力のバランスが取れた万能型。展開の変化に左右されず安定したペースで逃げを刻める。',
      best: 'ミドルペース、平均ペース、ペース乱れのない展開'
    },
    'NIGE_04': {
      comment: 'スピードと持続力が圧倒的。後続の脚を削り取って追いすがる隙を与えない超高ラップの大逃げ仕様。',
      best: 'ハイペース、縦長展開、後続の消耗戦'
    },
    'SENKO_01': {
      comment: 'スタミナと根性で耐え抜くタフな粘り腰。前傾ラップや消耗戦になっても粘り強さを発揮する。',
      best: 'ミドル〜ハイペース、タフな消耗戦、粘り合い'
    },
    'SENKO_02': {
      comment: '持続力とスタミナを生かし、3〜4コーナーで早めに先頭へ躍り出てそのまま押し切る型。',
      best: 'ミドル〜スローペース、ロングスパート戦、前有利の展開'
    },
    'SENKO_03': {
      comment: '癖のないバランス型。相手やレース展開を問わず柔軟に好位をキープし安定して粘れる。',
      best: 'ミドルペース、展開不問、平均ペース'
    },
    'SENKO_04': {
      comment: '先行でありながら高い瞬発力を備え、好位の絶好位から鋭いキレ味で一気に抜け出す勝負型。',
      best: 'スロー〜ミドルペース、瞬発力勝負、直線抜け出し'
    },
    'SASHI_01': {
      comment: '持続力と瞬発力を併せ持ち、3〜4コーナーから長く脚を使って前陣へ押し寄せるロングスパート型。',
      best: 'ミドル〜ハイペース、ロングスパート戦、持続力勝負'
    },
    'SASHI_02': {
      comment: '突出した持続力と瞬発力を誇る。コーナーから外を豪快に捲り上がり、前を飲み込む力技。',
      best: 'ハイペース、捲り差し展開、波乱・混戦'
    },
    'SASHI_03': {
      comment: '鋭い瞬発力と高い根性に特化。直線まで体力を極力温存し、強烈な伸びと叩き合いで制する。',
      best: 'ハイペース、後方有利展開、直線一気・叩き合い'
    },
    'SASHI_04': {
      comment: '根性が高くバランスに優れる。目標とする先行馬にしっかり食らいついて競り落とすマーク屋。',
      best: 'ミドル〜ハイペース、マーク対象が存在する展開、叩き合い'
    },
    'OIKOMI_01': {
      comment: '豊かなスタミナと鋭い瞬発力を溜め込み、道中は死んだふりから直線一気に前を強襲する一発勝負型。',
      best: '超ハイペース、ハイペース、前崩れ展開'
    },
    'OIKOMI_02': {
      comment: '瞬発・持続・根性が高次元で融合。狭い馬群の隙間でも怯むことなく力強く突き抜けてくる。',
      best: 'ハイペース、馬群凝縮の展開、激しい叩き合い'
    },
    'OIKOMI_03': {
      comment: '追込随一の持続力と高い瞬発力を誇る。後方から3〜4コーナーで圧巻の脚を使って一気に捲り去る。',
      best: '超ハイペース、ハイペース、ロングスパート・ロング捲り展開'
    },
    'OIKOMI_04': {
      comment: '極限の瞬発力を持つロマン型。直線のひと伸び・爆発力だけに全てを賭ける一撃必殺の勝負師。',
      best: '超ハイペース、ハイペース、極端な前崩れ展開'
    }
  };

  function getTurfVal(h) { return Number(h.turf_potential ?? h.turf) || 0; }
  function getDirtVal(h) { return Number(h.dirt_potential ?? h.dirt) || 0; }
  function getSurfaceText(h) {
    const t = getTurfVal(h), d = getDirtVal(h);
    if (t > 0 && d > 0) return t === d ? `芝/ダ${t}` : `芝${t}ダ${d}`;
    if (t > 0) return `芝${t}`;
    if (d > 0) return `ダ${d}`;
    return "-";
  }
  function getDistanceText(h) {
    if (h.min_distance && h.max_distance) return `${h.min_distance}-${h.max_distance}m`;
    return h.distance || '-';
  }
  function getHorsePotential(h) {
    if (h.total_potential !== undefined && h.total_potential !== null) return Number(h.total_potential);
    if (h.potential !== undefined && h.potential !== null) return Number(h.potential);
    return Math.max(getTurfVal(h), getDirtVal(h));
  }

  async function fetchJsonSafe(filename) {
    const candidatePaths = [`./data/${filename}`, `data/${filename}`, `/data/${filename}`];
    for (const path of candidatePaths) {
      try {
        const res = await fetch(path);
        if (res.ok) return await res.json();
      } catch (e) {}
    }
    throw new Error(`${filename} の読み込みに失敗しました`);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        globalUserData = userDoc.data();
      }

      // デックデータ初期構造補正
      if (!globalUserData.decks || !Array.isArray(globalUserData.decks)) {
        globalUserData.decks = [
          { deck_name: "メインデッキ 1", horse_ids: new Array(18).fill(null), default_strategies: new Array(18).fill(null) },
          { deck_name: "メインデッキ 2", horse_ids: new Array(18).fill(null), default_strategies: new Array(18).fill(null) }
        ];
      }
      globalUserData.decks.forEach(deck => {
        if (!deck.horse_ids) deck.horse_ids = new Array(18).fill(null);
        if (!deck.default_strategies) deck.default_strategies = new Array(18).fill(null);
        while (deck.horse_ids.length < 18) deck.horse_ids.push(null);
        while (deck.default_strategies.length < 18) deck.default_strategies.push(null);
      });

      const [stratData, horsesData] = await Promise.all([
        fetchJsonSafe('strategy_master.json'),
        fetchJsonSafe('horses_master.json')
      ]);

      STRATEGY_MASTER = stratData || [];
      if (Array.isArray(horsesData)) {
        horsesData.forEach(h => { HORSES_MASTER[String(h.horse_id)] = h; });
      }

      renderStrategyGrid();
      renderDeckHorseSettings();
      document.getElementById('syncStatus').textContent = "✅ 準備完了";

    } catch (e) {
      console.error("データ読み込みエラー:", e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  // タブ切り替え処理
  window.switchMainTab = function(tabName) {
    const catalogEl = document.getElementById('tabCatalog');
    const settingEl = document.getElementById('tabSetting');
    const tabs = document.querySelectorAll('.view-tabs .tab-btn');

    if (tabName === 'catalog') {
      catalogEl.style.display = 'flex';
      settingEl.style.display = 'none';
      tabs[0].classList.add('active');
      tabs[1].classList.remove('active');
    } else {
      catalogEl.style.display = 'none';
      settingEl.style.display = 'flex';
      tabs[0].classList.remove('active');
      tabs[1].classList.add('active');
    }
  };

  // デック切り替えサブタブ
  window.switchDeckTab = function(idx) {
    activeDeckIdx = idx;
    document.getElementById('deckTab0').classList.toggle('active', idx === 0);
    document.getElementById('deckTab1').classList.toggle('active', idx === 1);
    renderDeckHorseSettings();
  };

  // 脚質フィルター処理
  window.filterStyle = function(style) {
    currentFilter = style;
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.textContent === style || (style === 'ALL' && btn.textContent === 'すべて'));
    });
    renderStrategyGrid();
  };

  // 作戦名鑑（レーダーチャート＋寸評・得意展開）描画
  function renderStrategyGrid() {
    // 既存のチャートインスタンスを破棄
    chartInstances.forEach(c => c.destroy());
    chartInstances = [];

    const container = document.getElementById('strategyGrid');
    container.innerHTML = '';

    const list = STRATEGY_MASTER.filter(s => currentFilter === 'ALL' || s.style === currentFilter);

    list.forEach(strat => {
      const card = document.createElement('div');
      card.className = 'strat-card';

      const colors = STYLE_COLORS[strat.style] || STYLE_COLORS.default;
      const detail = STRATEGY_DETAILS[strat.strategy_id] || {
        comment: '特筆すべき特徴を持ったバランス型作戦。',
        best: '展開不問'
      };
      const canvasId = `chart_${strat.strategy_id}`;

      card.innerHTML = `
        <div class="strat-header">
          <div>
            <span class="strat-title">${strat.name}</span>
          </div>
          <span class="strat-badge" style="background: ${colors.bg}; color: ${colors.badgeText};">${strat.style}</span>
        </div>
        <div class="card-body">
          <div class="chart-container">
            <canvas id="${canvasId}"></canvas>
          </div>
          <div class="comment-box" style="border-left-color: ${colors.border};">
            <strong>【寸評】</strong><br>${detail.comment}<br>
            <strong style="margin-top: 6px; display: inline-block;">【得意な展開】</strong><br>${detail.best}
          </div>
        </div>
      `;
      container.appendChild(card);

      // レーダーチャート生成
      const ctx = document.getElementById(canvasId).getContext('2d');
      const newChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['スピ', 'スタ', '瞬発', '持続', '根性'],
          datasets: [{
            data: [strat.speed, strat.stamina, strat.sharp, strat.jizoku, strat.guts],
            backgroundColor: colors.fill,
            borderColor: colors.border,
            borderWidth: 2,
            pointRadius: 2.5,
            pointBackgroundColor: colors.point
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            r: {
              min: 0,
              max: 20,
              ticks: { display: false, stepSize: 5 }, // 目盛り数値を非表示
              pointLabels: {
                font: { size: 9, weight: 'bold' },
                color: colors.border
              },
              grid: { color: 'rgba(0,0,0,0.08)' },
              angleLines: { color: 'rgba(0,0,0,0.1)' }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
      chartInstances.push(newChart);
    });
  }

  // デックごとの出走表スタイル初期作戦設定描画 (1〜18枠)
  function renderDeckHorseSettings() {
    const tbody = document.getElementById('deckSettingBody');
    tbody.innerHTML = '';

    const currentDeck = globalUserData.decks[activeDeckIdx];
    const horseIds = currentDeck.horse_ids || [];
    const defaultStrats = currentDeck.default_strategies || [];

    for (let slotIdx = 0; slotIdx < 18; slotIdx++) {
      const horseId = horseIds[slotIdx];
      const horse = horseId ? HORSES_MASTER[String(horseId)] : null;
      const currentStratId = defaultStrats[slotIdx] || "";

      let selectOptionsHtml = '<option value="">(未設定 - 自動判定)</option>';
      STRATEGY_MASTER.forEach(s => {
        const selected = (currentStratId === s.strategy_id) ? 'selected' : '';
        selectOptionsHtml += `<option value="${s.strategy_id}" ${selected}>[${s.style}] ${s.name}</option>`;
      });

      const tr = document.createElement('tr');

      if (horse) {
        const style = horse.style || horse.running_style || '-';
        const surfDist = `${getSurfaceText(horse)} ${getDistanceText(horse)}`;
        const pt = getHorsePotential(horse);

        tr.innerHTML = `
          <td style="text-align: center;"><span class="gate-num">${slotIdx + 1}</span></td>
          <td style="font-weight:bold; color: var(--text-main);">${horse.name}</td>
          <td>${style}</td>
          <td style="font-size: 10.5px; color: var(--text-sub);">${surfDist} / PT:${pt}</td>
          <td>
            <select class="select-strat-def" id="slotStratSelect_${slotIdx}">
              ${selectOptionsHtml}
            </select>
          </td>
        `;
      } else {
        tr.innerHTML = `
          <td style="text-align: center;"><span class="gate-num" style="background:#bbb;">${slotIdx + 1}</span></td>
          <td class="empty-slot">(未編成)</td>
          <td class="empty-slot">-</td>
          <td class="empty-slot">-</td>
          <td>
            <select class="select-strat-def" disabled style="opacity: 0.5;">
              <option value="">-</option>
            </select>
          </td>
        `;
      }

      tbody.appendChild(tr);
    }
  }

  // 設定の保存処理
  window.saveDefaultStrategies = async function() {
    if (!currentUser || !globalUserData) return;

    const currentDeck = globalUserData.decks[activeDeckIdx];
    const updatedStrats = [];

    for (let slotIdx = 0; slotIdx < 18; slotIdx++) {
      const select = document.getElementById(`slotStratSelect_${slotIdx}`);
      if (select && !select.disabled) {
        updatedStrats.push(select.value || null);
      } else {
        updatedStrats.push(null);
      }
    }

    currentDeck.default_strategies = updatedStrats;

    try {
      document.getElementById('syncStatus').textContent = "☁️ 保存中...";
      await updateDoc(doc(db, "users", currentUser.uid), {
        decks: globalUserData.decks
      });

      document.getElementById('syncStatus').textContent = "✅ 保存完了";
      alert(`[MAIN ${activeDeckIdx + 1}] の初期作戦設定を保存しました！`);
    } catch (e) {
      console.error("保存失敗:", e);
      document.getElementById('syncStatus').textContent = "❌ 保存失敗";
      alert("保存に失敗しました。");
    }
  };
</script>
