<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逃げ作戦 レーダーチャート＆寸評サンプル</title>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #f0f4f1;
    padding: 15px;
    max-width: 500px;
    margin: 0 auto;
  }
  .strat-card {
    background: #ffffff;
    border: 1px solid #b2d4b6;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .strat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 6px;
    margin-bottom: 10px;
  }
  .strat-title { font-weight: bold; font-size: 14px; color: #2d6a37; }
  .strat-badge { background: #e8f5e9; color: #2d6a37; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: bold; }
  
  .card-body {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  /* Chartの親要素でサイズを固定 */
  .chart-container {
    width: 140px;
    height: 140px;
    flex-shrink: 0;
  }
  .comment-box {
    flex: 1;
    font-size: 11.5px;
    color: #333;
    background: #f4f9f5;
    border-left: 3px solid #2d6a37;
    padding: 8px;
    border-radius: 0 4px 4px 0;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h3 style="color: #2d6a37; font-size: 16px; margin-bottom: 12px;">【逃げ】作戦カード表示サンプル</h3>
<div id="nigeContainer"></div>

<script>
// 逃げ作戦データ＋寸評
const nigeStrategies = [
  {
    strategy_id: "NIGE_01",
    style: "逃げ",
    name: "ハナにこだわる",
    speed: 15, stamina: 12, sharp: 11, jizoku: 17, guts: 15,
    comment: "持続(17)と根性(15)に優れ、後続の競りかけを跳ね返して逃げ粘る真っ向勝負型。"
  },
  {
    strategy_id: "NIGE_02",
    style: "逃げ",
    name: "マイペース逃げ",
    speed: 12, stamina: 16, sharp: 17, jizoku: 13, guts: 12,
    comment: "スタミナ(16)と瞬発力(17)が高く、息を入れて溜め逃げし直線で一気に突き放す型。"
  },
  {
    strategy_id: "NIGE_03",
    style: "逃げ",
    name: "平均ラップ逃げ",
    speed: 14, stamina: 14, sharp: 14, jizoku: 14, guts: 14,
    comment: "オール14の完璧なバランス型。展開に左右されず安定した逃げを打てる万能タイプ。"
  },
  {
    strategy_id: "NIGE_04",
    style: "逃げ",
    name: "ハイラップ逃げ",
    speed: 18, stamina: 11, sharp: 12, jizoku: 18, guts: 11,
    comment: "スピード(18)・持続力(18)が圧倒的。後続の脚を削り取る超高ラップの大逃げ仕様。"
  }
];

const container = document.getElementById('nigeContainer');

nigeStrategies.forEach((strat, index) => {
  const card = document.createElement('div');
  card.className = 'strat-card';
  card.innerHTML = `
    <div class="strat-header">
      <div>
        <span class="strat-title">${strat.name}</span>
        <span style="font-size: 10px; color: #888; margin-left: 4px;">(${strat.strategy_id})</span>
      </div>
      <span class="strat-badge">${strat.style}</span>
    </div>
    <div class="card-body">
      <div class="chart-container">
        <canvas id="chart_${index}"></canvas>
      </div>
      <div class="comment-box">
        <strong>【寸評】</strong><br>${strat.comment}
      </div>
    </div>
  `;
  container.appendChild(card);

  // Chart.jsでレーダーチャートを描画
  const ctx = document.getElementById(`chart_${index}`).getContext('2d');
  new Chart(ctx, {
    type: 'radar',
    data: {
      labels: ['スピ', 'スタ', '瞬発', '持続', '根性'],
      datasets: [{
        data: [strat.speed, strat.stamina, strat.sharp, strat.jizoku, strat.guts],
        backgroundColor: 'rgba(45, 106, 55, 0.25)',
        borderColor: '#2d6a37',
        borderWidth: 1.5,
        pointRadius: 2,
        pointBackgroundColor: '#2d6a37'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0,
          max: 20, // パラメータ上限
          ticks: { display: false, stepSize: 5 }, // 目盛り数字は非表示にしてスッキリさせる
          pointLabels: { font: { size: 9, weight: 'bold' }, color: '#4e6b52' },
          grid: { color: '#e0e0e0' },
          angleLines: { color: '#e0e0e0' }
        }
      },
      plugins: {
        legend: { display: false } // 凡例非表示
      }
    }
  });
});
</script>

</body>
</html>
