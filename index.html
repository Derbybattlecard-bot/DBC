
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derby Card Battle</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      margin: 20px auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h1 {
      color: #4caf50;
      font-size: 24px;
    }
    .status {
      display: flex;
      justify-content: space-around;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .badge {
      background: #ff9800;
      color: #000;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>ダービーカードバトル</h1>
  <p>テスト画面が正常に表示されています！</p>

  <div class="card">
    <span class="badge">SSR</span>
    <h2>ディープインパクト</h2>
    <p>脚質: 追い込み</p>
    <div class="status">
      <div>ポテンシャル<br><strong>21</strong></div>
      <div>スピード<br><strong>20</strong></div>
      <div>勝負根性<br><strong>20</strong></div>
    </div>
  </div>

</body>
</html>
