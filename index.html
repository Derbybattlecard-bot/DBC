<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DERBY BATTLE CARD</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-inner-bg: #f2f8f3;
      --accent-gold: #c29b1d;
      --text-color: #1a2e1d;
      --sub-text: #4e6b52;
      --header-green: #0d4220;
      --border-green: #b2d4b6;
    }
    body {
      margin: 0;
      padding: 10px;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      text-align: center;
      padding: 10px 8px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 3px solid var(--header-green);
      border-radius: 8px 8px 0 0;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: var(--header-green);
      letter-spacing: 2px;
      font-weight: 900;
    }
    .user-profile {
      background: #ffffff;
      border: 1px solid var(--border-green);
      border-radius: 6px;
      padding: 6px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
    }
    .record-section {
      background: var(--card-bg);
      border: 1px solid var(--border-green);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .record-item { text-align: center; }
    .record-label { font-size: 10px; color: var(--sub-text); display: block; margin-bottom: 2px; }
    .record-value { font-size: 14px; font-weight: bold; color: var(--text-color); }
    .record-value.highlight { color: var(--accent-gold); }

    /* --- ボーナスカード部分 (deck.htmlスタイル準拠) --- */
    .bonus-section {
      background: var(--card-bg);
      border: 2px solid #82c088;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .bonus-title { font-size: 12px; font-weight: bold; color: var(--header-green); margin-bottom: 8px; }
    .cards-container { display: flex; justify-content: space-between; gap: 4px; }
    .bonus-card {
      flex: 1;
      min-width: 0;
      background: #ffffff;
      border: 1px solid #a8d5ac;
      border-radius: 6px;
      padding: 5px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130px;
      box-sizing: border-box;
      text-align: left;
    }
    .bonus-card.empty {
      background: #f0f4f0;
      border: 1px dashed var(--border-green);
      color: #888;
      font-size: 11px;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .bonus-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed #d0edd3;
      padding-bottom: 2px;
      margin-bottom: 2px;
    }
    .bonus-card .slot-num { font-size: 11px; font-weight: bold; color: #e63956; }
    .bonus-card .gen-year { font-size: 9px; color: var(--sub-text); }
    .bonus-card .rarity { font-size: 10px; font-weight: bold; color: var(--accent-gold); }
    .bonus-card-name { 
      font-size: 10.5px; 
      font-weight: bold; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
      line-height: 1.2;
      color: var(--text-color);
    }
    .bonus-card-body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      margin: 2px 0;
    }
    .bonus-card-details {
      display: flex;
      flex-direction: column;
      gap: 1px;
      color: var(--sub-text);
      font-size: 9px;
      font-weight: bold;
      line-height: 1.1;
      flex: 1;
      min-width: 0;
    }
    .bonus-card-details div {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bonus-radar-box {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
    }
    .bonus-abilities-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      margin-top: 2px;
    }
    .bonus-ability-btn {
      background: #e2efe3;
      border: 1px solid #2d6a37;
      color: #2d6a37;
      border-radius: 2px;
      font-size: 7.5px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 1px 0;
      letter-spacing: -0.5px;
    }
    .bonus-ability-btn.empty { visibility: hidden; }
    .bonus-msg { 
      margin-top: 8px; 
      font-size: 10px; 
      color: #8a6200; 
      background: #fff8d6; 
      padding: 4px; 
      border-radius: 4px; 
      border: 1px solid #f0e3a1; 
    }
    .bonus-claim-btn {
      margin-top: 8px;
      background: linear-gradient(135deg, #d4af37, #aa820a);
      border: none;
      color: #fff;
      padding: 6px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
    }

    /* --- ナビゲーションボタン --- */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-link { text-decoration: none; }
    .btn-link.full-width { grid-column: span 2; }
    
    .btn {
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, #2d6a37, #1b4d23);
      border: 1px solid #143b1a;
      color: #ffffff;
      padding: 10px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-light-green {
      background: linear-gradient(135deg, #449e54, #2c773a);
      border: 1px solid #1e5227;
    }

    .btn-collection {
      background: linear-gradient(135deg, #d4af37, #aa820a);
      border: 1px solid #785a02;
    }

    /* --- デッキ表示領域 --- */
    .deck-section {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border-green);
    }
    .main-deck-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
    .main-tab {
      flex: 1;
      background: #e2efe3;
      border: 1px solid #a0ca33;
      color: var(--sub-text);
      padding: 6px 0;
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
    }
    .main-tab.active {
      background: linear-gradient(135deg, #1b4d23, #2d6a37);
      color: #ffffff;
      border-color: #143b1a;
    }
    .deck-control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-inner-bg);
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      border: 1px solid #cce2d0;
    }
    .deck-name { font-size: 11px; font-weight: bold; }
    .action-btn {
      background: #ffffff;
      border: 1px solid #82c088;
      color: var(--text-color);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }
    .race-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: center;
      background: #ffffff;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #c2dfc6;
    }
    .race-table th { background: #2d6a37; color: #ffffff; padding: 5px 2px; }
    .race-table td { padding: 4px 2px; border-bottom: 1px solid #ebf4ec; }
    .race-table tr:nth-child(even) { background: #f7fbf7; }
  </style>
</head>
<body>
<div class="container">
  <div class="header"><h1>DERBY BATTLE CARD</h1></div>
  <div class="user-profile" id="userProfileDisplay">読み込み中...</div>
  <div class="record-section" id="recordSection"><div class="record-item"><span class="record-label">取得中...</span></div></div>
  
  <div class="bonus-section" id="loginBonusSection">
    <div class="bonus-title">🎰 DAILY LOGIN BONUS</div>
    <div class="cards-container" id="bonusCardsContainer"></div>
    <div id="bonusMessageContainer"></div>
    <div id="bonusBtnContainer"></div>
  </div>

  <div class="menu-grid">
    <a href="battle.html" class="btn-link"><button class="btn">💻 VS COMPUTER</button></a>
    <a href="online.html" class="btn-link"><button class="btn">🌐 ONLINE MATCH</button></a>
    <a href="deck.html" class="btn-link"><button class="btn btn-light-green">🗂️ EDIT DECK</button></a>
    <a href="strategy_list.html" class="btn-link"><button class="btn btn-light-green">🎯 作戦の作戦室</button></a>
    <a href="series.html" class="btn-link"><button class="btn">🏆 SERIES VIEW</button></a>
    <a href="admin-trade.html" class="btn-link"><button class="btn">🤝 TRADE BOARD</button></a>
    <a href="collection.html" class="btn-link full-width"><button class="btn btn-collection">📚 CARD COLLECTION</button></a>
  </div>

  <div class="deck-section">
    <div class="main-deck-tabs">
      <div class="main-tab active" id="tabMain1">🏇 MAIN DECK 1</div>
      <div class="main-tab" id="tabMain2">🏇 MAIN DECK 2</div>
    </div>
    <div class="deck-control-bar">
      <span class="deck-name" id="deckNameDisplay">✏️ 読み込み中...</span>
      <a href="deck.html" style="text-decoration:none;"><button class="action-btn">✏️ 編集する</button></a>
    </div>
    <table class="race-table">
      <thead>
        <tr><th>枠</th><th>印</th><th style="text-align:left; padding-left:30px;">馬名</th><th>脚質</th><th>適性</th><th>距離</th></tr>
      </thead>
      <tbody id="raceTableBody">
        <tr><td colspan="6">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, setDoc, collection, getCountFromServer, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  
  import { cardRenderer } from './js/card_renderer.js';
  import { drawBonusCard, getGenYearLastDigit, playFourthCornerCutIn } from './js/login_bonus.js';

  let globalUserData = null;
  let currentUser = null;
  let activeDeckIndex = 0;

  // --- deck.htmlと同等のヘルパー関数 ---
  function getTurfVal(horse) {
    return Number(horse.turf_potential ?? horse.turf) || 0;
  }
  function getDirtVal(horse) {
    return Number(horse.dirt_potential ?? horse.dirt) || 0;
  }
  function getSurfaceText(horse) {
    const t = getTurfVal(horse);
    const d = getDirtVal(horse);
    if (t > 0 && d > 0) return t === d ? `芝/ダ${t}` : `芝${t}ダ${d}`;
    if (t > 0) return `芝${t}`;
    if (d > 0) return `ダ${d}`;
    return "-";
  }

  function getDistanceLinesHtml(horse) {
    const min = horse.min_distance || horse.distance_min;
    const max = horse.max_distance || horse.distance_max;
    if (min && max) {
      return `<div>${min}m</div><div>${max}m</div>`;
    }
    if (horse.distance) {
      const parts = String(horse.distance).split('-');
      if (parts.length === 2) {
        return `<div>${parts[0]}m</div><div>${parts[1]}m</div>`;
      }
      return `<div>${horse.distance}</div>`;
    }
    return `<div>-</div>`;
  }

  function getAbilityBadgeHtml(horse) {
    let abilities = [];
    if (Array.isArray(horse.ability)) {
      abilities = horse.ability;
    } else if (typeof horse.ability === 'string' && horse.ability) {
      abilities = [horse.ability];
    } else if (horse.skill) {
      abilities = Array.isArray(horse.skill) ? horse.skill : [horse.skill];
    }

    let html = '<div class="bonus-abilities-row">';
    for (let i = 0; i < 3; i++) {
      if (abilities[i]) {
        const label = String(abilities[i]).substring(0, 3);
        html += `<div class="bonus-ability-btn" title="${abilities[i]}">${label}</div>`;
      } else {
        html += `<div class="bonus-ability-btn empty">---</div>`;
      }
    }
    html += '</div>';
    return html;
  }

  function createRadarSvgForHorse(horse) {
    const getVal = (val) => {
      if (typeof val === 'number') return val;
      return cardRenderer.rankToValue ? cardRenderer.rankToValue(val) : 0;
    };

    const paramsObj = {
      spdVal: getVal(horse.speed),
      stmVal: getVal(horse.stamina),
      shpVal: getVal(horse.sharp ?? horse.sharpness),
      jzkVal: getVal(horse.jizoku),
      gutVal: getVal(horse.guts)
    };
    const styleName = horse.style || horse.running_style || 'default';
    return cardRenderer.generateRadarSVG ? cardRenderer.generateRadarSVG(paramsObj, styleName) : '';
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;
    try {
      const [userDoc] = await Promise.all([
        getDoc(doc(db, "users", user.uid)),
        cardRenderer.init().catch(err => {
          console.error("cardRendererの初期化エラー（単独リカバリ）:", err);
        })
      ]);

      if (!userDoc.exists()) {
        window.location.href = 'setup.html';
        return;
      }
      globalUserData = userDoc.data();

      renderUserProfile();
      renderSelectedDeck();
      renderRecord(); 
      await checkAndRenderLoginBonus();
    } catch (err) {
      console.error("初期化エラー:", err);
      document.getElementById('userProfileDisplay').textContent = "⚠️ 初期化エラーが発生しました";
      alert("初期化に失敗しました。マスターデータおよびネットワーク環境をご確認ください。");
    }
  });

  function renderUserProfile() {
    const name = globalUserData.display_name || globalUserData.displayName || currentUser.displayName || "ゲスト";
    document.getElementById('userProfileDisplay').innerHTML = `👤 プレイヤー: <strong>${name}</strong>`;
  }

  async function renderRecord() {
    const totalWins = globalUserData.total_wins || 0;
    const max1st = globalUserData.max_1st_places || 0;
    const rec = globalUserData.record || { matches: 0, wins: 0 };
    const winRate = rec.matches > 0 ? ((rec.wins / rec.matches) * 100).toFixed(1) : "0.0";
    
    updateRecordDOM(totalWins, max1st, winRate, "取得中...");

    try {
      const collRef = collection(db, `users/${currentUser.uid}/inventory`);
      const snapshot = await getCountFromServer(collRef);
      updateRecordDOM(totalWins, max1st, winRate, `${snapshot.data().count}種`);
    } catch (error) {
      updateRecordDOM(totalWins, max1st, winRate, "- 種");
    }
  }

  function updateRecordDOM(totalWins, max1st, winRate, cardTypesDisplay) {
    document.getElementById('recordSection').innerHTML = `
      <div class="record-item"><span class="record-label">通算勝利</span><span class="record-value highlight">${totalWins}勝</span></div>
      <div class="record-item"><span class="record-label">1着最多数</span><span class="record-value">${max1st}回</span></div>
      <div class="record-item"><span class="record-label">対戦勝率</span><span class="record-value">${winRate}%</span></div>
      <div class="record-item"><span class="record-label">所持種類</span><span class="record-value" style="color:#0d4220;">${cardTypesDisplay}</span></div>
    `;
  }

  async function checkAndRenderLoginBonus() {
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    
    let bonusState = globalUserData.login_bonus_state || {
      last_date: "", today_cards: [], fever_qualified_next_day: false, is_fever_today: false, last_claim_time: 0
    };

    if (bonusState.last_date !== todayStr) {
      bonusState = {
        last_date: todayStr,
        today_cards: [],
        fever_qualified_next_day: false,
        is_fever_today: Boolean(bonusState.fever_qualified_next_day),
        last_claim_time: 0
      };
      await setDoc(doc(db, "users", currentUser.uid), { login_bonus_state: bonusState }, { merge: true });
      globalUserData.login_bonus_state = bonusState;
    }
    renderBonusUI(bonusState);
  }

  function parseTimestamp(val) {
    if (!val) return 0;
    if (typeof val === 'number') return val;
    if (val.toMillis) return val.toMillis();
    return val.seconds ? val.seconds * 1000 : 0;
  }

  function renderBonusUI(state) {
    const container = document.getElementById('bonusCardsContainer');
    const msgContainer = document.getElementById('bonusMessageContainer');
    const btnContainer = document.getElementById('bonusBtnContainer');
    container.innerHTML = ''; msgContainer.innerHTML = ''; btnContainer.innerHTML = '';

    const cards = state.today_cards || [];

    for (let i = 0; i < 3; i++) {
      if (i < cards.length) {
        const item = cards[i];
        const horse = cardRenderer.getHorse ? cardRenderer.getHorse(item.horse_id) : null;
        const genYear = cardRenderer.getGenerationYear ? cardRenderer.getGenerationYear(horse || item.horse_id) : '-';
        const lastDigit = getGenYearLastDigit(item.horse_id);
        const horseName = horse ? horse.name : item.horse_id;

        if (horse) {
          const surfaceText = getSurfaceText(horse);
          const distLinesHtml = getDistanceLinesHtml(horse);
          const sexText = horse.sex || "-";
          const abilitiesHtml = getAbilityBadgeHtml(horse);
          const radarSvgHtml = createRadarSvgForHorse(horse);

          container.innerHTML += `
            <div class="bonus-card">
              <div class="bonus-card-header">
                <span class="gen-year">${genYear}年</span>
                <span class="slot-num">${lastDigit}</span>
                <span class="rarity">${item.rarity}</span>
              </div>
              <div class="bonus-card-name" title="${horseName}">${horseName}</div>
              <div class="bonus-card-body">
                <div class="bonus-card-details">
                  <div>${surfaceText}</div>
                  ${distLinesHtml}
                  <div>${horse.style || horse.running_style || '-'}</div>
                  <div>${sexText}</div>
                </div>
                <div class="bonus-radar-box">
                  ${radarSvgHtml}
                </div>
              </div>
              ${abilitiesHtml}
            </div>`;
        } else {
          container.innerHTML += `
            <div class="bonus-card">
              <div class="bonus-card-header">
                <span class="gen-year">${genYear}年</span>
                <span class="slot-num">${lastDigit}</span>
                <span class="rarity">${item.rarity}</span>
              </div>
              <div class="bonus-card-name" title="${horseName}">${horseName}</div>
              <div style="font-size:10px; color:#888; margin:auto;">データ取得中</div>
            </div>`;
        }
      } else {
        container.innerHTML += `<div class="bonus-card empty">${i + 1}枚目 未獲得</div>`;
      }
    }

    const diffMs = Date.now() - parseTimestamp(state.last_claim_time);
    const ONE_HOUR_MS = 3600000;

    if (cards.length < 3) {
      if (cards.length === 0 || diffMs >= ONE_HOUR_MS) {
        const isFever = (cards.length === 0 && state.is_fever_today);
        btnContainer.innerHTML = `<button class="bonus-claim-btn" id="claimBtn">${isFever ? "🔥 確変ボーナスを受け取る！" : `🎁 ${cards.length + 1}枚目を受け取る`}</button>`;
        document.getElementById('claimBtn').onclick = claimLoginBonus;
        if (isFever) msgContainer.innerHTML = `<div class="bonus-msg">✨ 前日のスロット達成特典適用中！レアカード確定！ ✨</div>`;
      } else {
        const minLeft = Math.ceil((ONE_HOUR_MS - diffMs) / 60000);
        msgContainer.innerHTML = `<div class="bonus-msg">⏰ 次のボーナス獲得まで あと約${minLeft}分</div>`;
      }
    } else {
      if (state.fever_qualified_next_day) {
        msgContainer.innerHTML = `<div class="bonus-msg">✨ 7-7-7 誕生年下1桁ゾロ目達成！明日の1枚目は確変確定！ ✨</div>`;
      } else {
        msgContainer.innerHTML = `<div class="bonus-msg" style="background:#eaf5eb; color:#0d4220; border-color:#b2d4b6;">本日のログインボーナスはすべて獲得済みです</div>`;
      }
    }
  }

  async function claimLoginBonus() {
    let state = globalUserData.login_bonus_state || {};
    const cards = state.today_cards || [];
    if (cards.length >= 3) return;

    const isFeverClaim = (cards.length === 0 && Boolean(state.is_fever_today));
    const chosenHorse = drawBonusCard(cardRenderer, globalUserData.affiliation, isFeverClaim);

    if (!chosenHorse || !chosenHorse.horse_id) {
      alert("カードデータの取得に失敗しました。");
      return;
    }

    if (typeof playFourthCornerCutIn === 'function') {
      await playFourthCornerCutIn(chosenHorse, cardRenderer);
    }

    const nowMs = Date.now();
    state.today_cards = [...cards, { horse_id: chosenHorse.horse_id, rarity: chosenHorse.rarity, timestamp: nowMs }];
    state.last_claim_time = nowMs;

    if (state.today_cards.length === 3) {
      const [d1, d2, d3] = state.today_cards.map(c => getGenYearLastDigit(c.horse_id));
      if (d1 === d2 && d2 === d3) state.fever_qualified_next_day = true;
    }

    try {
      await Promise.all([
        setDoc(doc(db, "users", currentUser.uid), { login_bonus_state: state }, { merge: true }),
        setDoc(doc(db, `users/${currentUser.uid}/inventory/${chosenHorse.horse_id}`), {
          count: increment(1),
          obtained_at: new Date().toISOString()
        }, { merge: true })
      ]);

      globalUserData.login_bonus_state = state;
      renderBonusUI(state);
      renderRecord();
    } catch (err) {
      console.error("ログインボーナス処理失敗:", err);
      alert("保存時にエラーが発生しました。");
    }
  }

  function switchTab(idx) {
    activeDeckIndex = idx;
    document.getElementById('tabMain1').className = `main-tab ${idx === 0 ? 'active' : ''}`;
    document.getElementById('tabMain2').className = `main-tab ${idx === 1 ? 'active' : ''}`;
    renderSelectedDeck();
  }

  function renderSelectedDeck() {
    const decks = globalUserData.decks || [{ deck_name: "メインデッキ 1", horse_ids: [] }, { deck_name: "メインデッキ 2", horse_ids: [] }];
    const deck = decks[activeDeckIndex] || { deck_name: "未設定", horse_ids: [] };
    document.getElementById('deckNameDisplay').textContent = `✏️ ${deck.deck_name || "メインデッキ"}`;
    
    const tbody = document.getElementById('raceTableBody');
    if (!deck.horse_ids || deck.horse_ids.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:#888; padding:12px;">デッキが設定されていません（EDIT DECKから編成してください）</td></tr>';
      return;
    }

    const horsesData = deck.horse_ids.map((hId, originalIndex) => {
      const horse = cardRenderer.getHorse ? cardRenderer.getHorse(hId) : null;
      if (!horse) return { hId, originalIndex, horse: null, score: 0 };

      const getVal = (v) => {
        if (typeof v === 'number') return v;
        const rankMap = { 'SS': 100, 'S': 90, 'A': 80, 'B': 70, 'C': 60, 'D': 50, 'E': 40 };
        return rankMap[v] || 0;
      };

      const score = getVal(horse.speed) + getVal(horse.stamina) + 
                    getVal(horse.sharp ?? horse.sharpness) + 
                    getVal(horse.jizoku) + getVal(horse.guts);

      return { hId, originalIndex, horse, score };
    });

    const validHorses = horsesData.filter(item => item.horse !== null);
    validHorses.sort((a, b) => b.score - a.score);

    const markMap = new Map();
    validHorses.forEach((item, rank) => {
      let mark = 'ー';
      if (rank === 0) mark = '<span style="color:#e60000; font-weight:bold;">◎</span>';
      else if (rank === 1) mark = '<span style="color:#e60000; font-weight:bold;">◯</span>';
      else if (rank === 2) mark = '<span style="color:#1a73e8; font-weight:bold;">▲</span>';
      else if (rank === 3 || rank === 4) mark = '<span style="color:#2d6a37; font-weight:bold;">△</span>';
      else if (rank === 5) mark = '<span style="color:#c29b1d; font-weight:bold;">注</span>';
      
      markMap.set(item.hId, mark);
    });

    const rowsHtml = horsesData.map((item) => {
      const { hId, originalIndex, horse } = item;
      const frameNum = originalIndex + 1;

      if (!horse) {
        return `<tr>
          <td>${frameNum}</td>
          <td>ー</td>
          <td style="text-align:left; padding-left:4px;">${hId}</td>
          <td>-</td>
          <td>-</td>
          <td>-</td>
        </tr>`;
      }

      const name = horse.name || hId;
      const mark = markMap.get(hId) || 'ー';
      const style = horse.style || horse.running_style || horse.leg_style || '-';

      const aptitude = cardRenderer.formatAptitude 
        ? cardRenderer.formatAptitude(horse.turf_potential ?? horse.turf, horse.dirt_potential ?? horse.dirt)
        : (horse.turf ? `芝${horse.turf}` : (horse.dirt ? `ダ${horse.dirt}` : '-'));

      let distance = '-';
      if (cardRenderer.getDistanceText) {
        const res = cardRenderer.getDistanceText(horse);
        if (res && res !== '-' && res !== 'undefined') distance = res;
      }

      if (distance === '-') {
        if (horse.distance) {
          distance = typeof horse.distance === 'number' ? `${horse.distance}m` : horse.distance;
        } else if (horse.min_distance && horse.max_distance) {
          distance = `${horse.min_distance}-${horse.max_distance}m`;
        } else if (horse.min_dist && horse.max_dist) {
          distance = `${horse.min_dist}-${horse.max_dist}m`;
        } else if (horse.distance_aptitude) {
          distance = horse.distance_aptitude;
        } else if (horse.dist) {
          distance = horse.dist;
        }
      }

      return `<tr>
        <td><strong>${frameNum}</strong></td>
        <td>${mark}</td>
        <td style="text-align:left; padding-left:15px; font-weight:bold;">${name}</td>
        <td>${style}</td>
        <td>${aptitude}</td>
        <td>${distance}</td>
      </tr>`;
    }).join('');

    tbody.innerHTML = rowsHtml;
  }

  document.getElementById('tabMain1').onclick = () => switchTab(0);
  document.getElementById('tabMain2').onclick = () => switchTab(1);
</script>
</body>
</html>
