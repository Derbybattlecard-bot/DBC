<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コレクションルーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        .tab-btn.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
        .card-item {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
.watermark-text {
}
    </style>
</head>
<body class="min-h-screen pb-12">
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-book-open text-blue-500"></i> コレクションルーム
            </h1>
        </div>
        <div id="status" class="text-xs text-gray-400 flex items-center gap-1">
            <i class="fa-solid fa-cloud-arrow-down animate-pulse text-blue-400"></i> 読込中...
        </div>
    </header>
<!-- Navigation Tabs -->
    <div id="global-tabs" class="bg-gray-900 border-b border-gray-800 flex justify-center text-sm font-medium text-gray-400 mb-6 flex-wrap gap-2">
        <a href="index.html" class="tab-btn px-4 py-3 flex items-center gap-2 transition-colors hover:text-white">
            <i class="fa-solid fa-house text-gray-400"></i> ホーム
        </a>
        <button class="tab-btn active px-6 py-3 flex items-center gap-2 transition-colors" onclick="switchTab('all')">
            <i class="fa-solid fa-id-card"></i> カード図鑑
        </button>
        <button class="tab-btn px-6 py-3 flex items-center gap-2 transition-colors" onclick="switchTab('g1')">
            <i class="fa-solid fa-trophy text-yellow-500"></i> G1ギャラリー
        </button>
    </div>
<!-- Stats Overview -->
    <div class="max-w-6xl mx-auto px-4 mb-6 grid grid-cols-3 gap-4 text-center">
        <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
            <div class="text-xs text-gray-400 mb-1">獲得種類</div>
            <div id="stat-owned-types" class="text-xl font-bold text-blue-400">0</div>
        </div>
        <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
            <div class="text-xs text-gray-400 mb-1">全カード数</div>
            <div id="stat-total-cards" class="text-xl font-bold text-gray-200">0</div>
        </div>
        <div class="bg-gray-800/60 p-3 rounded-lg border border-gray-700/50">
            <div class="text-xs text-gray-400 mb-1">コンプ率</div>
            <div id="stat-comp-rate" class="text-xl font-bold text-green-400">0%</div>
        </div>
    </div>
<!-- Filter Controls -->
    <div class="max-w-6xl mx-auto px-4 mb-6 flex flex-wrap gap-2 justify-between items-center">
        <div id="filter-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-full whitespace-nowrap font-medium">すべて</button>
        </div>
    </div>
<!-- Main Content Container -->
    <main class="max-w-6xl mx-auto px-4">
        <div id="card-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-12 text-gray-500 flex flex-col items-center justify-center gap-2">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-blue-500"></i>
                <span>カードデータを読み込み中...</span>
            </div>
        </div>
    </main>
<!-- Card Details Modal -->
    <div id="card-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-sm rounded-2xl overflow-hidden relative shadow-2xl">
            <button onclick="closeModal()" class="absolute top-3 right-3 z-10 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center hover:bg-black/70 transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content" class="p-6 flex flex-col items-center text-center">
                <!-- Dynamic content populated via JS -->
            </div>
            <div id="modal-actions" class="p-4 bg-gray-950 border-t border-gray-800 flex justify-center gap-2">
                <button id="trade-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded-xl text-sm transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-handshake"></i> トレードに出品する
                </button>
            </div>
        </div>
    </div>
<!-- Trade Modal -->
    <div id="trade-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl overflow-hidden relative shadow-2xl p-6">
            <h3 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-repeat text-emerald-400"></i> トレード出品条件設定
            </h3>
            <div id="trade-offered-card" class="mb-4 p-3 bg-gray-800/50 rounded-xl border border-gray-700/50 flex items-center gap-3">
                <!-- Target card summary -->
            </div>
            <form id="trade-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">希望条件（馬名を直接入力・最大5つ）</label>
                    <div id="wanted-inputs" class="space-y-2">
                        <input type="text" placeholder="希望馬名 1" class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 mb-1">出品コメント</label>
                    <textarea placeholder="トレードに関する補足や希望などを入力..." class="w-full bg-gray-800 border border-gray-700 text-sm rounded-lg px-3 py-2 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 h-20 resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeTradeModal()" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">キャンセル</button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold px-5 py-2 rounded-xl transition-colors">出品する</button>
                </div>
            </form>
        </div>
    </div>
<!-- Firebase Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        // TODO: Replace with application's Firebase config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentTab = 'all';
        let masterCards = [];
        let userInventory = {};
        window.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    await loadUserInventory(user.uid);
                }
                await loadMasterCards();
                renderCollection();
            });
        });
        async function loadMasterCards() {
            try {
                const querySnapshot = await getDocs(collection(db, "cards"));
                masterCards = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('status').innerHTML = `<i class="fa-solid fa-check text-green-400"></i> 同期完了`;
            } catch (e) {
                console.error("Error loading cards: ", e);
                document.getElementById('status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> エラー`;
            }
        }
        async function loadUserInventory(uid) {
            try {
                const userDoc = await getDoc(doc(db, "users", uid));
                if (userDoc.exists()) {
                    userInventory = userDoc.data().inventory || {};
                }
            } catch (e) {
                console.error("Error loading inventory: ", e);
            }
        }
        function getGenGroupInfo(birthYear) {
            const y = parseInt(birthYear, 10);
            if (isNaN(y)) return null;
            if (y <= 1980) return { key: 'gen1', label: '〜1980年' };
            if (y <= 1985) return { key: 'gen2', label: '1981〜1985年' };
            if (y <= 1990) return { key: 'gen3', label: '1986〜1990年' };
            if (y <= 1995) return { key: 'gen4', label: '1991〜1995年' };
            if (y <= 2000) return { key: 'gen5', label: '1996〜2000年' };
            if (y <= 2005) return { key: 'gen6', label: '2001〜2005年' };
            if (y <= 2010) return { key: 'gen7', label: '2006〜2010年' };
            if (y <= 2015) return { key: 'gen8', label: '2011〜2015年' };
            return null;
        }
        function getRadarPoints(stats) {
            const speed = calcR(stats?.speed);
            const stamina = calcR(stats?.stamina);
            const power = calcR(stats?.power);
            const guts = calcR(stats?.guts);
            const wisdom = calcR(stats?.wisdom);
            return `${speed},${stamina} ${power},${guts} ${wisdom}`;
        }
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCollection();
        };
        function renderCollection() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            let filteredCards = masterCards.filter(card => {
                if (getGenGroupInfo(card.birthYear) === null) return false;
                if (currentTab === 'g1') return card.isG1Winner === true;
                return true;
            });
            let ownedCount = 0;
            filteredCards.forEach(card => {
                const count = userInventory[card.id] || 0;
                if (count > 0) ownedCount++;
                const cardEl = document.createElement('div');
                cardEl.className = `card-item bg-gray-900 border ${count > 0 ? 'border-gray-700' : 'border-gray-800 opacity-50'} rounded-xl overflow-hidden cursor-pointer relative shadow-lg`;
                cardEl.onclick = () => openModal(card, count);
                cardEl.innerHTML = `
                    <div class="aspect-[3/4] bg-gray-800 relative overflow-hidden flex items-center justify-center">
                        <span class="birth-year-badge absolute top-2 left-2 bg-black/70 text-gray-200 text-[10px] px-1.5 py-0.5 rounded border border-gray-600/50 z-10">${card.birthYear || '----'}年</span>
                        <img src="${card.imageUrl || 'https://via.placeholder.com/300x400?text=No+Image'}" alt="${card.name}" class="w-full h-full object-cover">
                        <div class="pt-center absolute inset-0 flex items-center justify-center text-white font-extrabold text-2xl drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] pointer-events-none z-10">${card.pt || 0} PT</div>
                        ${count > 0 ? `<span class="absolute top-2 right-2 bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow z-10">x${count}</span>` : ''}
                    </div>
                    <div class="card-name-bar p-3 text-center bg-gray-900/90">
                        <div class="text-xs text-blue-400 font-semibold mb-0.5">${card.rarity || 'NORMAL'}</div>
                        <div class="text-base font-bold text-white line-clamp-2 leading-snug">${card.name || '不明の競走馬'}</div>
                    </div>
                `;
                grid.appendChild(cardEl);
            });
            document.getElementById('stat-owned-types').innerText = ownedCount;
            document.getElementById('stat-total-cards').innerText = filteredCards.length;
            const rate = filteredCards.length > 0 ? Math.round((ownedCount / filteredCards.length) * 100) : 0;
            document.getElementById('stat-comp-rate').innerText = `${rate}%`;
        }
        window.openModal = function(card, count) {
            const modal = document.getElementById('card-modal');
            const content = document.getElementById('modal-content');
            const tradeBtn = document.getElementById('trade-btn');
            content.innerHTML = `
                <div class="w-48 aspect-[3/4] rounded-xl overflow-hidden mb-4 shadow-xl border border-gray-700">
                    <img src="${card.imageUrl || 'https://via.placeholder.com/300x400?text=No+Image'}" class="w-full h-full object-cover">
                </div>
                <span class="text-xs text-blue-400 font-bold tracking-wider uppercase mb-1">${card.rarity || 'NORMAL'}</span>
                <h2 class="text-xl font-bold text-white mb-2">${card.name}</h2>
                <p class="text-xs text-gray-400 mb-4 line-clamp-3">${card.description || '詳細情報はありません。'}</p>
                <div class="bg-gray-800/80 px-4 py-2 rounded-lg text-xs text-gray-300 font-medium">
                    所持数: <span class="text-white font-bold text-sm ml-1">${count}</span> 枚
                </div>
            `;
            if (count > 1) {
                tradeBtn.disabled = false;
                tradeBtn.onclick = () => { closeModal(); openTradeModal(card); };
            } else {
                tradeBtn.disabled = true;
            }
            modal.classList.remove('hidden');
        };
        window.closeModal = function() {
            document.getElementById('card-modal').classList.add('hidden');
        };
        window.openTradeModal = function(card) {
            const tradeModal = document.getElementById('trade-modal');
            const offeredCardContainer = document.getElementById('trade-offered-card');
            offeredCardContainer.innerHTML = `
                <div class="w-12 h-16 bg-gray-700 rounded overflow-hidden flex-shrink-0">
                    <img src="${card.imageUrl || 'https://via.placeholder.com/300x400?text=No+Image'}" class="w-full h-full object-cover">
                </div>
                <div class="text-left overflow-hidden">
                    <div class="text-xs text-blue-400 font-bold">${card.rarity || 'NORMAL'}</div>
                    <div class="text-sm font-bold text-white truncate">${card.name}</div>
                </div>
            `;
            tradeModal.classList.remove('hidden');
        };
        window.closeTradeModal = function() {
            document.getElementById('trade-modal').classList.add('hidden');
        };
    </script>
</body>
</html>
