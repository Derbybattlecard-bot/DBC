
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コレクションルーム</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f2b1d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding-bottom: 40px;
        }
        header {
            background-color: #07170f;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a4a32;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        h1 { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        #status { font-size: 12px; color: #a0aec0; }
        .nav-tabs {
            display: flex;
            justify-content: center;
            background-color: #07170f;
            border-bottom: 1px solid #1a4a32;
            gap: 8px;
            padding: 0 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 16px;
            font-size: 13px;
            color: #a0aec0;
            background: none;
            border: none;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tab-btn.active {
            color: #48bb78;
            border-bottom-color: #48bb78;
            font-weight: bold;
        }
        .stats-container {
            max-width: 800px;
            margin: 16px auto;
            padding: 0 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
        }
        .stat-box {
            background-color: rgba(26, 74, 50, 0.5);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #1a4a32;
        }
        .stat-title { font-size: 10px; color: #a0aec0; margin-bottom: 2px; }
        .stat-val { font-size: 16px; font-weight: bold; color: #48bb78; }
        .filter-container {
            max-width: 800px;
            margin: 0 auto 16px;
            padding: 0 12px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
        }
        .filter-btn {
            background-color: #1a4a32;
            color: #ffffff;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 12px;
            border: none;
            white-space: nowrap;
            cursor: pointer;
        }
        .filter-btn.active { background-color: #48bb78; color: #07170f; font-weight: bold; }
        main { max-width: 800px; margin: 0 auto; padding: 0 12px; }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }
        .card-item {
            background-color: #2a362f;
            border: 1px solid #236141;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card-item:hover { transform: translateY(-2px); }
        .card-item.not-owned { opacity: 0.5; filter: grayscale(0.6); }
        .card-media {
            aspect-ratio: 3/4;
            background-color: #0a2115;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .birth-year-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #e2e8f0;
            font-size: 9px;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }
        .count-badge {
            position: absolute;
            top: 4px;
            right: 4px;
            background-color: #48bb78;
            color: #07170f;
            font-size: 10px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 10px;
            z-index: 10;
        }
        .pt-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            font-weight: 900;
            pointer-events: none;
            z-index: 10;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 0 2px 4px rgba(0,0,0,0.8);
        }
        .radar-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 8; }
        .pt-rank-god .radar-polygon { fill: rgba(255, 215, 0, 0.45); stroke: #ffd700; stroke-width: 1.5; }
        .pt-rank-god .pt-center { text-shadow: 0 0 10px #ffd700, 0 0 20px #ff8c00, 1px 1px 0 #000; }
        .pt-rank-s .radar-polygon { fill: rgba(255, 105, 180, 0.45); stroke: #ff69b4; stroke-width: 1.5; }
        .pt-rank-s .pt-center { text-shadow: 0 0 10px #ff69b4, 0 0 20px #da70d6, 1px 1px 0 #000; }
        .pt-rank-a .radar-polygon { fill: rgba(64, 224, 208, 0.45); stroke: #40e0d0; stroke-width: 1.5; }
        .pt-rank-a .pt-center { text-shadow: 0 0 10px #40e0d0, 0 0 20px #00bfff, 1px 1px 0 #000; }
        .pt-rank-b .radar-polygon { fill: rgba(72, 187, 120, 0.45); stroke: #48bb78; stroke-width: 1.5; }
        .pt-rank-b .pt-center { text-shadow: 0 0 8px #48bb78, 1px 1px 0 #000; }
        .watermark-text {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.4;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 5;
        }
        .card-name-bar {
            padding: 4px;
            text-align: center;
            font-size: 8.5px;
            height: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            line-height: 1.1;
            overflow: hidden;
            font-weight: bold;
            color: #ffffff;
        }
        .name-turf { background: linear-gradient(135deg, #1b4d23, #2d6a37); }
        .name-dirt { background: linear-gradient(135deg, #5c3f25, #8b5a2b); }
        .name-both { background: linear-gradient(135deg, #1b4d23 50%, #8b5a2b 50%); }
        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }
        .modal.hidden { display: none; }
        .modal-content {
            background-color: #07170f;
            border: 1px solid #1a4a32;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            position: relative;
            text-align: center;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 18px;
            cursor: pointer;
        }
        .trade-btn {
            width: 100%;
            background-color: #48bb78;
            color: #07170f;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-top: 12px;
            cursor: pointer;
        }
        .trade-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input, textarea {
            width: 100%;
            background-color: #143d28;
            border: 1px solid #236141;
            color: #ffffff;
            padding: 8px;
            border-radius: 6px;
            margin-top: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-book-open text-emerald-400"></i> コレクションルーム</h1>
        <div id="status"><i class="fa-solid fa-cloud-arrow-down animate-pulse"></i> 読込中...</div>
    </header>

    <nav class="nav-tabs" id="global-tabs">
        <a href="index.html" class="tab-btn"><i class="fa-solid fa-house"></i> ホーム</a>
        <button class="tab-btn active" onclick="switchTab('all')"><i class="fa-solid fa-id-card"></i> カード図鑑</button>
        <button class="tab-btn" onclick="switchTab('g1')"><i class="fa-solid fa-trophy"></i> G1ギャラリー</button>
    </nav>

    <div class="stats-container">
        <div class="stat-box"><div class="stat-title">獲得種類</div><div id="stat-owned-types" class="stat-val">0</div></div>
        <div class="stat-box"><div class="stat-title">全カード数</div><div id="stat-total-cards" class="stat-val" style="color: #ffffff;">0</div></div>
        <div class="stat-box"><div class="stat-title">コンプ率</div><div id="stat-comp-rate" class="stat-val">0%</div></div>
    </div>

    <div class="filter-container" id="filter-container">
        <button class="filter-btn active" onclick="filterGen('all')">すべて</button>
    </div>

    <main>
        <div id="card-grid" class="card-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #a0aec0;">
                <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 8px;"></i>
                <div>カードデータを読み込み中...</div>
            </div>
        </div>
    </main>

    <!-- Card Details Modal -->
    <div id="card-modal" class="modal hidden">
        <div class="modal-content">
            <button onclick="closeModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div id="modal-content"></div>
            <button id="trade-btn" class="trade-btn"><i class="fa-solid fa-handshake"></i> トレードに出品する</button>
        </div>
    </div>

    <!-- Trade Modal -->
    <div id="trade-modal" class="modal hidden">
        <div class="modal-content" style="text-align: left;">
            <h3 style="font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-repeat text-emerald-400"></i> トレード出品条件設定
            </h3>
            <div id="trade-offered-card" style="margin-bottom: 12px; padding: 8px; background: rgba(26,74,50,0.5); border-radius: 6px;"></div>
            <form id="trade-form" onsubmit="event.preventDefault();">
                <label style="font-size: 11px; color: #a0aec0;">希望条件（馬名を直接入力）</label>
                <input type="text" placeholder="希望馬名 1">
                <label style="font-size: 11px; color: #a0aec0; margin-top: 8px; display: block;">出品コメント</label>
                <textarea placeholder="コメントを入力..." rows="3"></textarea>
                <div style="display: flex; justify-end; gap: 8px; margin-top: 12px;">
                    <button type="button" onclick="closeTradeModal()" style="background: none; border: none; color: #a0aec0; cursor: pointer; font-size: 12px;">キャンセル</button>
                    <button type="submit" class="trade-btn" style="width: auto; padding: 6px 16px; margin-top: 0;">出品する</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentTab = 'all';
        let selectedGen = 'all';
        let masterCards = [];
        let userInventory = {};

        const calcR = (val) => (val / 20) * 45;
        function getPtRankClass(pt) {
            if (pt >= 99) return 'pt-rank-god';
            if (pt >= 95) return 'pt-rank-s';
            if (pt >= 90) return 'pt-rank-a';
            return 'pt-rank-b';
        }
        function getSurfaceClass(card) {
            const turf = card.turfAptitude || card.turfPt || 0;
            const dirt = card.dirtAptitude || card.dirtPt || 0;
            if (turf > 0 && dirt > 0) return 'name-both';
            if (dirt > 0) return 'name-dirt';
            return 'name-turf';
        }

        window.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    await loadUserInventory(user.uid);
                }
                await loadMasterCards();
                renderFilterButtons();
                renderCollection();
            });
        });

        async function loadMasterCards() {
            try {
                const querySnapshot = await getDocs(collection(db, "cards"));
                masterCards = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                document.getElementById('status').innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> 同期完了`;
            } catch (e) {
                console.error("Error loading cards: ", e);
                document.getElementById('status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> エラー`;
            }
        }

        async function loadUserInventory(uid) {
            try {
                const userDoc = await getDoc(doc(db, "users", uid));
                if (userDoc.exists()) {
                    userInventory = userDoc.data().inventory || {};
                }
            } catch (e) {
                console.error("Error loading inventory: ", e);
            }
        }

        function getGenGroupInfo(birthYear) {
            const y = parseInt(birthYear, 10);
            if (isNaN(y) || y >= 2020) return null;
            if (y <= 1980) return { key: 'gen1', label: '〜1980年' };
            if (y <= 1985) return { key: 'gen2', label: '1981〜1985年' };
            if (y <= 1990) return { key: 'gen3', label: '1986〜1990年' };
            if (y <= 1991) return { key: 'gen4', label: '1991〜1995年' };
            if (y <= 2000) return { key: 'gen5', label: '1996〜2000年' };
            if (y <= 2005) return { key: 'gen6', label: '2001〜2005年' };
            if (y <= 2010) return { key: 'gen7', label: '2006〜2010年' };
            if (y <= 2015) return { key: 'gen8', label: '2011〜2015年' };
            if (y <= 2019) return { key: 'gen9', label: '2016〜2019年' };
            return null;
        }

        function renderFilterButtons() {
            const container = document.getElementById('filter-container');
            const gens = [
                { key: 'all', label: 'すべて' },
                { key: 'gen1', label: '〜1980年' },
                { key: 'gen2', label: '1981〜1985年' },
                { key: 'gen3', label: '1986〜1990年' },
                { key: 'gen4', label: '1991〜1995年' },
                { key: 'gen5', label: '1996〜2000年' },
                { key: 'gen6', label: '2001〜2005年' },
                { key: 'gen7', label: '2006〜2010年' },
                { key: 'gen8', label: '2011〜2015年' },
                { key: 'gen9', label: '2016〜2019年' }
            ];
            container.innerHTML = gens.map(g => `
                <button class="filter-btn ${selectedGen === g.key ? 'active' : ''}" onclick="filterGen('${g.key}')">${g.label}</button>
            `).join('');
        }

        window.filterGen = function(genKey) {
            selectedGen = genKey;
            renderFilterButtons();
            renderCollection();
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCollection();
        };

        function renderCollection() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            let filteredCards = masterCards.filter(card => {
                const genInfo = getGenGroupInfo(card.birthYear);
                if (genInfo === null) return false;
                if (selectedGen !== 'all' && genInfo.key !== selectedGen) return false;
                if (currentTab === 'g1') return card.isG1Winner === true;
                return true;
            });

            let ownedCount = 0;
            filteredCards.forEach(card => {
                const count = userInventory[card.id] || 0;
                if (count > 0) ownedCount++;
                
                const turfPt = card.turfPt || card.pt || 0;
                const dirtPt = card.dirtPt || 0;
                const displayPt = Math.max(turfPt, dirtPt);
                const rankClass = getPtRankClass(displayPt);
                const surfaceClass = getSurfaceClass(card);
                const stats = card.stats || { speed: 10, stamina: 10, power: 10, guts: 10, wisdom: 10 };
                const rSpeed = calcR(stats.speed || 10);
                const rStamina = calcR(stats.stamina || 10);
                const rPower = calcR(stats.power || 10);
                const rGuts = calcR(stats.guts || 10);
                const rWisdom = calcR(stats.wisdom || 10);
                const pts = [
                    [50 + rSpeed * Math.sin(0), 50 - rSpeed * Math.cos(0)],
                    [50 + rStamina * Math.sin(1.2566), 50 - rStamina * Math.cos(1.2566)],
                    [50 + rPower * Math.sin(2.5132), 50 - rPower * Math.cos(2.5132)],
                    [50 + rGuts * Math.sin(3.7699), 50 - rGuts * Math.cos(3.7699)],
                    [50 + rWisdom * Math.sin(5.0265), 50 - rWisdom * Math.cos(5.0265)]
                ].map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

                const cardEl = document.createElement('div');
                cardEl.className = `card-item ${rankClass} ${count > 0 ? '' : 'not-owned'}`;
                cardEl.onclick = () => openModal(card, count);
                cardEl.innerHTML = `
                    <div class="card-media">
                        <span class="birth-year-badge">${card.birthYear || '----'}年</span>
                        ${count > 0 ? `<span class="count-badge">x${count}</span>` : ''}
                        <img src="${card.imageUrl || 'https://via.placeholder.com/300x400?text=No+Image'}" alt="${card.name}">
                        <svg class="radar-svg" viewBox="0 0 100 100"><polygon class="radar-polygon" points="${pts}"/></svg>
                        <div class="pt-center">${displayPt} PT</div>
                        <div class="watermark-text">${card.runningStyle || ''}</div>
                    </div>
                    <div class="card-name-bar ${surfaceClass}">
                        ${card.name || '不明の競走馬'}
                    </div>
                `;
                grid.appendChild(cardEl);
            });

            document.getElementById('stat-owned-types').innerText = ownedCount;
            document.getElementById('stat-total-cards').innerText = filteredCards.length;
            const rate = filteredCards.length > 0 ? Math.round((ownedCount / filteredCards.length) * 100) : 0;
            document.getElementById('stat-comp-rate').innerText = `${rate}%`;
        }

        window.openModal = function(card, count) {
            const modal = document.getElementById('card-modal');
            const content = document.getElementById('modal-content');
            const tradeBtn = document.getElementById('trade-btn');
            content.innerHTML = `
                <div style="width: 140px; aspect-ratio: 3/4; margin: 0 auto 12px; border-radius: 8px; overflow: hidden;">
                    <img src="${card.imageUrl || 'https://via.placeholder.com/300x400?text=No+Image'}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-size: 11px; color: #48bb78; font-weight: bold;">${card.rarity || 'NORMAL'}</div>
                <h2 style="font-size: 16px; margin: 4px 0 8px;">${card.name}</h2>
                <p style="font-size: 11px; color: #a0aec0; margin-bottom: 12px;">${card.description || '詳細情報はありません。'}</p>
                <div style="background: rgba(26,74,50,0.5); padding: 6px; border-radius: 6px; font-size: 12px;">
                    所持数: <strong style="color: #ffffff;">${count}</strong> 枚
                </div>
            `;
            if (count > 1) {
                tradeBtn.disabled = false;
                tradeBtn.onclick = () => { closeModal(); openTradeModal(card); };
            } else {
                tradeBtn.disabled = true;
            }
            modal.classList.remove('hidden');
        };

        window.closeModal = function() {
            document.getElementById('card-modal').classList.add('hidden');
        };

        window.openTradeModal = function(card) {
            const tradeModal = document.getElementById('trade-modal');
            const offeredCardContainer = document.getElementById('trade-offered-card');
            offeredCardContainer.innerHTML = `
                <div style="font-size: 11px; color: #48bb78; font-weight: bold;">${card.rarity || 'NORMAL'}</div>
                <div style="font-size: 14px; font-weight: bold;">${card.name}</div>
            `;
            tradeModal.classList.remove('hidden');
        };

        window.closeTradeModal = function() {
            document.getElementById('trade-modal').classList.add('hidden');
        };
    </script>
</body>
</html>
