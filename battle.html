<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - CPU対戦シリーズ選択</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --gold: #c29b1d;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 900px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }
  .btn-back:hover { background: var(--accent-color); color: #ffffff; }

  /* シリーズ一覧 */
  .series-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 12px;
  }
  .series-card {
    background-color: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .series-header {
    display: flex;
    flex-direction: column;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 6px;
  }
  .series-title { font-size: 15px; font-weight: bold; color: var(--accent-color); }
  .series-subtitle { font-size: 11px; color: var(--text-sub); font-weight: bold; margin-top: 4px; }
  
  .race-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 8px;
  }
  .race-item {
    display: flex;
    align-items: center;
    font-size: 11px;
    border-bottom: 1px dashed #e2efe3;
    padding-bottom: 4px;
    margin-bottom: 2px;
  }
  .race-item:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .race-num { font-weight: bold; color: var(--text-sub); width: 35px; }
  .race-name { flex: 1; font-weight: bold; color: var(--text-main); }
  .race-cond { color: var(--text-sub); font-size: 10px; display: flex; gap: 4px; align-items: center;}
  
  .surface-badge {
    padding: 2px 4px;
    border-radius: 3px;
    color: #fff;
    font-size: 9px;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }

  .btn-challenge {
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    margin-top: auto;
  }
  .btn-challenge:hover { background: var(--accent-hover); }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="index.html" class="btn-back">← メインメニュー</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">CPU対戦 - シリーズ選択</h2>

  function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.textContent = msg;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'auth.html';
      return;
    }
    currentUser = user;
    setSyncStatus("☁️ データ読み込み中...");

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (!userDoc.exists()) {
        window.location.href = 'setup.html';
        return;
      }

      try {
        const res = await fetch('./data/series_master.json');
        if (res.ok) SERIES_MASTER = await res.json();
        else SERIES_MASTER = DEFAULT_SERIES;
      } catch (e) {
        SERIES_MASTER = DEFAULT_SERIES;
      }

      setSyncStatus("✅ 準備完了");
      renderSeriesList();
    } catch (err) {
      console.error("初期化エラー:", err);
      setSyncStatus("❌ 読込エラー");
    }
  });

  // シリーズ一覧の描画
  function renderSeriesList() {
    const container = document.getElementById('seriesGrid');
    container.innerHTML = '';

    SERIES_MASTER.forEach(series => {
      const card = document.createElement('div');
      card.className = 'series-card';

      // 最初のラウンド(5レース)を描画
      const races = series.rounds[0].races;
      let raceListHtml = races.map(r => {
        const surfaceClass = r.surface === '芝' ? 'surface-turf' : 'surface-dirt';
        return `
          <div class="race-item">
            <span class="race-num">第${r.race_num}戦</span>
            <span class="race-name">${r.race_name}</span>
            <span class="race-cond">
              <span class="surface-badge ${surfaceClass}">${r.surface}</span>
              ${r.track} ${r.distance}m
            </span>
          </div>
        `;
      }).join('');

      card.innerHTML = `
        <div class="series-header">
          <span class="series-title">${series.series_name}</span>
          <span class="series-subtitle">${series.rounds[0].round_title}</span>
        </div>
        <div class="race-list">
          ${raceListHtml}
        </div>
        <button class="btn-challenge" onclick="startSeries('${series.series_id}')">
          このシリーズに挑戦
        </button>
      `;
      container.appendChild(card);
    });
  }

  // 出走登録画面へ遷移
  window.startSeries = function(seriesId) {
    // 選択されたシリーズIDのみ保存
    sessionStorage.setItem('selected_series_id', seriesId);
    
    // 次の画面（matchup.html）へ
    window.location.href = 'matchup.html';
  };
</script>
</body>
</html>
