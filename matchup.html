<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DERBY BATTLE CARD - 出走登録</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #a3d9a5 0%, #7ec885 50%, #5ba863 100%);
    --panel-bg: rgba(255, 255, 255, 0.94);
    --accent-color: #2d6a37;
    --accent-hover: #1b4d23;
    --text-main: #1a2e1d;
    --text-sub: #4e6b52;
    --border-color: #b2d4b6;
    --turf-color: #4CAF50;
    --dirt-color: #8D6E63;
    --danger-color: #d9534f;
  }
  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    margin: 0;
    padding: 15px;
    font-size: 13px;
    display: flex;
    justify-content: center;
  }
  .container { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 650px; }
  
  .header-panel {
    background-color: var(--panel-bg);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-back {
    background: #ffffff;
    color: var(--accent-color);
    border: 1px solid var(--accent-color);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;
    text-decoration: none;
  }

  /* シリーズ戦績パネル */
  .series-progress-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
  }

  /* カウンター・制限バー */
  .status-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 15px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .status-item { text-align: center; }
  .status-label { font-size: 10px; color: var(--text-sub); display: block; margin-bottom: 2px; }
  .status-val { font-size: 14px; font-weight: bold; }
  .status-val.error { color: var(--danger-color); }
  .status-val.ok { color: var(--accent-color); }

  /* レースごとのエントリー枠 */
  .entry-card {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .race-info-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .race-title { font-weight: bold; font-size: 13px; color: var(--accent-color); }
  .race-cond-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    color: white;
    font-weight: bold;
  }
  .surface-turf { background-color: var(--turf-color); }
  .surface-dirt { background-color: var(--dirt-color); }

  .select-horse-dropdown {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: #ffffff;
    font-size: 12px;
    font-weight: bold;
    color: var(--text-main);
  }

  .horse-detail-preview {
    font-size: 11px;
    color: var(--text-sub);
    display: flex;
    justify-content: space-between;
    background: #f7fbf7;
    padding: 6px 8px;
    border-radius: 4px;
  }

  .action-group {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .btn-submit {
    flex: 2;
    background: var(--accent-color);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 0 var(--accent-hover);
  }
  .btn-submit:disabled { background: #a0a0a0; box-shadow: 0 4px 0 #7a7a7a; cursor: not-allowed; }

  .btn-giveup {
    flex: 1;
    background: #ffffff;
    color: var(--danger-color);
    border: 2px solid var(--danger-color);
    padding: 15px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header-panel">
    <a href="battle.html" class="btn-back">← 出走お題へ</a>
    <h2 style="margin:0; font-size: 16px; color: var(--accent-color);">出走馬エントリー</h2>
    <div id="syncStatus" style="font-size: 11px; color: var(--text-sub); font-weight: bold;">☁️ 読込中...</div>
  </div>

  <!-- シリーズ回戦・成績表示 -->
  <div class="series-progress-bar">
    <span id="seriesRoundDisplay">第 1 回戦 (全5回戦)</span>
    <span id="seriesRecordDisplay" style="color: var(--accent-color);">0勝 0敗</span>
  </div>

  <!-- 合計ポテンシャル＆条件リアルタイム監視 -->
  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">登録頭数</span>
      <span class="status-val" id="registeredCount">0 / 5</span>
    </div>
    <div class="status-item">
      <span class="status-label">性別制限</span>
      <span class="status-val" id="sexLimitDisplay" style="color: #c67100;">制限なし</span>
    </div>
    <div class="status-item">
      <span class="status-label">合計ポテンシャル</span>
      <span class="status-val" id="totalPotential">0 / 95</span>
    </div>
    <div class="status-item">
      <span class="status-label">制限判定</span>
      <span class="status-val" id="limitStatus">未完了</span>
    </div>
  </div>

  <!-- 5レース分の選択リスト -->
  <div id="entryList" style="display:flex; flex-direction:column; gap:10px;"></div>

  <div class="action-group">
    <button class="btn-giveup" onclick="giveUpSeries()">ギブアップ<br><span style="font-size:10px;">(不戦敗)</span></button>
    <button class="btn-submit" id="btnBattleStart" disabled onclick="startMatch()">対戦開始！</button>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  let currentUser = null;
  let globalUserData = null;
  let SERIES_MASTER = [];
  let HORSES_MASTER = {};
  
  let currentSeries = null;
  let deckHorses = []; // 選択デックの18頭リスト
  let selectedEntries = [null, null, null, null, null]; // 5レース分の選択ID
  let usedCardsHistory = [];

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'auth.html'; return; }
    currentUser = user;

    try {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) globalUserData = userDoc.data();

      const [resSeries, resHorses] = await Promise.all([
        fetch('./data/series_master.json'),
        fetch('./data/horses_master.json')
      ]);
      
      if (resSeries.ok) SERIES_MASTER = await resSeries.json();
      if (resHorses.ok) {
        const list = await resHorses.json();
        list.forEach(h => HORSES_MASTER[h.horse_id] = h);
      }

      // ★ 修正: sessionStorage ではなく Firebase から使用済み履歴を取得
      usedCardsHistory = globalUserData?.cpu_battle_status?.used_cards_history || [];
      initMatchup();
      document.getElementById('syncStatus').textContent = "✅";
    } catch (e) {
      console.error(e);
      document.getElementById('syncStatus').textContent = "❌ エラー";
    }
  });

  function initMatchup() {
    // ★ 修正: sessionStorage ではなく Firebase のステータスから各種情報を取得
    const status = globalUserData?.cpu_battle_status || {};
    const seriesId = status.selected_series_id || (status.series_lineup ? status.series_lineup[(status.current_round || 1) - 1] : null);
    const deckIdx = status.selected_deck_index || 0;

    currentSeries = SERIES_MASTER.find(s => s.series_id === seriesId) || SERIES_MASTER[0];
    
    const currentRound = status.current_round || 1;
    const wins = status.series_wins || 0;
    const losses = status.series_losses || 0;
    
    document.getElementById('seriesRoundDisplay').textContent = `第 ${currentRound} 回戦 (全5回戦)`;
    document.getElementById('seriesRecordDisplay').textContent = `${wins}勝 ${losses}敗`;

    // 性別制限表示の更新
    const sexLimit = currentSeries.sex || "制限なし";
    document.getElementById('sexLimitDisplay').textContent = sexLimit;

    // デック内18頭のデータを取得
    const deck = (globalUserData.decks || [])[deckIdx] || { horse_ids: [] };
    deckHorses = (deck.horse_ids || []).map(id => HORSES_MASTER[id]).filter(h => h !== undefined);

    renderEntryCards();
    updateStatus();
  }

  // 性別適合判定
  function isValidSex(horseSex, seriesSex) {
    if (!seriesSex || seriesSex === "制限なし") return true;
    if (seriesSex === "牝馬限定") return horseSex === "牝";
    if (seriesSex === "牡牝限定") return horseSex === "牡" || horseSex === "牝";
    return true;
  }

  // 馬の適性距離文字列（例: "1600-2400" または "1600"）を取得するヘルパー関数
  function getHorseDistanceString(horse) {
    if (!horse) return '';
    if (horse.distance) return String(horse.distance);
    if (horse.aptitude && horse.aptitude.min_distance && horse.aptitude.max_distance) {
      return `${horse.aptitude.min_distance}-${horse.aptitude.max_distance}`;
    }
    return '';
  }

  // 距離適性適合判定（文字列解析対応）
  function isValidDistance(horse, raceDistance) {
    if (!horse) return false;
    const distStr = getHorseDistanceString(horse);
    if (!distStr) return true; // 適性距離データが無い場合は制限なしとみなす

    const target = parseInt(raceDistance, 10);

    if (distStr.includes('-')) {
      const [minStr, maxStr] = distStr.split('-');
      const min = parseInt(minStr, 10);
      const max = parseInt(maxStr, 10);
      return target >= min && target <= max;
    } else {
      return parseInt(distStr, 10) === target;
    }
  }

  function renderEntryCards() {
    const races = currentSeries.rounds[0].races;
    const container = document.getElementById('entryList');
    container.innerHTML = '';

    races.forEach((race, rIdx) => {
      const card = document.createElement('div');
      card.className = 'entry-card';

      const surfaceClass = race.surface === '芝' ? 'surface-turf' : 'surface-dirt';

      card.innerHTML = `
        <div class="race-info-header">
          <span class="race-title">第${race.race_num}戦: ${race.race_name}</span>
          <span class="race-cond-badge ${surfaceClass}">${race.surface} ${race.track} ${race.distance}m</span>
        </div>
        <select class="select-horse-dropdown" id="selectRace${rIdx}" onchange="onHorseSelected(${rIdx}, this.value)">
          <option value="">-- 出走馬を選択してください --</option>
        </select>
        <div class="horse-detail-preview" id="previewRace${rIdx}">
          <span>性別: - | Pt: -</span>
          <span>適性: -</span>
        </div>
      `;
      container.appendChild(card);
    });

    populateDropdowns();
  }

  function populateDropdowns() {
    const races = currentSeries.rounds[0].races;
    const seriesSexLimit = currentSeries.sex || "制限なし";

    races.forEach((race, rIdx) => {
      const select = document.getElementById(`selectRace${rIdx}`);
      const currentVal = selectedEntries[rIdx];

      select.innerHTML = '<option value="">-- 出走馬を選択してください --</option>';

      deckHorses.forEach(horse => {
        const horseSex = horse.sex || "牡";
        const isChosenElsewhere = selectedEntries.some((id, idx) => idx !== rIdx && id === horse.horse_id);
        const isUsedPrevious = usedCardsHistory.includes(horse.horse_id) || usedCardsHistory.includes(horse.name);
        const matchesSexLimit = isValidSex(horseSex, seriesSexLimit);
        
        // 距離適性の判定
        const matchesDist = isValidDistance(horse, race.distance);
        const distStr = getHorseDistanceString(horse);
        const distLabel = distStr ? ` [${distStr}m]` : '';

        if (!isChosenElsewhere && matchesSexLimit) {
          const opt = document.createElement('option');
          opt.value = horse.horse_id;
          
          if (isUsedPrevious) {
            opt.textContent = `[使用済] ${horse.name}`;
            opt.disabled = true;
          } else if (!matchesDist) {
            opt.textContent = `[適性外:${distStr}m] ${horse.name}`;
            opt.disabled = true;
          } else {
            opt.textContent = `[${horseSex}] ${horse.name}${distLabel} (Pt: ${horse.potential || horse.pt || '-'})`;
          }
          
          if (horse.horse_id === currentVal) opt.selected = true;
          select.appendChild(opt);
        }
      });
    });
  }

  window.onHorseSelected = function(raceIdx, horseId) {
    selectedEntries[raceIdx] = horseId || null;
    
    const preview = document.getElementById(`previewRace${raceIdx}`);
    if (horseId && HORSES_MASTER[horseId]) {
      const horse = HORSES_MASTER[horseId];
      const sex = horse.sex || "牡";
      const pt = horse.potential || horse.pt || "-";
      const surfaceText = (horse.aptitude?.turf === "A" && horse.aptitude?.dirt === "A") || (horse.turf && horse.dirt) ? "万" : (horse.aptitude?.turf === "A" || horse.turf ? "芝" : "ダ");
      const distStr = getHorseDistanceString(horse);

      preview.innerHTML = `
        <span>性別: <strong>${sex}</strong> | Pt: <strong>${pt}</strong></span>
        <span>適性: ${surfaceText} (${distStr ? distStr + 'm' : '-'})</span>
      `;
    } else {
      preview.innerHTML = `<span>性別: - | Pt: -</span><span>適性: -</span>`;
    }

    populateDropdowns();
    updateStatus();
  };

  function updateStatus() {
    const races = currentSeries.rounds[0].races;
    const limits = currentSeries.potential_limit || { min_potential_per_race: 15, max_total_potential: 95 };
    const seriesSexLimit = currentSeries.sex || "制限なし";
    
    let totalPt = 0;
    let count = 0;
    let hasMinPtError = false;
    let hasSexError = false;
    let hasDistError = false;

    selectedEntries.forEach((id, rIdx) => {
      if (id && HORSES_MASTER[id]) {
        count++;
        const horse = HORSES_MASTER[id];
        const race = races[rIdx];
        const pt = parseInt(horse.potential || horse.pt || 0, 10);
        totalPt += pt;

        if (pt < limits.min_potential_per_race) {
          hasMinPtError = true;
        }

        const horseSex = horse.sex || "牡";
        if (!isValidSex(horseSex, seriesSexLimit)) {
          hasSexError = true;
        }

        if (!isValidDistance(horse, race.distance)) {
          hasDistError = true;
        }
      }
    });

    document.getElementById('registeredCount').textContent = `${count} / 5`;
    
    const ptEl = document.getElementById('totalPotential');
    ptEl.textContent = `${totalPt} / ${limits.max_total_potential}`;

    const limitEl = document.getElementById('limitStatus');
    const startBtn = document.getElementById('btnBattleStart');

    const isTotalOk = totalPt <= limits.max_total_potential;
    const isAllSelected = count === 5;

    if (!isTotalOk) {
      ptEl.className = 'status-val error';
      limitEl.textContent = '合計オーバー';
      limitEl.className = 'status-val error';
      startBtn.disabled = true;
    } else if (hasMinPtError) {
      limitEl.textContent = `Pt${limits.min_potential_per_race}未満不可`;
      limitEl.className = 'status-val error';
      startBtn.disabled = true;
    } else if (hasSexError) {
      limitEl.textContent = '性別条件違反';
      limitEl.className = 'status-val error';
      startBtn.disabled = true;
    } else if (hasDistError) {
      limitEl.textContent = '距離適性違反';
      limitEl.className = 'status-val error';
      startBtn.disabled = true;
    } else if (isAllSelected) {
      ptEl.className = 'status-val ok';
      limitEl.textContent = 'OK';
      limitEl.className = 'status-val ok';
      startBtn.disabled = false;
    } else {
      ptEl.className = 'status-val';
      limitEl.textContent = '選択中';
      limitEl.className = 'status-val';
      startBtn.disabled = true;
    }
  }

  // ギブアップ処理（不戦敗）
  window.giveUpSeries = async function() {
    if (!confirm("このシリーズをギブアップ（不戦敗）しますか？")) return;

    if (!globalUserData || !globalUserData.cpu_battle_status) return;

    let status = globalUserData.cpu_battle_status;
    status.series_losses += 1;
    status.current_round += 1;

    try {
      await updateDoc(doc(db, "users", currentUser.uid), { cpu_battle_status: status });
      
      if (status.series_losses >= 3) {
        alert("3敗に達したため、シリーズ挑戦失敗（敗退）となります。");
      } else {
        alert(`ギブアップしました。(現在 ${status.series_losses}敗)\n次の回戦へ進みます。`);
      }
      window.location.href = 'battle.html';
    } catch (err) {
      console.error("更新エラー", err);
      alert("通信エラーが発生しました。");
    }
  };

  // ★ 修正: sessionStorage への保持を廃止し、Firebase (Firestore) に直接保存して画面遷移
  window.startMatch = async function() {
    if (!currentUser) return;

    const btn = document.getElementById('btnBattleStart');
    btn.disabled = true;
    btn.textContent = "データ保存中...";

    try {
      // strategy.html が参照する構造 (player_entries) に整形
      const formattedEntries = selectedEntries.map(id => ({
        horse_id: id,
        strategy: "先行",  // 作戦のデフォルト値
        strategy_level: 3 // レベルのデフォルト値
      }));

      // Firebaseへ保存
      await updateDoc(doc(db, "users", currentUser.uid), {
        "cpu_battle_status.current_match.player_entries": formattedEntries
      });

      // 念のため古いセッション情報を破棄
      sessionStorage.removeItem('player_entry_ids');

      // 作戦決定画面へ遷移
      window.location.href = 'strategy.html';
    } catch (err) {
      console.error("保存エラー:", err);
      alert("データの保存に失敗しました。再度お試しください。");
      btn.disabled = false;
      btn.textContent = "対戦開始！";
    }
  };
</script>

</body>
</html>
